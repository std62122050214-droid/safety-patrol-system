<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334e68; }
        .month-card { transition: all 0.3s ease; cursor: pointer; border-radius: 1.5rem; background: #ffffff; padding: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .hidden { display: none !important; }
        .stat-badge { display: flex; justify-content: space-between; padding: 0.6rem 0.8rem; border-radius: 0.75rem; margin-top: 0.5rem; font-size: 0.85rem; font-weight: 700; }
        .input-box { width: 100%; padding: 0.8rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 1rem; outline: none; transition: border 0.2s; }
        .input-box:focus { border-color: #3b82f6; background: #fff; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal-container { background: white; width: 100%; max-width: 42rem; border-radius: 2.5rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .scroll-area { overflow-y: auto; flex: 1; padding: 2rem; }
        .img-preview { width: 100%; max-height: 300px; object-fit: cover; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
        .info-box-blue { background-color: #eff6ff; border: 1px solid #dbeafe; border-radius: 1rem; padding: 1rem; }
        .info-box-green { background-color: #ecfdf5; border: 1px solid #d1fae5; border-radius: 1rem; padding: 1rem; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-6 flex items-center justify-center gap-3">
                <i data-lucide="shield-check" class="text-blue-600" size="40"></i> Safety Patrol & 5S 👷
            </h1>
            <div class="inline-flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-slate-500 font-bold">เลือกปี:</span>
                <select id="yearSelect" class="bg-transparent font-black text-blue-600 outline-none cursor-pointer text-xl"></select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-10">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 mb-6 no-print">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="flex items-center gap-2 font-bold text-slate-500 hover:text-blue-600 transition-colors">
                    <i data-lucide="chevron-left"></i> ย้อนกลับ
                </button>
                <h2 id="currentMonthTitle" class="font-black text-slate-800 text-xl"></h2>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">
                    <i data-lucide="plus-circle" size="20"></i> เพิ่มข้อมูล
                </button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-6"></div>
    </div>

    <div id="modal-detail" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="px-8 py-4 border-b flex justify-between items-center bg-slate-50/50">
                <button id="deleteBtn" class="text-red-500 font-bold text-xs bg-red-50 hover:bg-red-100 px-4 py-2 rounded-full transition-colors flex items-center gap-2">
                    <i data-lucide="trash-2" size="14"></i> ลบข้อมูล
                </button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x-circle" size="28"></i>
                </button>
            </div>
            <div class="scroll-area">
                <div id="detailViewContent" class="space-y-6"></div>
                
                <div id="updateSection" class="mt-10 pt-8 border-t border-dashed border-slate-200">
                    <h4 class="font-black text-slate-800 mb-6 flex items-center gap-2 text-lg">
                        <i data-lucide="settings-2" class="text-orange-500"></i> อัปเดตการแก้ไขงาน
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase mb-1 block ml-2">วันที่แก้ไขจริง</label>
                            <input type="date" id="upActualDate" class="input-box">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase mb-1 block ml-2">สถานะงาน</label>
                            <select id="upStatus" class="input-box">
                                <option value="รอดำเนินการ">รอดำเนินการ</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="text-[11px] font-bold text-slate-400 uppercase mb-2 block ml-2">📸 รูปภาพหลักฐานหลังแก้ไข</label>
                        <input type="file" id="upImgAfter" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                    </div>
                    <button id="saveUpdateBtn" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black text-lg shadow-xl hover:bg-slate-900 transition-all">
                        บันทึกการแก้ไข
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="px-8 py-6 border-b flex justify-between items-center bg-blue-50/30">
                <h3 class="text-xl font-black text-blue-900">เพิ่มรายการตรวจพบ 📝</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" size="28"></i></button>
            </div>
            <div class="scroll-area">
                <form id="mainForm" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-slate-500 ml-2">วันที่ตรวจ</label><input type="date" id="postDate" required class="input-box"></div>
                        <div><label class="text-xs font-bold text-slate-500 ml-2">ผู้รายงาน (Reporter)</label><input type="text" id="reporter" placeholder="ชื่อคุณ" required class="input-box"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-slate-500 ml-2">แผนก/พื้นที่</label>
                            <select id="dept" class="input-box">
                                <option value="Welding">Welding</option>
                                <option value="Assembly">Assembly</option>
                                <option value="Manufacturing">Manufacturing</option>
                                <option value="Inventory">Inventory</option>
                            </select>
                        </div>
                        <div><label class="text-xs font-bold text-slate-500 ml-2">กำหนดเสร็จ (Due)</label><input type="date" id="dueDate" required class="input-box"></div>
                    </div>
                    <div><label class="text-xs font-bold text-slate-500 ml-2">ปัญหาที่พบ</label><textarea id="detail" rows="3" placeholder="อธิบายสิ่งที่พบ..." required class="input-box"></textarea></div>
                    <div><label class="text-xs font-bold text-slate-500 ml-2">แนวทางแก้ไข</label><textarea id="solution" rows="2" placeholder="ระบุวิธีแก้ไข..." class="input-box"></textarea></div>
                    <div><label class="text-xs font-bold text-slate-500 ml-2">ผู้รับผิดชอบ (PIC)</label><input type="text" id="owner" placeholder="ระบุชื่อผู้รับผิดชอบ" required class="input-box"></div>
                    <div><label class="text-xs font-bold text-slate-500 ml-2">รูปภาพที่พบปัญหา</label><input type="file" id="imgBefore" accept="image/*" class="w-full text-sm"></div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:bg-blue-700 transition-all mt-4">บันทึกข้อมูลลงระบบ</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card';
                div.innerHTML = `<div class="font-black text-slate-800 text-lg mb-4 flex items-center justify-between">${m} <i data-lucide="calendar-days" class="text-slate-300"></i></div><div id="stats-${monthId}"></div>`;
                
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        const pending = total - done;
                        statsDiv.innerHTML = `
                            <div class="stat-badge bg-blue-50 text-blue-700"><span>พบทั้งหมด</span> <span>${total}</span></div>
                            <div class="stat-badge bg-emerald-50 text-emerald-700"><span>แก้ไขแล้ว</span> <span>${done}</span></div>
                            <div class="stat-badge bg-orange-50 text-orange-700"><span>คงเหลือ</span> <span>${pending}</span></div>
                        `;
                    } else { 
                        statsDiv.innerHTML = `<div class="text-center py-6 text-slate-300 text-xs font-bold italic">ยังไม่มีรายการบันทึก</div>`; 
                    }
                });

                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden'); 
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData(); 
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="bg-white p-6 rounded-[2rem] shadow-sm border-l-[10px] ${isDone ? 'border-emerald-500' : 'border-orange-500'} cursor-pointer hover:shadow-md transition-all">
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-[11px] font-black bg-slate-100 px-3 py-1 rounded-full text-slate-500 uppercase tracking-wider">📍 ${item.dept}</span>
                                    <span class="text-xs font-black ${isDone ? 'text-emerald-600' : 'text-orange-600'} bg-white px-3 py-1 rounded-full border shadow-sm">${item.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-800 text-lg leading-tight mb-5">${item.detail}</h3>
                                <div class="grid grid-cols-2 gap-2 pt-4 border-t border-slate-50">
                                    <div class="text-[11px] font-bold text-emerald-600">👤 ผู้รายงาน: ${item.reporter}</div>
                                    <div class="text-[11px] font-bold text-red-400 text-right">📅 Due: ${item.dueDate}</div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailViewContent');
            const updateSec = document.getElementById('updateSection');
            if(item.status === 'เสร็จสิ้น') updateSec.classList.add('hidden');
            else updateSec.classList.remove('hidden');

            content.innerHTML = `
                <div>
                    <h2 class="text-xl font-black text-slate-800 leading-snug mb-4">${item.detail}</h2>
                    <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100 mb-6">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">แนวทางการแก้ไข (Solution)</p>
                        <p class="text-slate-700 font-medium">${item.solution || '-'}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="info-box-blue">
                            <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">ผู้รับผิดชอบ (PIC)</p>
                            <p class="font-black text-blue-900 text-lg">${item.owner}</p>
                        </div>
                        <div class="info-box-green">
                            <p class="text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-1">ผู้รายงาน (Reporter)</p>
                            <p class="font-black text-emerald-900 text-lg">${item.reporter}</p>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <p class="text-[11px] font-black text-slate-400 uppercase ml-2">📸 รูปภาพที่พบ</p>
                        <img src="${item.imgBefore}" class="img-preview shadow-lg">
                    </div>
                    ${item.imgAfter ? `
                    <div class="space-y-2">
                        <p class="text-[11px] font-black text-emerald-500 uppercase ml-2">✅ แก้ไขเสร็จเมื่อ: ${item.actualDate}</p>
                        <img src="${item.imgAfter}" class="img-preview border-4 border-emerald-100 shadow-lg">
                    </div>` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึกข้อมูล..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value, detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value, imgBefore: imgData || "",
                status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { 
                closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูลลงระบบ"; btn.disabled = false; 
            });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { 
                document.getElementById('modal-detail').classList.add('hidden'); btn.innerText = "บันทึกการแก้ไข"; btn.disabled = false;
            });
        };

        document.getElementById('deleteBtn').onclick = () => { if(confirm('⚠️ คุณแน่ใจใช่ไหมที่จะลบข้อมูลนี้?')) remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => document.getElementById('modal-detail').classList.add('hidden')); };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
