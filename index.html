<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👷Safety Patrol & 5S👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        
        /* Modal Responsive Fix */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 10px; backdrop-filter: blur(8px); }
        .modal-box { background: white; width: 100%; max-width: 46rem; border-radius: 1.5rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

        /* Input Field Scaling for Mobile */
        .input-field { 
            border: 2px solid #f1f5f9; 
            border-radius: 0.75rem; 
            padding: 0.65rem 0.85rem; /* ลดขนาด Padding ลง */
            width: 100%; 
            outline: none; 
            transition: 0.2s; 
            background: #f8fafc;
            font-size: 14px; /* ปรับขนาดฟอนต์ให้พอดีมือถือ */
        }
        @media (min-width: 768px) {
            .input-field { padding: 0.85rem; font-size: 16px; }
        }
        .input-field:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        /* Card Style */
        .case-card { background: white; border-radius: 1.25rem; border-left: 10px solid #cbd5e1; cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0; border-left-width: 10px; }
        .Safety { border-left-color: #ef4444; }
        .S5 { border-left-color: #3b82f6; }
        .Other { border-left-color: #a855f7; }

        /* Print Style */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #page-list { display: block !important; }
            .case-card { break-inside: avoid; margin-bottom: 25px !important; padding: 25px !important; border: 1px solid #eee !important; border-left: 12px solid !important; }
            .print-full { display: block !important; }
        }
        .print-full { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-5 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-8 md:mb-12">
            <div class="inline-block p-3 bg-blue-50 rounded-2xl mb-3">
                <i data-lucide="shield-check" class="text-blue-600" size="40"></i>
            </div>
            <h1 class="text-2xl md:text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">👷Safety Patrol & 5S👷‍♀️</h1>
            <div class="flex items-center justify-center">
                <div class="bg-white px-5 py-2 rounded-xl shadow-sm border border-slate-100 flex items-center gap-2">
                    <span class="text-slate-400 font-bold text-[10px] uppercase tracking-widest">ปีที่บันทึก:</span>
                    <select id="yearSelect" class="font-bold text-blue-600 outline-none bg-transparent text-lg cursor-pointer"></select>
                </div>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b p-3 md:p-4 mb-4 no-print shadow-sm">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1 text-sm">
                    <i data-lucide="arrow-left" size="18"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-bold text-slate-800 text-sm md:text-xl"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-white border p-2 rounded-xl text-slate-500"><i data-lucide="printer" size="18"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs md:text-sm shadow-lg shadow-blue-100">+ เพิ่มรายการ</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-3xl mx-auto px-4 space-y-4"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-3 border-b flex justify-between items-center bg-slate-50/50">
                <button id="btnDeletePop" class="text-red-500 font-bold text-[11px] flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-red-50">
                    <i data-lucide="trash-2" size="16"></i> ลบรายการ
                </button>
                <button onclick="closeModal('modal-view')" class="text-slate-400 p-1"><i data-lucide="x" size="20"></i></button>
            </div>
            <div id="viewDetailContent" class="overflow-y-auto p-5 md:p-10 space-y-6 bg-white text-sm"></div>
            <div class="p-4 border-t bg-white no-print">
                <button id="btnUpdatePop" class="w-full bg-orange-500 text-white py-3.5 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="check-circle" size="18"></i> อัปเดตสถานะงาน
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-4 border-b bg-blue-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-sm md:text-base flex items-center gap-2"><i data-lucide="plus-circle" size="18"></i> ลงบันทึกการตรวจพบ</h3>
                <button onclick="closeModal('modal-form')" class="text-white/70"><i data-lucide="x" size="20"></i></button>
            </div>
            <form id="mainForm" class="overflow-y-auto p-5 md:p-8 space-y-4 md:space-y-6">
                <div class="grid grid-cols-2 gap-3 md:gap-6">
                    <div><label class="text-[10px] font-bold text-slate-400 mb-1 block uppercase">📅 วันที่ตรวจ</label><input type="date" id="postDate" required class="input-field"></div>
                    <div><label class="text-[10px] font-bold text-slate-400 mb-1 block uppercase">👤 ผู้ตรวจพบ</label><input type="text" id="reporter" required class="input-field" placeholder="ชื่อ"></div>
                </div>
                <div class="grid grid-cols-2 gap-3 md:gap-6">
                    <div><label class="text-[10px] font-bold text-slate-400 mb-1 block uppercase">📍 แผนก</label>
                        <select id="dept" class="input-field">
                            <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>อื่นๆ</option>
                        </select>
                    </div>
                    <div><label class="text-[10px] font-bold text-slate-400 mb-1 block uppercase">🏷️ หมวดหมู่</label>
                        <select id="category" class="input-field">
                            <option value="Safety">Safety</option><option value="S5">5S</option><option value="Other">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div><label class="text-[10px] font-bold text-red-500 mb-1 block uppercase">⚠️ ปัญหาที่พบ</label><textarea id="detail" rows="2" required class="input-field border-red-50"></textarea></div>
                <div><label class="text-[10px] font-bold text-red-500 mb-1 block uppercase">📸 รูปภาพ Before</label><input type="file" id="imgBefore" accept="image/*" class="w-full text-[10px] text-slate-400"></div>
                
                <div class="bg-green-50/50 p-4 rounded-2xl border border-green-100 space-y-3 md:space-y-5">
                    <div><label class="text-[10px] font-bold text-green-600 mb-1 block uppercase">🛠️ วิธีแก้ไข</label><textarea id="solution" rows="2" class="input-field border-green-100"></textarea></div>
                    <div class="grid grid-cols-2 gap-3 md:gap-6">
                        <div><label class="text-[10px] font-bold text-green-600 mb-1 block uppercase">👷 ผู้รับผิดชอบ</label><input type="text" id="owner" required class="input-field border-green-100"></div>
                        <div><label class="text-[10px] font-bold text-green-600 mb-1 block uppercase">⏱️ กำหนดเสร็จ</label><input type="date" id="dueDate" required class="input-field border-green-100"></div>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 md:py-4 rounded-xl font-bold text-sm shadow-xl shadow-blue-100">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <div id="modal-update" class="modal-overlay hidden">
        <div class="modal-box max-w-md">
            <div class="p-4 border-b bg-orange-50 font-bold text-orange-700 flex justify-between items-center text-sm">
                <span>อัปเดตสถานะงาน</span>
                <button onclick="closeModal('modal-update')"><i data-lucide="x" size="20"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div><label class="text-[10px] font-bold text-slate-400 mb-1 block">วันเสร็จจริง</label><input type="date" id="upActualDate" class="input-field"></div>
                <div><label class="text-[10px] font-bold text-slate-400 mb-1 block">สถานะ</label>
                    <select id="upStatus" class="input-field"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 mb-1 block">รูปภาพ After</label><input type="file" id="upImgAfter" class="w-full text-[10px]"></div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeModal('modal-update')" class="flex-1 py-2.5 bg-slate-100 font-bold rounded-lg text-slate-400 text-xs">ยกเลิก</button>
                    <button id="saveUpdateBtn" class="flex-1 py-2.5 bg-orange-500 text-white font-bold rounded-lg text-xs shadow-md">ยืนยัน</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-5 rounded-2xl border border-slate-100 cursor-pointer hover:border-blue-400 transition-all shadow-sm group relative overflow-hidden';
                div.innerHTML = `
                    <div class="font-bold text-slate-700 text-sm mb-3 flex justify-between relative z-10">${m} <i data-lucide="arrow-right-circle" size="16" class="text-slate-200 group-hover:text-blue-500"></i></div>
                    <div id="stats-${mid}" class="relative z-10"></div>
                `;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const data = snap.val();
                    const statsDiv = document.getElementById(`stats-${mid}`);
                    if (data) {
                        const items = Object.values(data);
                        const total = items.length;
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="grid grid-cols-1 gap-1.5 text-[10px] font-bold">
                                <div class="flex justify-between py-1 px-2 bg-blue-50/50 rounded-lg text-blue-600"><span>พบ</span> <span>${total}</span></div>
                                <div class="flex justify-between py-1 px-2 bg-emerald-50/50 rounded-lg text-emerald-600"><span>แก้</span> <span>${done}</span></div>
                                <div class="flex justify-between py-1 px-2 bg-orange-50/50 rounded-lg text-orange-600"><span>เหลือ</span> <span>${total-done}</span></div>
                            </div>`;
                    } else { statsDiv.innerHTML = `<span class="text-[9px] text-slate-300 italic tracking-wider">NO DATA</span>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="case-card ${item.category} p-4 md:p-6">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${item.category} | ${item.dept}</span>
                                    <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">${item.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-800 text-sm md:text-lg">${item.detail}</h3>
                                <div class="print-full mt-4 border-t pt-4 text-[11px] space-y-2">
                                    <div class="grid grid-cols-2 gap-2">
                                        <div class="bg-slate-50 p-2 rounded"><b>ผู้รายงาน:</b> ${item.reporter}</div>
                                        <div class="bg-slate-50 p-2 rounded"><b>ผู้รับผิดชอบ:</b> ${item.owner}</div>
                                        <div class="bg-slate-50 p-2 rounded"><b>กำหนดเสร็จ:</b> ${item.dueDate}</div>
                                        <div class="bg-emerald-50 p-2 rounded text-emerald-600"><b>เสร็จจริง:</b> ${item.actualDate || '-'}</div>
                                    </div>
                                    <div class="bg-slate-50 p-2 rounded"><b>วิธีแก้ไข:</b><br>${item.solution || '-'}</div>
                                    <div class="flex gap-2">
                                        <img src="${item.imgBefore}" class="w-1/2 rounded border">
                                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="w-1/2 rounded border">` : ''}
                                    </div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-blue-50/50 p-3 rounded-xl"><b>👤 ผู้รายงาน:</b><br>${item.reporter}</div>
                    <div class="bg-green-50/50 p-3 rounded-xl"><b>🛠️ รับผิดชอบ:</b><br>${item.owner}</div>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs md:text-sm">
                    <div class="bg-orange-50/50 p-3 rounded-xl text-orange-700"><b>📅 กำหนดเสร็จ:</b><br>${item.dueDate}</div>
                    <div class="bg-emerald-50/50 p-3 rounded-xl text-emerald-700"><b>✅ เสร็จจริง:</b><br>${item.actualDate || '-'}</div>
                </div>
                <div class="p-4 bg-slate-50 rounded-xl border"><b>⚠️ ปัญหา:</b><br>${item.detail}</div>
                <div class="p-4 bg-emerald-50/30 rounded-xl border"><b>💡 วิธีแก้ไข:</b><br>${item.solution || '-'}</div>
                <div class="grid grid-cols-2 gap-3">
                    <div><p class="text-[9px] font-bold text-red-500 mb-1 uppercase">Before</p><img src="${item.imgBefore}" class="rounded-xl border w-full shadow-sm"></div>
                    <div><p class="text-[9px] font-bold text-emerald-500 mb-1 uppercase">After</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-xl border w-full shadow-sm">` : '<div class="h-24 bg-slate-50 rounded-xl border-2 border-dashed flex items-center justify-center text-[9px] text-slate-300">รอรูป After</div>'}</div>
                </div>
            `;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
            
            document.getElementById('btnDeletePop').onclick = () => { if(confirm('ลบรายการนี้ใช่หรือไม่?')) { remove(ref(db, `patrols/${currentPath}/${id}`)); closeModal('modal-view'); } };
            document.getElementById('btnUpdatePop').onclick = () => { closeModal('modal-view'); document.getElementById('modal-update').classList.remove('hidden'); };
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: img || "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "บันทึก..."; btn.disabled = true;
            const imgAfter = await processImg(document.getElementById('upImgAfter').files[0]);
            const up = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfter) up.imgAfter = imgAfter;
            update(ref(db, `patrols/${currentPath}/${currentId}`), up).then(() => { closeModal('modal-update'); btn.innerText = "ยืนยัน"; btn.disabled = false; });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); lucide.createIcons(); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
