<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .hidden { display: none !important; }
        
        /* Modal Responsive */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 0.5rem; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 100%; max-width: 48rem; border-radius: 1.5rem; max-height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* Card Category */
        .case-card { background: white; border-radius: 1.25rem; border-left: 10px solid #cbd5e1; cursor: pointer; transition: 0.2s; border-right: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .Safety { border-left-color: #ef4444; }
        .S5 { border-left-color: #3b82f6; }
        .Other { border-left-color: #a855f7; }

        .input-field { border: 2px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; transition: 0.2s; background: #fcfcfc; }
        .input-field:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        /* Print Mode */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #page-list { display: block !important; }
            .case-card { break-inside: avoid; margin-bottom: 25px !important; padding: 25px !important; border: 1px solid #eee !important; border-left: 12px solid !important; }
            .print-full { display: block !important; margin-top: 15px; }
        }
        .print-full { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-4 md:p-8">
        <div class="max-w-6xl mx-auto text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-6 flex items-center justify-center gap-3">
                <i data-lucide="shield-check" class="text-blue-600" size="36"></i> Safety Patrol & 5S
            </h1>
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2.5 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-slate-400 font-bold text-xs uppercase italic">Select Year:</span>
                <select id="yearSelect" class="font-bold text-blue-600 outline-none bg-transparent text-lg cursor-pointer"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b p-4 mb-6 no-print shadow-sm">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1 transition-all">
                    <i data-lucide="arrow-left" size="18"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-bold text-slate-800 text-lg"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-slate-50 p-2 rounded-xl text-slate-500 hover:bg-slate-100 border"><i data-lucide="printer" size="20"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all text-sm md:text-base">+ เพิ่มข้อมูล</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-3xl mx-auto px-4 space-y-4"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50/50">
                <button id="btnDeletePop" class="text-red-400 hover:text-red-600 p-2 transition-colors flex items-center gap-1 text-sm font-bold">
                    <i data-lucide="trash-2" size="18"></i> ลบงาน
                </button>
                <h3 class="font-bold text-slate-700 hidden md:block">รายละเอียดข้อมูล</h3>
                <button onclick="closeModal('modal-view')" class="text-slate-400 hover:text-slate-600 p-2"><i data-lucide="x"></i></button>
            </div>
            
            <div id="viewDetailContent" class="overflow-y-auto p-5 md:p-8 space-y-6 bg-white"></div>
            
            <div class="p-4 border-t bg-white no-print">
                <button id="btnUpdatePop" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold hover:bg-orange-600 shadow-lg shadow-orange-100 flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="refresh-cw" size="20"></i> อัปเดตงาน / แก้ไข
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-5 border-b flex justify-between items-center bg-blue-600 text-white">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="plus-circle"></i> บันทึกรายการใหม่</h3>
                <button onclick="closeModal('modal-form')" class="text-white/70 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            <form id="mainForm" class="overflow-y-auto p-6 space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase italic">📅 Date</label><input type="date" id="postDate" required class="input-field"></div>
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase italic">👤 Reporter</label><input type="text" id="reporter" required class="input-field"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase italic">📍 Dept</label>
                        <select id="dept" class="input-field">
                            <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>Office</option><option>อื่นๆ</option>
                        </select>
                    </div>
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase italic">🏷️ Category</label>
                        <select id="category" class="input-field">
                            <option value="Safety">Safety</option><option value="S5">5S</option><option value="Other">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div><label class="text-[10px] font-bold text-red-500 uppercase italic">⚠️ Problem Detail</label><textarea id="detail" rows="3" required class="input-field border-red-50"></textarea></div>
                <div><label class="text-[10px] font-bold text-red-500 uppercase italic">📸 Before Image</label><input type="file" id="imgBefore" accept="image/*" class="w-full text-xs text-slate-500"></div>
                
                <div class="bg-green-50 p-5 rounded-2xl border border-green-100 space-y-4">
                    <div><label class="text-[10px] font-bold text-green-600 uppercase italic">🛠️ Solution</label><textarea id="solution" rows="2" class="input-field border-green-100"></textarea></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] font-bold text-green-600 uppercase italic">👷 PIC</label><input type="text" id="owner" required class="input-field border-green-100"></div>
                        <div><label class="text-[10px] font-bold text-green-600 uppercase italic">⏱️ Due Date</label><input type="date" id="dueDate" required class="input-field border-green-100"></div>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-blue-100 hover:bg-blue-700">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <div id="modal-update" class="modal-overlay hidden">
        <div class="modal-box max-w-md">
            <div class="p-5 border-b bg-orange-50 font-bold text-orange-700 flex justify-between items-center">
                <span>อัปเดตสถานะงาน</span>
                <button onclick="closeModal('modal-update')"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div><label class="text-xs font-bold text-slate-400 mb-1 block">วันที่แก้ไขเสร็จจริง</label><input type="date" id="upActualDate" class="input-field"></div>
                <div><label class="text-xs font-bold text-slate-400 mb-1 block">สถานะ</label>
                    <select id="upStatus" class="input-field"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select>
                </div>
                <div><label class="text-xs font-bold text-slate-400 mb-1 block">รูปถ่ายหลังแก้ไข (After)</label><input type="file" id="upImgAfter" class="w-full text-xs"></div>
                <div class="flex gap-2 pt-4">
                    <button onclick="closeModal('modal-update')" class="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-400">ยกเลิก</button>
                    <button id="saveUpdateBtn" class="flex-1 py-3 bg-orange-500 text-white font-bold rounded-xl">ยืนยันการอัปเดต</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-5 md:p-6 rounded-3xl border border-slate-100 cursor-pointer hover:border-blue-400 transition-all shadow-sm hover:shadow-lg group';
                div.innerHTML = `<div class="font-bold text-slate-700 text-lg mb-4 flex justify-between">${m} <i data-lucide="calendar" class="text-slate-200 group-hover:text-blue-400 transition-colors"></i></div><div id="stats-${mid}"></div>`;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const data = snap.val();
                    const statsDiv = document.getElementById(`stats-${mid}`);
                    if (data) {
                        const items = Object.values(data);
                        const total = items.length;
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="space-y-1.5">
                                <div class="flex justify-between text-xs py-1.5 px-3 bg-blue-50/50 rounded-lg text-blue-600 font-bold"><span>ตรวจพบ</span> <span>${total}</span></div>
                                <div class="flex justify-between text-xs py-1.5 px-3 bg-green-50/50 rounded-lg text-green-600 font-bold"><span>แก้ไขเสร็จ</span> <span>${done}</span></div>
                                <div class="flex justify-between text-xs py-1.5 px-3 bg-orange-50/50 rounded-lg text-orange-600 font-bold"><span>คงเหลือ</span> <span>${total-done}</span></div>
                            </div>`;
                    } else { statsDiv.innerHTML = `<span class="text-[10px] text-slate-300 italic">ไม่มีข้อมูลการตรวจ</span>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="case-card ${item.category} p-5 shadow-sm">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${item.category} | ${item.dept}</span>
                                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${isDone ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">${item.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-800 text-base md:text-lg">${item.detail}</h3>
                                <div class="mt-4 flex justify-between items-center no-print">
                                    <span class="text-[10px] text-slate-400">PIC: ${item.owner}</span>
                                    <span class="text-[10px] font-bold text-blue-600 flex items-center gap-1">ดูข้อมูล <i data-lucide="chevron-right" size="14"></i></span>
                                </div>
                                <div class="print-full">
                                    <div class="grid grid-cols-2 gap-4 mb-4 text-xs mt-4 border-t pt-4">
                                        <div><b>ผู้รายงาน:</b> ${item.reporter}</div>
                                        <div><b>ผู้รับผิดชอบ:</b> ${item.owner}</div>
                                        <div><b>กำหนดเสร็จ:</b> ${item.dueDate}</div>
                                        <div class="text-green-600 font-bold"><b>แก้ไขเสร็จจริง:</b> ${item.actualDate || '-'}</div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <img src="${item.imgBefore}" class="rounded-xl border">
                                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-xl border">` : ''}
                                    </div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-3 text-xs md:text-sm">
                    <div class="bg-blue-50/50 p-4 rounded-2xl"><b>👤 ผู้รายงาน:</b><br>${item.reporter}</div>
                    <div class="bg-green-50/50 p-4 rounded-2xl"><b>🛠️ ผู้รับผิดชอบ (PIC):</b><br>${item.owner}</div>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs md:text-sm">
                    <div class="bg-orange-50/50 p-4 rounded-2xl text-orange-700"><b>📅 กำหนดเสร็จ:</b><br>${item.dueDate}</div>
                    <div class="bg-emerald-50/50 p-4 rounded-2xl text-emerald-700"><b>✅ แก้ไขเสร็จจริง:</b><br>${item.actualDate || '-'}</div>
                </div>
                <div class="p-5 bg-slate-50/50 rounded-2xl text-xs md:text-sm border"><b>⚠️ รายละเอียดปัญหา:</b><br>${item.detail}</div>
                <div class="p-5 bg-slate-50/50 rounded-2xl text-xs md:text-sm border"><b>🔧 แนวทางแก้ไข:</b><br>${item.solution || '-'}</div>
                <div class="grid grid-cols-2 gap-4">
                    <div><p class="text-[10px] font-black text-red-500 mb-2 uppercase">Before</p><img src="${item.imgBefore}" class="rounded-2xl border w-full shadow-sm"></div>
                    <div><p class="text-[10px] font-black text-emerald-500 mb-2 uppercase">After</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-2xl border w-full shadow-sm">` : '<div class="h-32 bg-slate-50 rounded-2xl flex items-center justify-center text-[10px] text-slate-400 border-2 border-dashed">รอภาพแก้ไข</div>'}</div>
                </div>
            `;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
            
            // Setup Delete action
            document.getElementById('btnDeletePop').onclick = () => { if(confirm('ยืนยันการลบรายการนี้ใช่หรือไม่?')) { remove(ref(db, `patrols/${currentPath}/${id}`)); closeModal('modal-view'); } };
            // Setup Update action
            document.getElementById('btnUpdatePop').onclick = () => { closeModal('modal-view'); document.getElementById('modal-update').classList.remove('hidden'); };
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: img || "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังอัปเดต...";
            const imgAfter = await processImg(document.getElementById('upImgAfter').files[0]);
            const up = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfter) up.imgAfter = imgAfter;
            update(ref(db, `patrols/${currentPath}/${currentId}`), up).then(() => { closeModal('modal-update'); btn.innerText = "ยืนยันการอัปเดต"; });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); lucide.createIcons(); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
