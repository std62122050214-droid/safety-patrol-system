<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; color: #334e68; }
        .month-card { transition: all 0.3s ease; cursor: pointer; border-radius: 1.5rem; background: #ffffff; padding: 1.5rem 1.25rem; border: 1px solid #dbe3eb; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .hidden { display: none !important; }
        .input-box { width: 100%; padding: 0.8rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 1rem; outline: none; font-size: 16px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .modal-container { background: white; width: 100%; max-width: 45rem; border-radius: 2rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .stat-badge { display: flex; justify-content: space-between; padding: 0.5rem 0.75rem; border-radius: 0.75rem; margin-top: 0.5rem; font-size: 0.8rem; font-weight: 600; }
        .img-preview { width: 100%; max-height: 380px; object-fit: contain; background: #0f172a; border-radius: 1.25rem; }
        .scroll-area { overflow-y: auto; flex: 1; padding: 1.5rem; }
        .nav-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; }

        /* CSS สำหรับการพิมพ์ (Print Style) */
        @media print {
            body { background: white !important; }
            .nav-sticky, button, .modal-overlay, #page-home { display: none !important; }
            #page-list { display: block !important; padding: 0 !important; }
            .print-header { display: block !important; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
            .case-card { break-inside: avoid; border: 1px solid #ccc !important; margin-bottom: 15px !important; page-break-inside: avoid; }
            .img-preview { max-height: 200px !important; border: 1px solid #eee !important; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-6 flex items-center justify-center gap-4">
                <i data-lucide="shield-check" class="text-blue-600" size="40"></i>
                Safety Patrol & 5S
            </h1>
            <div class="flex justify-center items-center gap-4 bg-white w-fit mx-auto px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                <i data-lucide="database" class="text-slate-400" size="18"></i>
                <span class="font-medium text-slate-600">ปีที่บันทึกข้อมูล:</span>
                <select id="yearSelect" class="bg-transparent font-bold text-blue-600 outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <div class="print-header">
            <h1 style="font-size: 24px; font-weight: bold;">รายงาน Safety Patrol & 5S</h1>
            <p id="print-month-name" style="font-size: 18px;"></p>
            <div id="print-stats-summary" style="margin-top: 10px; font-weight: bold;"></div>
        </div>

        <nav class="nav-sticky flex justify-between items-center">
            <button onclick="goBackHome()" class="flex items-center gap-2 font-bold text-slate-600 hover:text-blue-600 transition">
                <i data-lucide="chevron-left" size="24"></i> กลับ
            </button>
            <h2 id="currentMonthTitle" class="font-bold text-slate-800 text-xl"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg hover:bg-black transition active:scale-95">
                    <i data-lucide="printer" size="20"></i> พิมพ์
                </button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg active:scale-95 transition">
                    <i data-lucide="plus-circle" size="20"></i> เพิ่มเรื่องที่พบ
                </button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-6 space-y-6"></div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i data-lucide="edit-3"></i> เพิ่มข้อมูลเรื่องที่บกพร่อง</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-red-500"><i data-lucide="x" size="24"></i></button>
            </div>
            <div class="scroll-area bg-white">
                <form id="mainForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="text-xs font-bold text-slate-500">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                        <div><label class="text-xs font-bold text-slate-500">ชื่อผู้รายงาน (Reporter)</label><input type="text" id="reporter" placeholder="ชื่อผู้พบปัญหา" required class="input-box"></div>
                        <div><label class="text-xs font-bold text-slate-500">แผนก/พื้นที่</label><select id="dept" class="input-box"><option value="Welding">Welding</option><option value="Assembly">Assembly</option><option value="Inventory">Inventory</option><option value="Manufacturing">Manufacturing</option><option value="อื่นๆ">อื่นๆ</option></select></div>
                        <div><label class="text-xs font-bold text-slate-500">หมวดหมู่</label><select id="category" class="input-box"><option value="ความปลอดภัย (Safety)">ความปลอดภัย (Safety)</option><option value="5ส (5S)">5ส (5S)</option><option value="อื่นๆ">อื่นๆ</option></select></div>
                        <div><label class="text-xs font-bold text-blue-600">ผู้รับผิดชอบ (PIC)</label><input type="text" id="owner" placeholder="ชื่อผู้รับผิดชอบ" required class="input-box border-blue-100"></div>
                        <div><label class="text-xs font-bold text-blue-600">กำหนดเสร็จ (Due Date)</label><input type="date" id="dueDate" required class="input-box border-blue-100"></div>
                    </div>
                    <div><label class="text-xs font-bold text-red-500">ปัญหาที่พบ (Detail)</label><textarea id="detail" rows="3" placeholder="ระบุสิ่งที่พบ..." required class="input-box border-red-100"></textarea></div>
                    <div><label class="text-xs font-bold text-green-600">แนวทางการแก้ไข (Solution)</label><textarea id="solution" rows="2" placeholder="วิธีแก้ไขเบื้องต้น..." class="input-box border-green-100"></textarea></div>
                    <div class="p-4 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200">
                        <label class="text-xs font-bold text-slate-600 block mb-2">📸 รูปภาพก่อนแก้ไข</label>
                        <input type="file" id="imgBefore" accept="image/*" class="text-sm block w-full">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">บันทึกข้อมูล</button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-detail" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="p-6 border-b flex justify-between items-center bg-white">
                <button id="deleteBtn" class="flex items-center gap-2 text-red-500 text-xs font-bold bg-red-50 px-4 py-2 rounded-lg"><i data-lucide="trash-2" size="14"></i> ลบ</button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="text-slate-400"><i data-lucide="x" size="24"></i></button>
            </div>
            <div class="scroll-area bg-slate-50" id="detailScrollBody">
                <div id="detailViewContent" class="space-y-6"></div>
                <div id="updateSection" class="mt-8 bg-white p-6 rounded-2xl border border-orange-100">
                    <h4 class="font-bold text-orange-700 mb-6 flex items-center gap-2"><i data-lucide="wrench"></i> อัปเดตการแก้ไข</h4>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] font-bold">วันที่แก้ไขจริง</label><input type="date" id="upActualDate" class="input-box"></div>
                            <div><label class="text-[10px] font-bold">สถานะ</label><select id="upStatus" class="input-box"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select></div>
                        </div>
                        <div><label class="text-[10px] font-bold">รูปหลังแก้ไข</label><input type="file" id="upImgAfter" accept="image/*" class="text-sm block w-full"></div>
                        <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold">ยืนยัน</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card';
                div.innerHTML = `<div class="font-bold text-slate-800 text-xl mb-4">${m}</div><div id="stats-${monthId}" class="space-y-1"></div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        const pending = total - done;
                        statsDiv.innerHTML = `<div class="stat-badge bg-blue-50 text-blue-600"><span>พบทั้งหมด</span> <span>${total}</span></div><div class="stat-badge bg-green-50 text-green-600"><span>แก้ไขแล้ว</span> <span>${done}</span></div><div class="stat-badge bg-orange-50 text-orange-600"><span>คงเหลือ</span> <span>${pending}</span></div>`;
                    } else { statsDiv.innerHTML = `<div class="text-center text-[10px] text-slate-300 py-4 uppercase font-bold">ว่าง</div>`; }
                });
                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden'); 
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    document.getElementById('print-month-name').innerText = `ประจำเดือน: ${m} ${yearSelect.value}`;
                    listenData(); 
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    const total = Object.keys(data).length;
                    const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                    document.getElementById('print-stats-summary').innerText = `พบทั้งหมด: ${total} | แก้ไขแล้ว: ${done} | คงเหลือ: ${total-done}`;

                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="case-card bg-white p-6 rounded-3xl shadow-sm border-l-8 ${isDone ? 'border-green-500' : 'border-orange-500'} cursor-pointer transition">
                                <div class="flex justify-between items-center mb-4">
                                    <span class="px-2 py-1 bg-slate-100 text-[10px] font-bold">📍 ${item.dept}</span>
                                    <span class="text-[10px] font-bold ${isDone ? 'text-green-600' : 'text-orange-600'} uppercase">${item.status}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-2">${item.detail}</h3>
                                <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                                    <div class="text-xs font-bold text-slate-500"><i data-lucide="user-check" style="display:inline; width:12px;"></i> โดย: ${item.reporter}</div>
                                    <div class="text-xs font-bold text-red-400">Due: ${item.dueDate}</div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailViewContent');
            const updateSection = document.getElementById('updateSection');
            if (item.status === 'เสร็จสิ้น') updateSection.classList.add('hidden');
            else { updateSection.classList.remove('hidden'); document.getElementById('upStatus').value = item.status; }

            content.innerHTML = `
                <div class="bg-white p-6 rounded-2xl border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">${item.detail}</h2>
                    <div class="space-y-3">
                        <div class="p-3 bg-slate-50 rounded-xl"><p class="text-[10px] font-bold text-slate-400">แนวทางแก้ไข</p><p>${item.solution || '-'}</p></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="p-3 bg-blue-50 rounded-xl"><p class="text-[10px] font-bold text-blue-400">PIC</p><p class="font-bold text-sm">${item.owner}</p></div>
                            <div class="p-3 bg-green-50 rounded-xl"><p class="text-[10px] font-bold text-green-400">Reporter</p><p class="font-bold text-sm">${item.reporter}</p></div>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><p class="text-[10px] font-bold mb-1">ภาพก่อนแก้ไข</p><img src="${item.imgBefore}" class="img-preview" onerror="this.src='https://placehold.co/400x300'"></div>
                    ${item.imgAfter ? `<div><p class="text-[10px] font-bold mb-1">ภาพหลังแก้ไข</p><img src="${item.imgAfter}" class="img-preview border-2 border-green-400"></div>` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "กำลังบันทึก...";
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: imgData || "", imgAfter: "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeForm(); e.target.reset(); btn.disabled = false; btn.innerText = "บันทึกข้อมูล"; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.disabled = true; btn.innerText = "อัปเดต...";
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            if(document.getElementById('upActualDate').value) updates.actualDate = document.getElementById('upActualDate').value;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { document.getElementById('modal-detail').classList.add('hidden'); btn.disabled = false; btn.innerText = "ยืนยัน"; });
        };

        document.getElementById('deleteBtn').onclick = () => { if (confirm(`ลบข้อมูล?`)) { remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => document.getElementById('modal-detail').classList.add('hidden')); } };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
