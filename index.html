<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷 SAFETY PATROL & 5S 👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .input-field { border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; transition: 0.2s; }
        .input-field:focus { border-color: #3b82f6; ring: 2px; ring-color: #bfdbfe; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 100%; max-width: 50rem; border-radius: 2rem; max-height: 90vh; overflow-y: auto; position: relative; }
        
        /* สไตล์สถานะแบบ Badge ตามภาพตัวอย่าง */
        .status-badge { font-size: 10px; font-weight: bold; padding: 4px 14px; border-radius: 9999px; text-transform: uppercase; }
        .status-pending { background-color: #fee2e2; color: #ef4444; } /* สีแดงสำหรับรอดำเนินการ */
        .status-complete { background-color: #d1fae5; color: #10b981; } /* สีเขียวสำหรับเสร็จสิ้น */

        @media print {
            .no-print, button, nav, .year-selector { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .modal-overlay { position: static; background: none; display: block; padding: 0; }
            .modal-box { max-width: 100%; box-shadow: none; overflow: visible; border: none; padding: 0; }
            .print-container { display: block !important; width: 100%; }
            img { max-width: 350px !important; border-radius: 12px; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12 no-print">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-3xl font-black text-slate-800 mb-6">👷 SAFETY PATROL & 5S 👷‍♀️</h1>
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2 rounded-full shadow-sm border border-slate-200 year-selector">
                <span class="text-slate-400 text-xs font-bold uppercase">ปีที่บันทึก:</span>
                <select id="yearSelect" class="font-bold text-blue-600 bg-transparent outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-12">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 no-print shadow-sm flex justify-between items-center">
            <button onclick="goBackHome()" class="flex items-center gap-2 text-slate-500 font-bold hover:text-blue-600">
                <i data-lucide="arrow-left" size="20"></i> กลับ
            </button>
            <h2 id="currentMonthTitle" class="font-black text-slate-800 text-lg uppercase"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="p-2 border rounded-xl text-slate-400 hover:bg-slate-50"><i data-lucide="printer" size="20"></i></button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm shadow-lg shadow-blue-200">+ เพิ่มข้อมูล</button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto mt-10 px-4 space-y-4"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box p-8 md:p-10 print-container">
            <div class="flex justify-between items-center mb-6 no-print">
                <button id="btnDeletePop" class="text-red-400 hover:bg-red-50 p-2 rounded-full"><i data-lucide="trash-2" size="22"></i></button>
                <button onclick="closeModal('modal-view')" class="text-slate-300 hover:text-slate-600"><i data-lucide="x" size="32"></i></button>
            </div>
            <div id="viewDetailContent" class="space-y-6">
                </div>
            <div class="mt-8 no-print">
                <button id="btnUpdatePop" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-xl shadow-orange-100 hover:bg-orange-600 flex items-center justify-center gap-2">
                    <i data-lucide="edit-3" size="20"></i> อัปเดตงาน / แก้ไขภาพ
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden no-print">
        <div class="modal-box p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">บันทึกข้อมูลใหม่</h3>
                <button onclick="closeModal('modal-form')"><i data-lucide="x" size="28"></i></button>
            </div>
            <form id="mainForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="postDate" required class="input-field">
                    <input type="text" id="reporter" placeholder="ชื่อผู้รายงาน" required class="input-field">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <select id="dept" class="input-field font-bold">
                        <option>Welding</option>
                        <option>Assembly</option>
                        <option>Manufacturing</option>
                        <option>Inventory</option>
                        <option>Quality Check</option>
                        <option value="อื่นๆ">อื่นๆ</option> </select>
                    <div class="flex gap-4 p-2 border rounded-xl bg-slate-50">
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-bold"><input type="checkbox" name="cat" value="Safety"> Safety</label>
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-bold"><input type="checkbox" name="cat" value="5S"> 5S</label>
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-bold"><input type="checkbox" name="cat" value="อื่นๆ"> อื่นๆ</label>
                    </div>
                </div>
                <textarea id="detail" placeholder="รายละเอียดปัญหา (Problem)" required class="input-field" rows="3"></textarea>
                <div class="bg-blue-50 p-4 rounded-xl space-y-3 border border-blue-100">
                    <input type="text" id="solution" placeholder="แนวทางแก้ไข (Solution)" class="input-field">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="owner" placeholder="ผู้รับผิดชอบ" required class="input-field">
                        <input type="date" id="dueDate" required class="input-field">
                    </div>
                </div>
                <div><label class="text-xs font-bold block mb-1 uppercase text-slate-400">รูปภาพ Before:</label><input type="file" id="imgBefore" accept="image/*" class="input-field text-sm"></div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg">บันทึกข้อมูลเข้าระบบ</button>
            </form>
        </div>
    </div>

    <div id="modal-update" class="modal-overlay hidden no-print">
        <div class="modal-box max-w-md p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-orange-600">แก้ไขภาพ / อัปเดตงาน</h3>
                <button onclick="closeModal('modal-update')"><i data-lucide="x" size="28"></i></button>
            </div>
            <div class="space-y-4">
                <select id="upStatus" class="input-field font-bold">
                    <option value="รอดำเนินการ">รอดำเนินการ</option>
                    <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                </select>
                <div><label class="text-[10px] font-bold text-blue-500 block">เปลี่ยนรูป Before:</label><input type="file" id="upImgBefore" accept="image/*" class="input-field text-sm"></div>
                <div><label class="text-[10px] font-bold text-emerald-500 block">เปลี่ยนรูป After:</label><input type="file" id="upImgAfter" accept="image/*" class="input-field text-sm"></div>
                <button id="saveUpdateBtn" class="w-full py-4 bg-orange-500 text-white font-bold rounded-2xl shadow-lg mt-4">บันทึกอัปเดต</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Configuration (เชื่อมต่อกับฐานข้อมูลของคุณ)
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        window.initHome = () => {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card bg-white p-6 rounded-3xl border border-slate-100 shadow-sm cursor-pointer hover:shadow-md transition-all';
                div.innerHTML = `<div class="flex justify-between items-center"><b class="text-slate-700">${m}</b><i data-lucide="chevron-right" size="18" class="text-slate-300"></i></div><div id="stats-${mid}" class="mt-4 space-y-1"></div>`;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const stats = document.getElementById(`stats-${mid}`);
                    const data = snap.val();
                    if (data) {
                        const items = Object.values(data);
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        stats.innerHTML = `<div class="bg-blue-50 p-2 rounded-lg"><p class="text-[10px] text-blue-500 font-bold uppercase">ตรวจพบทั้งหมด: ${items.length}</p></div>
                                         <div class="bg-emerald-50 p-2 rounded-lg"><p class="text-[10px] text-emerald-500 font-bold uppercase">แก้ไขเสร็จสิ้น: ${done}</p></div>
                                         <div class="bg-orange-50 p-2 rounded-lg"><p class="text-[10px] text-orange-400 font-bold uppercase">คงเหลือที่ต้องแก้: ${items.length - done}</p></div>`;
                    } else { stats.innerHTML = `<p class="text-xs text-slate-300 italic py-2">NO DATA</p>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        };

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const cats = Array.isArray(item.category) ? item.category.join(' / ') : item.category;
                        const statusClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-all">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${cats} | ${item.dept}</p>
                                    <h3 class="font-bold text-slate-700 text-lg">${item.detail}</h3>
                                    <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">👤 PIC: ${item.reporter}</p>
                                </div>
                                <span class="status-badge ${statusClass}">${item.status}</span>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            const statusClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-xl"><b class="text-[10px] text-slate-400 block mb-1 uppercase">ผู้รายงาน</b><span class="font-bold text-slate-700">${item.reporter}</span></div>
                    <div class="bg-slate-50 p-4 rounded-xl"><b class="text-[10px] text-slate-400 block mb-1 uppercase">สถานะ</b><span class="status-badge ${statusClass}">${item.status}</span></div>
                </div>
                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100">
                    <b class="text-[10px] text-slate-400 block mb-2 uppercase">⚠️ PROBLEM / ปัญหาที่พบ</b>
                    <p class="font-bold text-slate-700 text-lg">${item.detail}</p>
                </div>
                <div class="p-5 bg-blue-50/30 rounded-2xl border border-blue-100">
                    <b class="text-[10px] text-blue-400 block mb-2 uppercase">💡 SOLUTION / วิธีแก้ไข</b>
                    <p class="text-sm font-medium text-slate-600">${item.solution || '-'}</p>
                </div>
                <div class="grid grid-cols-2 gap-6 pt-4">
                    <div><p class="text-[10px] font-black text-red-400 uppercase mb-3 tracking-widest">📸 BEFORE</p><img src="${item.imgBefore || ''}" class="rounded-2xl w-full border shadow-md h-48 object-cover"></div>
                    <div><p class="text-[10px] font-black text-emerald-400 uppercase mb-3 tracking-widest">✅ AFTER</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-2xl w-full border shadow-md h-48 object-cover">` : '<div class="h-48 bg-slate-50 rounded-2xl border border-dashed border-slate-200 flex items-center justify-center text-slate-300 font-bold uppercase text-[10px]">รอการแก้ไข</div>'}</div>
                </div>`;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;
            const cats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(cb => cb.value);
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: cats,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                imgBefore: img, status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const updates = { status: document.getElementById('upStatus').value };
            const newBefore = await processImg(document.getElementById('upImgBefore').files[0]);
            const newAfter = await processImg(document.getElementById('upImgAfter').files[0]);
            if(newBefore) updates.imgBefore = newBefore;
            if(newAfter) updates.imgAfter = newAfter;
            update(ref(db, `patrols/${currentPath}/${currentId}`), updates).then(() => { closeModal('modal-update'); btn.innerText = "บันทึกอัปเดต"; btn.disabled = false; });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        document.getElementById('btnUpdatePop').onclick = () => { closeModal('modal-view'); document.getElementById('modal-update').classList.remove('hidden'); };
        document.getElementById('btnDeletePop').onclick = () => { if(confirm('⚠️ คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) { remove(ref(db, `patrols/${currentPath}/${currentId}`)); closeModal('modal-view'); } };
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
