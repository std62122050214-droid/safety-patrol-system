<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷Safety Patrol & 5S👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; }
        .hidden { display: none !important; }
        
        /* Modal & Layout */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .modal-box { background: white; width: 100%; max-width: 46rem; border-radius: 2rem; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }

        /* Status & Category Colors */
        .case-card { background: white; border-radius: 1.5rem; border-left: 12px solid #cbd5e1; cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0; border-left-width: 12px; }
        .case-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .Safety { border-left-color: #ef4444; }
        .S5 { border-left-color: #3b82f6; }
        .Other { border-left-color: #a855f7; }

        .input-field { border: 2px solid #f1f5f9; border-radius: 1rem; padding: 0.85rem; width: 100%; outline: none; transition: 0.2s; background: #f8fafc; }
        .input-field:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        /* 🖨️ Print Style (บังคับข้อมูลขึ้นครบ) */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white !important; padding: 0; }
            .no-print { display: none !important; }
            #page-list { display: block !important; }
            .case-card { 
                break-inside: avoid; 
                margin-bottom: 30px !important; 
                padding: 30px !important; 
                border: 2px solid #f1f5f9 !important; 
                border-left: 15px solid !important; 
                box-shadow: none !important;
            }
            .print-full { display: block !important; margin-top: 20px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
            .print-box { background: #f8fafc !important; border-radius: 12px !important; padding: 15px !important; margin-bottom: 10px; border: 1px solid #e2e8f0 !important; }
            .print-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 15px !important; }
        }
        .print-full { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <div class="inline-block p-4 bg-blue-50 rounded-3xl mb-4">
                <i data-lucide="shield-check" class="text-blue-600" size="48"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-6">👷Safety Patrol & 5S👷‍♀️</h1>
            <div class="flex items-center justify-center gap-4">
                <div class="bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest">ปีที่บันทึก:</span>
                    <select id="yearSelect" class="font-bold text-blue-600 outline-none bg-transparent text-xl cursor-pointer"></select>
                </div>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-24">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b p-4 mb-8 no-print">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="font-bold text-slate-500 hover:text-blue-600 flex items-center gap-2 px-4 py-2 rounded-xl hover:bg-blue-50 transition-all">
                    <i data-lucide="arrow-left" size="20"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-bold text-slate-800 text-xl"></h2>
                <div class="flex gap-3">
                    <button onclick="window.print()" class="bg-white border p-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"><i data-lucide="printer" size="20"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold shadow-xl shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">+ เพิ่มรายการ</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-3xl mx-auto px-4 space-y-6"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50/50">
                <button id="btnDeletePop" class="text-red-400 hover:text-red-600 font-bold text-sm flex items-center gap-1 transition-colors px-3 py-2 rounded-lg hover:bg-red-50">
                    <i data-lucide="trash-2" size="18"></i> ลบรายการ
                </button>
                <span class="text-slate-400 font-bold text-xs uppercase tracking-tighter">Information Detail</span>
                <button onclick="closeModal('modal-view')" class="text-slate-400 hover:text-slate-600 p-2"><i data-lucide="x"></i></button>
            </div>
            <div id="viewDetailContent" class="overflow-y-auto p-6 md:p-10 space-y-8 bg-white"></div>
            <div class="p-6 border-t bg-white no-print">
                <button id="btnUpdatePop" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold hover:bg-orange-600 shadow-xl shadow-orange-100 flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
                    <i data-lucide="check-circle" size="22"></i> อัปเดตสถานะงาน / ปิดงาน
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-6 border-b bg-blue-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2"><i data-lucide="plus-circle"></i> ลงบันทึกการตรวจพบ</h3>
                <button onclick="closeModal('modal-form')" class="text-white/70 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            <form id="mainForm" class="overflow-y-auto p-8 space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div><label class="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-wide">📅 วันที่ตรวจ</label><input type="date" id="postDate" required class="input-field"></div>
                    <div><label class="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-wide">👤 ผู้ตรวจพบ</label><input type="text" id="reporter" required class="input-field" placeholder="ระบุชื่อ"></div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div><label class="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-wide">📍 แผนก</label>
                        <select id="dept" class="input-field">
                            <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>อื่นๆ</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-wide">🏷️ หมวดหมู่</label>
                        <select id="category" class="input-field">
                            <option value="Safety">Safety</option><option value="S5">5S</option><option value="Other">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div><label class="text-xs font-bold text-red-500 mb-2 block uppercase tracking-wide">⚠️ รายละเอียดปัญหา</label><textarea id="detail" rows="3" required class="input-field border-red-50" placeholder="พบอะไรที่ผิดปกติ..."></textarea></div>
                <div><label class="text-xs font-bold text-red-500 mb-2 block uppercase tracking-wide">📸 รูปภาพ Before</label><input type="file" id="imgBefore" accept="image/*" class="w-full text-xs text-slate-400"></div>
                
                <div class="bg-green-50/50 p-6 rounded-3xl border border-green-100 space-y-5">
                    <div><label class="text-xs font-bold text-green-600 mb-2 block uppercase tracking-wide">🛠️ วิธีแก้ไข</label><textarea id="solution" rows="2" class="input-field border-green-100" placeholder="แผนการแก้ไข..."></textarea></div>
                    <div class="grid grid-cols-2 gap-6">
                        <div><label class="text-xs font-bold text-green-600 mb-2 block uppercase tracking-wide">👷 ผู้รับผิดชอบ</label><input type="text" id="owner" required class="input-field border-green-100"></div>
                        <div><label class="text-xs font-bold text-green-600 mb-2 block uppercase tracking-wide">⏱️ กำหนดเสร็จ</label><input type="date" id="dueDate" required class="input-field border-green-100"></div>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all">บันทึกข้อมูลเข้าฐานข้อมูล</button>
            </form>
        </div>
    </div>

    <div id="modal-update" class="modal-overlay hidden">
        <div class="modal-box max-w-md">
            <div class="p-6 border-b bg-orange-50 font-bold text-orange-700 flex justify-between items-center">
                <span>อัปเดตสถานะงาน</span>
                <button onclick="closeModal('modal-update')"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 space-y-5">
                <div><label class="text-xs font-bold text-slate-400 mb-1 block">วันที่แก้ไขเสร็จจริง</label><input type="date" id="upActualDate" class="input-field"></div>
                <div><label class="text-xs font-bold text-slate-400 mb-1 block">สถานะ</label>
                    <select id="upStatus" class="input-field"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select>
                </div>
                <div><label class="text-xs font-bold text-slate-400 mb-1 block">รูปถ่าย After</label><input type="file" id="upImgAfter" class="w-full text-xs"></div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal('modal-update')" class="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-400 transition-colors hover:bg-slate-200">ยกเลิก</button>
                    <button id="saveUpdateBtn" class="flex-1 py-3 bg-orange-500 text-white font-bold rounded-xl shadow-lg shadow-orange-100 hover:bg-orange-600 transition-all">ยืนยัน</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-[2rem] border border-slate-100 cursor-pointer hover:border-blue-400 transition-all shadow-sm hover:shadow-xl group relative overflow-hidden';
                div.innerHTML = `
                    <div class="font-bold text-slate-700 text-lg mb-4 flex justify-between relative z-10">${m} <i data-lucide="arrow-right-circle" class="text-slate-200 group-hover:text-blue-500 transition-all"></i></div>
                    <div id="stats-${mid}" class="relative z-10"></div>
                    <div class="absolute -right-4 -bottom-4 opacity-[0.03] group-hover:opacity-[0.08] transition-all"><i data-lucide="calendar" size="80"></i></div>
                `;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const data = snap.val();
                    const statsDiv = document.getElementById(`stats-${mid}`);
                    if (data) {
                        const items = Object.values(data);
                        const total = items.length;
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="grid grid-cols-1 gap-2">
                                <div class="flex justify-between text-[11px] py-1.5 px-3 bg-blue-50/50 rounded-xl text-blue-600 font-bold"><span>ตรวจพบ</span> <span>${total}</span></div>
                                <div class="flex justify-between text-[11px] py-1.5 px-3 bg-emerald-50/50 rounded-xl text-emerald-600 font-bold"><span>แก้ไขเสร็จ</span> <span>${done}</span></div>
                                <div class="flex justify-between text-[11px] py-1.5 px-3 bg-orange-50/50 rounded-xl text-orange-600 font-bold"><span>คงเหลือ</span> <span>${total-done}</span></div>
                            </div>`;
                    } else { statsDiv.innerHTML = `<span class="text-[10px] text-slate-300 italic">ไม่มีข้อมูล</span>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="case-card ${item.category} p-6">
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em]">${item.category} | ${item.dept}</span>
                                    <span class="text-[10px] font-bold px-3 py-1 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">${item.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-800 text-lg mb-4">${item.detail}</h3>
                                <div class="mt-4 flex justify-between items-center no-print border-t pt-4">
                                    <div class="flex items-center gap-2 text-xs text-slate-400"><i data-lucide="user-2" size="14"></i> ${item.owner}</div>
                                    <span class="text-blue-600 font-bold text-xs flex items-center gap-1">รายละเอียด <i data-lucide="plus" size="14"></i></span>
                                </div>
                                <div class="print-full">
                                    <div class="print-grid mb-4 text-xs mt-4">
                                        <div class="print-box"><b>👤 ผู้รายงาน:</b> ${item.reporter}</div>
                                        <div class="print-box"><b>🛠️ ผู้รับผิดชอบ:</b> ${item.owner}</div>
                                        <div class="print-box"><b>📅 กำหนดเสร็จ:</b> ${item.dueDate}</div>
                                        <div class="print-box text-emerald-600"><b>✅ เสร็จจริง:</b> ${item.actualDate || '-'}</div>
                                    </div>
                                    <div class="print-box mb-4 text-xs"><b>💡 วิธีแก้ไข:</b><br>${item.solution || '-'}</div>
                                    <div class="print-grid">
                                        <div class="text-center"><p class="text-[9px] font-bold text-red-500 mb-1">BEFORE</p><img src="${item.imgBefore}" class="rounded-xl border w-full"></div>
                                        <div class="text-center"><p class="text-[9px] font-bold text-emerald-500 mb-1">AFTER</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-xl border w-full">` : ''}</div>
                                    </div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-50/50 p-5 rounded-3xl border border-blue-50 flex items-center gap-4">
                        <div class="bg-blue-500 p-2 rounded-xl text-white shadow-lg"><i data-lucide="user" size="18"></i></div>
                        <div><b class="text-[10px] uppercase text-blue-400 block mb-0.5">ผู้รายงาน</b><span class="font-bold text-slate-700">${item.reporter}</span></div>
                    </div>
                    <div class="bg-emerald-50/50 p-5 rounded-3xl border border-emerald-50 flex items-center gap-4">
                        <div class="bg-emerald-500 p-2 rounded-xl text-white shadow-lg"><i data-lucide="wrench" size="18"></i></div>
                        <div><b class="text-[10px] uppercase text-emerald-400 block mb-0.5">ผู้รับผิดชอบ</b><span class="font-bold text-slate-700">${item.owner}</span></div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-orange-50/50 p-5 rounded-3xl border border-orange-50">
                        <b class="text-[10px] uppercase text-orange-400 block mb-1">วันที่กำหนดเสร็จ</b>
                        <span class="font-bold text-orange-700 text-lg">${item.dueDate}</span>
                    </div>
                    <div class="bg-emerald-50/50 p-5 rounded-3xl border border-emerald-50">
                        <b class="text-[10px] uppercase text-emerald-400 block mb-1">วันแก้ไขเสร็จจริง</b>
                        <span class="font-bold text-emerald-700 text-lg">${item.actualDate || 'กำลังดำเนินการ'}</span>
                    </div>
                </div>
                <div class="p-6 bg-slate-50 rounded-3xl border border-slate-100">
                    <b class="text-xs uppercase text-slate-400 block mb-2 tracking-widest">⚠️ รายละเอียดปัญหา</b>
                    <p class="text-slate-700 font-medium leading-relaxed">${item.detail}</p>
                </div>
                <div class="p-6 bg-emerald-50/30 rounded-3xl border border-emerald-50">
                    <b class="text-xs uppercase text-emerald-400 block mb-2 tracking-widest">💡 แนวทางการแก้ไข</b>
                    <p class="text-slate-700 font-medium leading-relaxed">${item.solution || '-'}</p>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div><p class="text-[10px] font-black text-red-500 mb-3 uppercase tracking-tighter">📸 Before</p><img src="${item.imgBefore}" class="rounded-3xl border w-full shadow-md"></div>
                    <div><p class="text-[10px] font-black text-emerald-500 mb-3 uppercase tracking-tighter">✅ After</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-3xl border w-full shadow-md">` : '<div class="h-40 bg-slate-50 rounded-3xl flex items-center justify-center text-xs text-slate-300 border-2 border-dashed">รอหลักฐานหลังแก้ไข</div>'}</div>
                </div>
            `;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
            
            document.getElementById('btnDeletePop').onclick = () => { if(confirm('⚠️ คุณต้องการลบรายการนี้ใช่หรือไม่?')) { remove(ref(db, `patrols/${currentPath}/${id}`)); closeModal('modal-view'); } };
            document.getElementById('btnUpdatePop').onclick = () => { closeModal('modal-view'); document.getElementById('modal-update').classList.remove('hidden'); };
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: img || "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูลเข้าฐานข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังอัปเดต..."; btn.disabled = true;
            const imgAfter = await processImg(document.getElementById('upImgAfter').files[0]);
            const up = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfter) up.imgAfter = imgAfter;
            update(ref(db, `patrols/${currentPath}/${currentId}`), up).then(() => { closeModal('modal-update'); btn.innerText = "ยืนยัน"; btn.disabled = false; });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); lucide.createIcons(); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
