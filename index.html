<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .month-card { transition: all 0.3s; cursor: pointer; border-radius: 1.5rem; background: white; padding: 1.2rem; text-align: center; border: 2px solid #e2e8f0; }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }
        .input-box { width: 100%; padding: 0.7rem 1rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 0.8rem; outline: none; font-size: 14px; }
        .count-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-top: 4px; }
        
        /* ปรับแต่งภาพให้พอดีหน้าจอทุกอุปกรณ์ */
        .img-container img { width: 100%; height: auto; object-fit: contain; max-height: 250px; border-radius: 1rem; }
        @media (max-width: 640px) {
            .modal-content { padding: 1.5rem !important; border-radius: 1.5rem !important; }
            .img-container img { max-height: 200px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-black text-blue-900 italic tracking-tight">Safety Patrol & 5S 👷</h1>
            <div class="flex justify-center items-center gap-3 mt-6">
                <span class="font-bold text-slate-500">เลือกปี:</span>
                <select id="yearSelect" class="bg-white border-2 border-blue-500 rounded-xl px-4 py-1 font-black text-blue-600 shadow-sm"></select>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen">
        <nav class="bg-white/80 backdrop-blur-md border-b p-4 sticky top-0 flex justify-between items-center px-4 md:px-6 shadow-sm z-10">
            <button onclick="location.reload()" class="font-bold text-slate-500 flex items-center gap-1 hover:text-blue-600"><i data-lucide="arrow-left"></i> ย้อนกลับ</button>
            <h2 id="currentMonthTitle" class="font-extrabold text-blue-800 text-sm md:text-base"></h2>
            <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-full font-bold shadow-lg text-sm hover:bg-blue-700 transition active:scale-95">+ เพิ่มเรื่องที่พบ</button>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] p-6 md:p-8 shadow-2xl max-h-[90vh] overflow-y-auto modal-content">
            <h3 class="text-2xl font-black mb-6">บันทึกข้อมูลการตรวจ 👷</h3>
            <form id="mainForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-xs font-bold">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                <div><label class="text-xs font-bold">ชื่อผู้ส่ง (Reporter)</label><input type="text" id="reporter" placeholder="ชื่อของคุณ" required class="input-box"></div>
                <div>
                    <label class="text-xs font-bold">แผนก</label>
                    <select id="dept" class="input-box">
                        <option value="Welding">Welding</option>
                        <option value="Assembly">Assembly</option>
                        <option value="Inventory">Inventory</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold">หมวดหมู่</label>
                    <select id="category" class="input-box">
                        <option value="ความปลอดภัย (Safety)">ความปลอดภัย (Safety)</option>
                        <option value="5ส (5S)">5ส (5S)</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div><label class="text-xs font-bold text-blue-600">ผู้รับผิดชอบ/เจ้าของพื้นที่</label><input type="text" id="owner" placeholder="ชื่อผู้รับผิดชอบ" required class="input-box border-blue-200"></div>
                <div><label class="text-xs font-bold text-blue-600">วันที่กำหนดเสร็จ</label><input type="date" id="dueDate" required class="input-box border-blue-200"></div>
                <div class="md:col-span-2"><label class="text-xs font-bold text-red-500">ปัญหาที่พบ</label><textarea id="detail" rows="2" placeholder="ระบุปัญหา..." required class="input-box border-red-200"></textarea></div>
                <div class="md:col-span-2"><label class="text-xs font-bold text-green-600">แนวทางการแก้ไข</label><textarea id="solution" rows="2" placeholder="วิธีแก้ไข..." class="input-box border-green-200"></textarea></div>
                <div class="md:col-span-2"><label class="text-xs font-bold">📸 รูปภาพก่อนแก้ไข</label><input type="file" id="imgBefore" accept="image/*" class="text-xs mt-1"></div>
                <div class="md:col-span-2 pt-4 flex gap-3">
                    <button type="button" onclick="closeForm()" class="flex-1 bg-slate-100 text-slate-500 py-3 rounded-2xl font-black">ยกเลิก</button>
                    <button type="submit" id="submitBtn" class="flex-[2] bg-blue-600 text-white py-3 rounded-2xl font-black shadow-xl hover:bg-blue-700">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/90 hidden z-[60] flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-6 md:p-8 relative shadow-2xl modal-content">
            <div class="flex justify-between items-start mb-4">
                <button id="deleteBtn" class="text-red-400 hover:text-red-600 flex items-center gap-1 text-[10px] font-bold bg-red-50 px-3 py-1 rounded-full"><i data-lucide="trash-2" size="12"></i> ลบรายการ</button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="text-slate-400"><i data-lucide="x-circle" size="28"></i></button>
            </div>
            
            <div id="detailViewContent"></div>

            <div id="updateSection" class="mt-8 border-t pt-6 bg-orange-50 -mx-6 md:-mx-8 px-6 md:px-8 rounded-b-[2.5rem]">
                <h4 class="font-black text-orange-600 mb-4 italic flex items-center gap-2"><i data-lucide="wrench" size="18"></i> อัปเดตงานแก้ไข</h4>
                <div class="space-y-4 pb-6">
                    <div><label class="text-[10px] font-bold">วันที่แก้ไขจริง</label><input type="date" id="upActualDate" class="input-box"></div>
                    <div><label class="text-[10px] font-bold">📸 รูปภาพหลังแก้ไข</label><input type="file" id="upImgAfter" accept="image/*" class="text-xs mt-1"></div>
                    <div>
                        <label class="text-[10px] font-bold">สถานะ</label>
                        <select id="upStatus" class="input-box">
                            <option value="รอดำเนินการ">รอดำเนินการ</option>
                            <option value="กำลังแก้ไข">กำลังแก้ไข</option>
                            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                        </select>
                    </div>
                    <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-3 rounded-2xl font-black shadow-lg hover:bg-orange-600 transition">บันทึกการแก้ไข</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2030; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card shadow-sm';
                div.innerHTML = `<div class="text-blue-500 mb-1"><i data-lucide="calendar" size="20" class="mx-auto"></i></div><div class="font-black text-slate-700 text-sm">${m}</div><div id="stats-${monthId}"></div>`;
                
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `<span class="count-badge bg-blue-100 text-blue-600">พบ ${total}</span> <span class="count-badge bg-green-100 text-green-600">แก้ ${done}</span>`;
                    } else {
                        statsDiv.innerHTML = `<span class="count-badge text-slate-300 italic">ไม่มีข้อมูล</span>`;
                    }
                });

                div.onclick = () => {
                    currentPath = monthId;
                    document.getElementById('page-home').classList.add('hidden');
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const statusClass = item.status === 'เสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-blue-500 cursor-pointer hover:bg-slate-50 transition-all">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-[10px] font-black text-blue-600 uppercase">📍 ${item.dept}</span>
                                    <span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${statusClass}">${item.status}</span>
                                </div>
                                <p class="font-black text-slate-800 text-base leading-tight">${item.detail}</p>
                                <div class="mt-2 text-[10px] text-slate-500 font-bold flex justify-between">
                                    <span>👤 ${item.owner}</span>
                                    <span class="text-red-500 italic">📅 Due: ${item.dueDate}</span>
                                </div>
                            </div>`;
                    });
                } else {
                    container.innerHTML = `<p class="text-center py-20 text-slate-400 italic font-bold">ไม่พบข้อมูลในเดือนนี้</p>`;
                }
            });
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "กำลังบันทึก...";
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value,
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                category: document.getElementById('category').value,
                owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value,
                imgBefore: imgData,
                imgAfter: "",
                actualDate: "",
                status: "รอดำเนินการ",
                ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => {
                closeForm();
                e.target.reset();
                btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
            });
        };

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailViewContent');
            const updateSection = document.getElementById('updateSection');

            // เงื่อนไข: ถ้าสถานะเสร็จสิ้น ให้ซ่อนช่องอัปเดต
            if (item.status === 'เสร็จสิ้น') {
                updateSection.classList.add('hidden');
            } else {
                updateSection.classList.remove('hidden');
                document.getElementById('upStatus').value = item.status;
            }

            content.innerHTML = `
                <div class="mb-4 flex justify-between items-center">
                    <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase">${item.category}</span>
                    <span class="text-red-500 font-black text-[10px]">📅 กำหนด: ${item.dueDate}</span>
                </div>
                <div class="space-y-4 mb-6">
                    <div><p class="text-[9px] font-bold text-slate-400 uppercase">ปัญหาที่พบ</p><p class="text-lg font-black text-red-600 leading-tight">${item.detail}</p></div>
                    <div><p class="text-[9px] font-bold text-slate-400 uppercase">แนวทางแก้ไข</p><p class="text-sm font-bold text-green-700">${item.solution || '-'}</p></div>
                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="bg-blue-50 p-2 rounded-xl border border-blue-100">
                            <p class="text-[8px] font-bold text-blue-400 uppercase">ผู้รับผิดชอบ</p><p class="text-xs font-black text-blue-900">${item.owner}</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <p class="text-[8px] font-bold text-slate-400 uppercase">พื้นที่</p><p class="text-xs font-black text-slate-700">${item.dept}</p>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="img-container">
                        <p class="text-[9px] font-bold text-slate-400 mb-1 italic">📸 รูปก่อนแก้ไข</p>
                        <img src="${item.imgBefore}">
                    </div>
                    <div class="img-container">
                        <p class="text-[9px] font-bold text-green-600 mb-1 italic">✅ รูปหลังแก้ไข</p>
                        ${item.imgAfter ? `<img src="${item.imgAfter}">` : `<div class="bg-slate-100 h-[150px] rounded-2xl flex items-center justify-center text-[10px] text-slate-300 italic">รอการแก้ไข...</div>`}
                    </div>
                </div>
                ${item.actualDate ? `<div class="mt-4 text-center"><span class="bg-green-600 text-white px-4 py-1 rounded-full text-[10px] font-bold">สำเร็จเมื่อ: ${item.actualDate}</span></div>` : ''}
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.disabled = true; btn.innerText = "กำลังบันทึก...";
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const actualDate = document.getElementById('upActualDate').value;
            const status = document.getElementById('upStatus').value;

            const updates = {};
            if(imgAfterData) updates[`/patrols/${currentPath}/${currentEditingId}/imgAfter`] = imgAfterData;
            if(actualDate) updates[`/patrols/${currentPath}/${currentEditingId}/actualDate`] = actualDate;
            updates[`/patrols/${currentPath}/${currentEditingId}/status`] = status;

            update(ref(db), updates).then(() => {
                document.getElementById('modal-detail').classList.add('hidden');
                btn.disabled = false; btn.innerText = "บันทึกการแก้ไข";
            });
        };

        document.getElementById('deleteBtn').onclick = () => {
            const userName = prompt("กรุณากรอกชื่อผู้ลบเพื่อยืนยัน:");
            if (userName && confirm(`คุณ ${userName} ยืนยันการลบรายการนี้ใช่หรือไม่?`)) {
                remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => {
                    document.getElementById('modal-detail').classList.add('hidden');
                });
            }
        };

        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
