<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷‍♂️Safety Patrol & 5S👷‍♀️ </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .month-card { transition: all 0.3s; cursor: pointer; border-radius: 1.5rem; background: white; padding: 1.2rem; text-align: center; border: 2px solid #e2e8f0; position: relative; }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }
        .input-box { width: 100%; padding: 0.7rem 1rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 0.8rem; outline: none; }
        .count-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; rounded-full: 9999px; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-black text-blue-900 italic tracking-tight">👷‍♂️Safety Patrol & 5S👷‍♀️ </h1>
            <div class="flex justify-center items-center gap-3 mt-6">
                <select id="yearSelect" class="bg-white border-2 border-blue-500 rounded-xl px-4 py-2 font-black text-blue-600 outline-none shadow-sm">
                </select>
            </div>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen">
        <nav class="bg-white/80 backdrop-blur-md border-b p-4 sticky top-0 flex justify-between items-center px-6 shadow-sm z-10">
            <button onclick="location.reload()" class="font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1"><i data-lucide="arrow-left"></i> ย้อนกลับ</button>
            <h2 id="currentMonthTitle" class="font-extrabold text-blue-800 text-lg"></h2>
            <button onclick="openForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 transition">+ เพิ่มเรื่องที่พบ</button>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-6">บันทึกข้อมูลการตรวจ</h3>
            <form id="mainForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-xs font-bold">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                <div><label class="text-xs font-bold">ชื่อผู้ส่ง (Reporter)</label><input type="text" id="reporter" placeholder="ระบุชื่อของคุณ" required class="input-box"></div>
                <div><label class="text-xs font-bold">แผนก</label><input type="text" id="dept" placeholder="เช่น Production" required class="input-box"></div>
                <div><label class="text-xs font-bold">หมวดหมู่</label><select id="category" class="input-box"><option>ความปลอดภัย (Safety)</option><option>5ส (5S)</option></select></div>
                <div class="md:col-span-2"><label class="text-xs font-bold">รายละเอียด</label><textarea id="detail" rows="3" placeholder="อธิบายสิ่งที่พบ..." required class="input-box"></textarea></div>
                <div class="md:col-span-2 border-t pt-4"><label class="text-xs font-bold">📸 แนบรูปภาพหลักฐาน</label><input type="file" id="imgBefore" accept="image/*" class="text-xs mt-2"></div>
                <div class="md:col-span-2 pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl hover:bg-blue-700 transition">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/90 hidden z-[60] flex items-center justify-center p-4">
        <div id="detailContent" class="bg-white w-full max-w-xl rounded-[3rem] p-8 relative overflow-y-auto max-h-[90vh]"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Config
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";

        // สร้างปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        // ระบบบีบอัดรูปถ่ายมือถือ
        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        // แสดงหน้าแรกและนับจำนวน
        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card shadow-sm';
                div.innerHTML = `
                    <div class="text-blue-500 mb-2"><i data-lucide="calendar"></i></div>
                    <div class="font-black text-slate-700">${m}</div>
                    <div class="mt-2 flex flex-col gap-1" id="stats-${monthId}">
                        <span class="count-badge bg-slate-100 text-slate-500 italic">กำลังโหลด...</span>
                    </div>
                `;
                
                // ดึงจำนวนเรื่องแบบ Real-time
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(item => item.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <span class="count-badge bg-blue-100 text-blue-700">พบ ${total} เรื่อง</span>
                            <span class="count-badge bg-green-100 text-green-700">แก้แล้ว ${done} เรื่อง</span>
                        `;
                    } else {
                        statsDiv.innerHTML = `<span class="count-badge text-slate-300">ไม่มีข้อมูล</span>`;
                    }
                });

                div.onclick = () => {
                    currentPath = monthId;
                    document.getElementById('page-home').classList.add('hidden');
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `รอบเดือน ${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        // ดึงรายการข้อมูลในเดือนนั้น
        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        container.innerHTML += `
                            <div onclick='viewDetail(${JSON.stringify(item)})' class="bg-white p-5 rounded-2xl shadow-sm border-l-8 border-blue-500 cursor-pointer hover:shadow-md transition-all">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-black uppercase text-blue-600">${item.category}</span>
                                    <span class="text-[10px] font-bold ${item.status === 'เสร็จสิ้น' ? 'text-green-500' : 'text-orange-500'}">${item.status || 'รอดำเนินการ'}</span>
                                </div>
                                <p class="font-black text-slate-800">${item.detail}</p>
                                <div class="mt-3 flex justify-between items-center text-[10px] text-slate-400 font-bold border-t pt-3">
                                    <span>👤 ผู้แจ้ง: ${item.reporter}</span>
                                    <span>📅 ${item.postDate}</span>
                                </div>
                            </div>`;
                    });
                } else {
                    container.innerHTML = `<p class="text-center py-20 text-slate-400 italic">ยังไม่มีข้อมูลในเดือนนี้</p>`;
                }
            });
        }

        // บันทึกข้อมูล (แสดงชื่อและรูปหลังบันทึก)
        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "กำลังประมวลผลรูปภาพ..."; btn.disabled = true;

            const imgData = await processImg(document.getElementById('imgBefore').files[0]);

            const payload = {
                postDate: document.getElementById('postDate').value,
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                category: document.getElementById('category').value,
                detail: document.getElementById('detail').value,
                imgBefore: imgData,
                status: "รอดำเนินการ",
                ts: new Date().getTime()
            };

            push(ref(db, `patrols/${currentPath}`), payload).then(() => {
                alert(`บันทึกเรียบร้อย! ขอบคุณครับคุณ ${payload.reporter}`);
                closeForm();
                e.target.reset();
                btn.innerText = "บันทึกข้อมูล"; btn.disabled = false;
            }).catch(err => alert("บันทึกไม่สำเร็จ: " + err.message));
        };

        // แสดงรายละเอียด (โชว์ชื่อคนแจ้งและรูปที่แนบ)
        window.viewDetail = (item) => {
            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="absolute top-6 right-6 text-slate-400 hover:text-red-500"><i data-lucide="x-circle" size="30"></i></button>
                <h2 class="text-2xl font-black text-slate-800 mb-2">${item.detail}</h2>
                <div class="flex gap-2 mb-6">
                    <span class="bg-blue-100 text-blue-700 text-[10px] px-3 py-1 rounded-full font-bold">${item.category}</span>
                    <span class="bg-slate-100 text-slate-600 text-[10px] px-3 py-1 rounded-full font-bold">แผนก ${item.dept}</span>
                </div>
                <div class="bg-blue-50 p-6 rounded-[2rem] mb-6">
                    <div class="flex items-center gap-3 mb-4 text-blue-900">
                        <i data-lucide="user"></i>
                        <div><p class="text-[10px] font-bold text-blue-400">ผู้บันทึกข้อมูล</p><p class="font-black text-lg leading-none">${item.reporter}</p></div>
                    </div>
                    <p class="text-[10px] font-bold text-blue-400 mb-2">📸 รูปภาพหลักฐานที่แนบมา:</p>
                    ${item.imgBefore ? `<img src="${item.imgBefore}" class="w-full rounded-2xl border-4 border-white shadow-lg">` : `<div class="p-10 bg-slate-100 rounded-2xl text-center text-slate-300 italic text-xs">ไม่ได้แนบรูปภาพ</div>`}
                </div>
                <div class="text-center text-[10px] font-bold text-slate-400 italic">แจ้งเมื่อวันที่ ${item.postDate}</div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
