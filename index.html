<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        
        /* Modal Style */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 100%; max-width: 48rem; border-radius: 1.5rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }

        /* Card Category Colors */
        .case-card { background: white; border-radius: 1.25rem; border-left: 10px solid #cbd5e1; cursor: pointer; transition: 0.2s; }
        .Safety { border-left-color: #ef4444; }
        .S5 { border-left-color: #3b82f6; }
        .Other { border-left-color: #a855f7; }

        .input-field { border: 2px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; transition: 0.2s; }
        .input-field:focus { border-color: #3b82f6; background: #fff; }

        /* 🖨️ Print Settings (บังคับสีและข้อมูลครบ) */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white !important; }
            .no-print { display: none !important; }
            #page-list { display: block !important; padding: 0 !important; }
            .case-card { 
                break-inside: avoid; 
                border: 2px solid #e2e8f0 !important; 
                margin-bottom: 30px !important; 
                padding: 25px !important; 
                border-left-width: 15px !important;
                box-shadow: none !important;
            }
            .print-full { display: block !important; margin-top: 20px; border-top: 2px solid #f1f5f9; padding-top: 20px; }
            .print-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 15px !important; }
            .print-box { border-radius: 12px !important; padding: 15px !important; margin-bottom: 10px; border: 1px solid #f1f5f9 !important; }
        }
        .print-full { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-6xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-6 flex items-center justify-center gap-3">
                <i data-lucide="shield-check" class="text-blue-600" size="40"></i> Safety Patrol & 5S
            </h1>
            <div class="inline-flex items-center gap-4 bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center gap-2 text-slate-500 font-bold uppercase text-sm">
                    <i data-lucide="calendar-days" size="18"></i> ปีที่บันทึกข้อมูล:
                </div>
                <select id="yearSelect" class="font-bold text-blue-600 outline-none bg-transparent text-xl"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 mb-8 no-print shadow-sm">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="font-bold text-slate-600 hover:text-blue-600 flex items-center gap-2 transition-colors">
                    <i data-lucide="chevron-left" size="20"></i> กลับหน้าหลัก
                </button>
                <h2 id="currentMonthTitle" class="text-xl font-bold text-slate-800 flex items-center gap-2"></h2>
                <div class="flex gap-3">
                    <button onclick="window.print()" class="bg-white border border-slate-200 p-2.5 rounded-xl text-slate-600 hover:bg-slate-50 transition-all flex items-center gap-2 font-bold">
                        <i data-lucide="printer" size="20"></i> พิมพ์
                    </button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">
                        + เพิ่มข้อมูล
                    </button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto px-4 space-y-6"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 text-lg">
                    <i data-lucide="file-text" class="text-blue-600"></i> รายละเอียดข้อมูลการตรวจพบ
                </h3>
                <button onclick="closeModal('modal-view')" class="text-slate-400 hover:text-red-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div id="viewDetailContent" class="overflow-y-auto p-8 space-y-6 bg-white"></div>
            <div class="p-4 border-t bg-slate-50/80 flex gap-4 no-print">
                <button id="btnUpdatePop" class="flex-1 bg-orange-500 text-white py-3.5 rounded-2xl font-bold hover:bg-orange-600 transition-all shadow-md shadow-orange-100 flex items-center justify-center gap-2">
                    <i data-lucide="edit-3" size="18"></i> อัปเดต/ปิดงาน
                </button>
                <button id="btnDeletePop" class="px-8 bg-red-50 text-red-500 py-3.5 rounded-2xl font-bold hover:bg-red-100 transition-all flex items-center gap-2">
                    <i data-lucide="trash-2" size="18"></i> ลบ
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-6 border-b flex justify-between items-center bg-blue-600 text-white">
                <h3 class="font-bold text-lg flex items-center gap-2"><i data-lucide="plus-circle"></i> บันทึกรายการใหม่</h3>
                <button onclick="closeModal('modal-form')" class="text-white/70 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            <form id="mainForm" class="overflow-y-auto p-8 space-y-6">
                <div class="grid grid-cols-2 gap-5">
                    <div><label class="text-xs font-bold text-slate-500 mb-1.5 block italic">📅 วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-field"></div>
                    <div><label class="text-xs font-bold text-slate-500 mb-1.5 block italic">👤 ชื่อผู้รายงาน</label><input type="text" id="reporter" placeholder="ชื่อ-นามสกุล" required class="input-field"></div>
                </div>
                <div class="grid grid-cols-2 gap-5">
                    <div><label class="text-xs font-bold text-slate-500 mb-1.5 block italic">📍 แผนกที่ตรวจพบ</label>
                        <select id="dept" class="input-field">
                            <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>Office</option><option>อื่นๆ</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-bold text-slate-500 mb-1.5 block italic">🏷️ หมวดหมู่เรื่อง</label>
                        <select id="category" class="input-field">
                            <option value="Safety">Safety (ความปลอดภัย)</option><option value="S5">5S (5ส)</option><option value="Other">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div><label class="text-xs font-bold text-red-500 mb-1.5 block italic">⚠️ รายละเอียดปัญหาที่พบ</label><textarea id="detail" rows="3" required class="input-field border-red-50" placeholder="ระบุสิ่งที่พบผิดปกติ..."></textarea></div>
                <div><label class="text-xs font-bold text-red-500 mb-1.5 block italic">📸 รูปภาพก่อนแก้ไข (Before)</label><input type="file" id="imgBefore" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"></div>
                
                <div class="bg-green-50/50 p-6 rounded-2xl border border-green-100 space-y-5">
                    <div><label class="text-xs font-bold text-green-600 mb-1.5 block italic">🛠️ แนวทางการแก้ไข</label><textarea id="solution" rows="2" class="input-field border-green-50" placeholder="ระบุวิธีแก้ไข..."></textarea></div>
                    <div class="grid grid-cols-2 gap-5">
                        <div><label class="text-xs font-bold text-green-600 mb-1.5 block italic">👷 ผู้รับผิดชอบ (PIC)</label><input type="text" id="owner" required class="input-field border-green-50"></div>
                        <div><label class="text-xs font-bold text-green-600 mb-1.5 block italic">⏱️ กำหนดเสร็จ</label><input type="date" id="dueDate" required class="input-field border-green-50"></div>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all">บันทึกข้อมูลลงระบบ</button>
            </form>
        </div>
    </div>

    <div id="modal-update" class="modal-overlay hidden">
        <div class="modal-box max-w-md">
            <div class="p-6 border-b bg-orange-50 font-bold text-orange-700 flex justify-between items-center">
                <span class="flex items-center gap-2"><i data-lucide="refresh-cw"></i> อัปเดตสถานะงาน</span>
                <button onclick="closeModal('modal-update')" class="text-orange-300 hover:text-orange-600"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 space-y-5">
                <div><label class="text-xs font-bold text-slate-400 mb-1.5 block">วันที่แก้ไขเสร็จจริง</label><input type="date" id="upActualDate" class="input-field"></div>
                <div><label class="text-xs font-bold text-slate-400 mb-1.5 block">สถานะปัจจุบัน</label>
                    <select id="upStatus" class="input-field"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select>
                </div>
                <div><label class="text-xs font-bold text-slate-400 mb-1.5 block">รูปถ่ายหลังแก้ไข (After)</label><input type="file" id="upImgAfter" class="w-full text-sm"></div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal('modal-update')" class="flex-1 py-3.5 bg-slate-100 font-bold rounded-2xl text-slate-500">ยกเลิก</button>
                    <button id="saveUpdateBtn" class="flex-1 py-3.5 bg-orange-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-100">บันทึกการแก้ไข</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        // สร้างปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        // หน้าแรก: ปฏิทินสถิติ
        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-[2rem] border border-slate-100 cursor-pointer hover:border-blue-400 transition-all shadow-sm hover:shadow-xl group';
                div.innerHTML = `
                    <div class="font-bold text-slate-700 text-lg mb-4 flex items-center justify-between">
                        ${m} <i data-lucide="arrow-up-right" size="18" class="text-slate-300 group-hover:text-blue-500 transition-colors"></i>
                    </div>
                    <div id="stats-${mid}" class="space-y-2"></div>
                `;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const data = snap.val();
                    const statsDiv = document.getElementById(`stats-${mid}`);
                    if (data) {
                        const items = Object.values(data);
                        const total = items.length;
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="flex justify-between text-xs py-2 px-3 bg-blue-50/50 rounded-xl text-blue-700 font-bold"><span>พบทั้งหมด</span> <span>${total}</span></div>
                            <div class="flex justify-between text-xs py-2 px-3 bg-green-50/50 rounded-xl text-green-700 font-bold"><span>แก้ไปแล้ว</span> <span>${done}</span></div>
                            <div class="flex justify-between text-xs py-2 px-3 bg-orange-50/50 rounded-xl text-orange-700 font-bold"><span>คงเหลือ</span> <span>${total-done}</span></div>
                        `;
                    } else { statsDiv.innerHTML = `<span class="text-[11px] text-slate-300 italic">ไม่มีข้อมูลการตรวจ</span>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { 
                    currentPath = mid; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden'); 
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; 
                    listenData(); 
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        // หน้าลิสต์รายการ
        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="case-card ${item.category} p-6 shadow-sm border-r border-t border-b hover:shadow-md transition-all">
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                                        <i data-lucide="tag" size="10"></i> ${item.category} | ${item.dept}
                                    </span>
                                    <span class="text-[10px] font-bold px-3 py-1 rounded-full ${isDone ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} border ${isDone ? 'border-green-200' : 'border-red-200'}">
                                        ${item.status}
                                    </span>
                                </div>
                                <h3 class="font-bold text-slate-800 text-lg leading-snug">${item.detail}</h3>
                                <div class="mt-4 flex justify-between items-center no-print">
                                    <span class="text-xs text-slate-400">ผู้รายงาน: ${item.reporter}</span>
                                    <div class="flex items-center gap-1 text-blue-600 font-bold text-xs bg-blue-50 px-3 py-1.5 rounded-lg">
                                        ดูรายละเอียด <i data-lucide="eye" size="14"></i>
                                    </div>
                                </div>
                                
                                <div class="print-full">
                                    <div class="print-grid grid grid-cols-2 gap-4 mb-4">
                                        <div class="print-box bg-blue-50/50"><b>👤 ผู้รายงาน:</b><br>${item.reporter}</div>
                                        <div class="print-box bg-green-50/50"><b>🛠️ ผู้รับผิดชอบ:</b><br>${item.owner}</div>
                                        <div class="print-box bg-orange-50/30"><b>📅 กำหนดเสร็จ:</b><br>${item.dueDate}</div>
                                        <div class="print-box bg-green-50/30"><b>✅ แก้ไขเสร็จจริง:</b><br>${item.actualDate || '-'}</div>
                                    </div>
                                    <div class="print-box bg-slate-50 mb-4"><b>📝 แนวทางแก้ไข:</b><br>${item.solution || '-'}</div>
                                    <div class="print-grid grid grid-cols-2 gap-4">
                                        <div class="text-center"><p class="text-[10px] font-bold text-red-500 mb-1">BEFORE</p><img src="${item.imgBefore}" class="rounded-xl border w-full"></div>
                                        <div class="text-center"><p class="text-[10px] font-bold text-green-500 mb-1">AFTER</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-xl border w-full">` : ''}</div>
                                    </div>
                                </div>
                            </div>`;
                    });
                } else {
                    container.innerHTML = `<div class="text-center py-20 text-slate-300 italic"><i data-lucide="inbox" size="48" class="mx-auto mb-2 opacity-20"></i><p>ยังไม่มีรายการบันทึกในเดือนนี้</p></div>`;
                }
                lucide.createIcons();
            });
        }

        // Pop-up ดูรายละเอียด
        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-5">
                    <div class="bg-blue-50/60 p-5 rounded-3xl border border-blue-100 flex items-center gap-4">
                        <div class="bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-200"><i data-lucide="user" size="20"></i></div>
                        <div><b class="text-[11px] uppercase text-blue-500 block mb-0.5">ผู้รายงาน</b><span class="font-bold text-slate-800">${item.reporter}</span></div>
                    </div>
                    <div class="bg-green-50/60 p-5 rounded-3xl border border-green-100 flex items-center gap-4">
                        <div class="bg-green-600 p-2.5 rounded-2xl text-white shadow-lg shadow-green-200"><i data-lucide="wrench" size="20"></i></div>
                        <div><b class="text-[11px] uppercase text-green-500 block mb-0.5">ผู้รับผิดชอบ (PIC)</b><span class="font-bold text-slate-800">${item.owner}</span></div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-5">
                    <div class="bg-orange-50/60 p-5 rounded-3xl border border-orange-100 flex items-center gap-4">
                        <div class="bg-orange-500 p-2.5 rounded-2xl text-white"><i data-lucide="calendar" size="20"></i></div>
                        <div><b class="text-[11px] uppercase text-orange-600 block mb-0.5">วันที่กำหนดเสร็จ</b><span class="font-bold text-slate-800">${item.dueDate}</span></div>
                    </div>
                    <div class="bg-emerald-50/60 p-5 rounded-3xl border border-emerald-100 flex items-center gap-4">
                        <div class="bg-emerald-600 p-2.5 rounded-2xl text-white"><i data-lucide="check-circle-2" size="20"></i></div>
                        <div><b class="text-[11px] uppercase text-emerald-600 block mb-0.5">วันแก้ไขเสร็จจริง</b><span class="font-bold text-emerald-700">${item.actualDate || 'ยังไม่เสร็จสิ้น'}</span></div>
                    </div>
                </div>
                <div class="p-6 bg-slate-50/50 rounded-3xl border border-slate-100">
                    <b class="text-xs uppercase text-slate-400 block mb-2 tracking-widest">รายละเอียดปัญหา</b>
                    <p class="text-slate-700 font-medium leading-relaxed">${item.detail}</p>
                </div>
                <div class="p-6 bg-slate-50/50 rounded-3xl border border-slate-100">
                    <b class="text-xs uppercase text-slate-400 block mb-2 tracking-widest">แนวทางการแก้ไข</b>
                    <p class="text-slate-700 font-medium leading-relaxed">${item.solution || '-'}</p>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <p class="text-[10px] font-black text-red-500 uppercase flex items-center gap-2"><i data-lucide="image" size="12"></i> Before (ก่อนแก้ไข)</p>
                        <img src="${item.imgBefore}" class="rounded-3xl border border-slate-200 w-full shadow-md hover:scale-[1.02] transition-transform">
                    </div>
                    <div class="space-y-2">
                        <p class="text-[10px] font-black text-emerald-500 uppercase flex items-center gap-2"><i data-lucide="check-square" size="12"></i> After (หลังแก้ไข)</p>
                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-3xl border border-slate-200 w-full shadow-md hover:scale-[1.02] transition-transform">` : `<div class="h-40 bg-slate-100 rounded-3xl flex items-center justify-center text-xs text-slate-400 border-2 border-dashed border-slate-200 italic">ยังไม่มีรูปถ่ายหลังแก้ไข</div>`}
                    </div>
                </div>
            `;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: img || "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูลลงระบบ"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังบันทึก...";
            const imgAfter = await processImg(document.getElementById('upImgAfter').files[0]);
            const up = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfter) up.imgAfter = imgAfter;
            update(ref(db, `patrols/${currentPath}/${currentId}`), up).then(() => { closeModal('modal-update'); btn.innerText = "บันทึกการแก้ไข"; });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); lucide.createIcons(); };
        window.openForm = () => { document.getElementById('modal-form').classList.remove('hidden'); lucide.createIcons(); };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
