<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .hidden { display: none !important; }
        
        /* หัวข้อแยกสีชัดเจนตามสั่ง */
        .label-blue { color: #2563eb; font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; display: block; }
        .label-red { color: #dc2626; font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; display: block; }
        .label-green { color: #16a34a; font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; display: block; }
        
        .input-field { border: 2px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; transition: 0.2s; outline: none; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        /* การ์ดรายการ */
        .case-card { background: white; border-radius: 1.25rem; border-left: 8px solid #cbd5e1; transition: 0.3s; }
        .case-card.Safety { border-left-color: #ef4444; }
        .case-card.S5 { border-left-color: #3b82f6; }
        .case-card.Other { border-left-color: #8b5cf6; }

        @media print {
            .no-print { display: none !important; }
            #page-list { display: block !important; }
            .case-card { break-inside: avoid; border: 1px solid #ddd !important; margin-bottom: 20px; }
            .detail-expanded { display: block !important; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-4 md:p-8">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-6 flex items-center justify-center gap-2">
                <i data-lucide="shield-check" class="text-blue-600"></i> Safety Patrol & 5S
            </h1>
            <div class="inline-flex items-center gap-3 bg-white p-3 rounded-2xl shadow-sm border">
                <span class="font-bold text-slate-500">เลือกปี:</span>
                <select id="yearSelect" class="font-bold text-blue-600 bg-transparent outline-none"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-w-5xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b p-4 mb-6 no-print">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="font-bold text-slate-500 flex items-center gap-1 hover:text-blue-600">
                    <i data-lucide="arrow-left" size="20"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-bold text-slate-800"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-slate-100 p-2 rounded-lg"><i data-lucide="printer" size="20"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-blue-200">เพิ่มข้อมูล</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-3xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-700">📝 บันทึกข้อมูลการตรวจพบ</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-red-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="overflow-y-auto p-6">
                <form id="mainForm" class="space-y-6">
                    <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="label-blue italic">📅 วันที่ตรวจพบ</label>
                            <input type="date" id="postDate" required class="input-field">
                        </div>
                        <div>
                            <label class="label-blue italic">👤 ชื่อผู้รายงาน</label>
                            <input type="text" id="reporter" placeholder="ระบุชื่อผู้แจ้ง" required class="input-field">
                        </div>
                        <div>
                            <label class="label-blue italic">📍 แผนก/พื้นที่</label>
                            <select id="dept" class="input-field">
                                <option value="Welding">Welding</option>
                                <option value="Assembly">Assembly</option>
                                <option value="Manufacturing">Manufacturing</option>
                                <option value="Inventory">Inventory</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-blue italic">🏷️ หมวดหมู่เรื่องที่เกี่ยวข้อง</label>
                            <select id="category" class="input-field">
                                <option value="Safety">Safety (ความปลอดภัย)</option>
                                <option value="S5">5S (5ส)</option>
                                <option value="Other">อื่นๆ</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-red-50/50 p-4 rounded-2xl border border-red-100">
                        <label class="label-red italic">⚠️ รายละเอียดปัญหาที่พบ</label>
                        <textarea id="detail" rows="3" placeholder="อธิบายสิ่งที่ตรวจพบ..." required class="input-field mb-4"></textarea>
                        <label class="label-red italic">📸 รูปภาพก่อนแก้ไข</label>
                        <input type="file" id="imgBefore" accept="image/*" class="w-full text-sm">
                    </div>

                    <div class="bg-green-50/50 p-4 rounded-2xl border border-green-100 space-y-4">
                        <div>
                            <label class="label-green italic">🛠️ แนวทางการแก้ไข</label>
                            <textarea id="solution" rows="2" placeholder="ระบุวิธีแก้ไข..." class="input-field"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="label-green italic">👷 ผู้รับผิดชอบ (PIC)</label>
                                <input type="text" id="owner" placeholder="ระบุชื่อ PIC" required class="input-field">
                            </div>
                            <div>
                                <label class="label-green italic">⏱️ กำหนดเสร็จ</label>
                                <input type="date" id="dueDate" required class="input-field">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-blue-700 transition-all active:scale-95">บันทึกข้อมูล</button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-update" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6">
            <h3 class="font-bold text-orange-600 mb-4 flex items-center gap-2"><i data-lucide="wrench"></i> อัปเดตสถานะงาน</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-400">วันที่แก้ไขจริง</label>
                    <input type="date" id="upActualDate" class="input-field">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400">สถานะ</label>
                    <select id="upStatus" class="input-field">
                        <option value="รอดำเนินการ">รอดำเนินการ</option>
                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400">รูปภาพหลังแก้ไข</label>
                    <input type="file" id="upImgAfter" class="w-full text-sm">
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('modal-update').classList.add('hidden')" class="flex-1 py-3 font-bold text-slate-500 bg-slate-100 rounded-xl">ยกเลิก</button>
                    <button id="saveUpdateBtn" class="flex-1 py-3 font-bold text-white bg-orange-500 rounded-xl">บันทึกอัปเดต</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        // ตัวเลือกปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-3xl border border-slate-200 shadow-sm cursor-pointer hover:border-blue-500 transition-all';
                div.innerHTML = `<div class="font-bold text-slate-700 text-lg mb-4">${m}</div><div id="stats-${monthId}"></div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const data = snap.val();
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="flex justify-between text-sm py-1 border-b"><span>พบทั้งหมด</span> <span class="font-bold text-blue-600">${total}</span></div>
                            <div class="flex justify-between text-sm py-1 border-b"><span>เสร็จสิ้น</span> <span class="font-bold text-green-600">${done}</span></div>
                            <div class="flex justify-between text-sm py-1"><span>คงเหลือ</span> <span class="font-bold text-orange-600">${total-done}</span></div>
                        `;
                    } else { statsDiv.innerHTML = `<span class="text-xs text-slate-300 italic">ไม่มีข้อมูล</span>`; }
                });
                div.onclick = () => {
                    currentPath = monthId;
                    document.getElementById('page-home').classList.add('hidden');
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        const cardId = `card-${id}`;
                        container.innerHTML += `
                            <div class="case-card ${item.category} p-5 shadow-sm border-r border-t border-b">
                                <div class="flex justify-between items-start mb-3">
                                    <div class="flex flex-col">
                                        <span class="text-[10px] font-extrabold uppercase text-slate-400">หมวดหมู่: ${item.category} | ${item.dept}</span>
                                        <h3 class="text-lg font-bold text-slate-800 mt-1">${item.detail}</h3>
                                    </div>
                                    <span class="text-xs font-bold px-2 py-1 rounded-lg ${isDone ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${item.status}</span>
                                </div>

                                <div id="${cardId}" class="hidden py-4 border-t mt-3 space-y-4 detail-expanded">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                        <div class="bg-blue-50 p-3 rounded-xl"><strong>ผู้รายงาน:</strong> ${item.reporter}</div>
                                        <div class="bg-green-50 p-3 rounded-xl"><strong>ผู้รับผิดชอบ:</strong> ${item.owner}</div>
                                        <div class="bg-slate-50 p-3 rounded-xl"><strong>แนวทางแก้ไข:</strong><br>${item.solution || '-'}</div>
                                        <div class="bg-slate-50 p-3 rounded-xl"><strong>กำหนด:</strong> ${item.dueDate} | <strong>เสร็จจริง:</strong> ${item.actualDate || '-'}</div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div><p class="text-[10px] font-bold text-red-500 mb-1">📸 BEFORE</p><img src="${item.imgBefore}" class="w-full rounded-xl border shadow-sm"></div>
                                        <div><p class="text-[10px] font-bold text-green-500 mb-1">✅ AFTER</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="w-full rounded-xl border shadow-sm">` : `<div class="h-32 bg-slate-100 rounded-xl flex items-center justify-center text-[10px] text-slate-400">รออัปเดตงาน</div>`}</div>
                                    </div>
                                    <div class="flex gap-2 no-print">
                                        <button onclick='openUpdate("${id}")' class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold text-xs">อัปเดต/ปิดงาน</button>
                                        <button onclick='deleteItem("${id}")' class="px-4 bg-red-50 text-red-500 py-2 rounded-lg font-bold text-xs">ลบ</button>
                                    </div>
                                </div>

                                <div class="flex justify-between items-center pt-3 border-t mt-3 no-print">
                                    <span class="text-[10px] font-bold text-slate-400">โดย: ${item.reporter}</span>
                                    <button onclick="toggleDetail('${cardId}')" class="text-blue-600 font-bold text-xs flex items-center">ดูรายละเอียด <i data-lucide="chevron-down" size="14"></i></button>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.toggleDetail = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        window.openUpdate = (id) => {
            currentEditingId = id;
            document.getElementById('modal-update').classList.remove('hidden');
        };

        window.deleteItem = (id) => {
            if(confirm('ยืนยันการลบข้อมูลถาวร?')) remove(ref(db, `patrols/${currentPath}/${id}`));
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: imgData || "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { 
                closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; 
            });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังอัปเดต...";
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { 
                status: document.getElementById('upStatus').value, 
                actualDate: document.getElementById('upActualDate').value 
            };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { 
                document.getElementById('modal-update').classList.add('hidden'); btn.innerText = "บันทึกอัปเดต";
            });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
