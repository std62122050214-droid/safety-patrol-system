<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷 SAFETY PATROL & 5S 👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .input-field { border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; }
        
        /* สถานะสีตามภาพตัวอย่าง */
        .status-badge { font-size: 10px; font-weight: bold; padding: 4px 12px; border-radius: 9999px; text-transform: uppercase; }
        .status-pending { background-color: #fee2e2; color: #ef4444; }
        .status-complete { background-color: #d1fae5; color: #10b981; }

        @media print {
            .no-print, button, nav { display: none !important; }
            body { background: white; padding: 0; }
            #dataItems { display: block !important; }
            .report-card { border: 1px solid #eee; margin-bottom: 20px; page-break-inside: avoid; padding: 20px; border-radius: 15px; }
            .print-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 20px; margin-top: 15px; }
            img { max-width: 100% !important; border-radius: 10px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 no-print">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-3xl font-black text-slate-800 mb-6 flex justify-center items-center gap-2">
                👷 SAFETY PATROL & 5S 👷‍♀️
            </h1>
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2 rounded-full shadow-sm border">
                <span class="text-slate-400 text-xs font-bold uppercase">ปีที่บันทึก:</span>
                <select id="yearSelect" class="font-bold text-blue-600 outline-none cursor-pointer"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-12">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 no-print flex justify-between items-center shadow-sm">
            <button onclick="goBackHome()" class="flex items-center gap-2 text-slate-500 font-bold"><i data-lucide="arrow-left" size="20"></i> กลับ</button>
            <h2 id="currentMonthTitle" class="font-black text-slate-800"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="p-2 border rounded-xl text-slate-400"><i data-lucide="printer" size="20"></i></button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold shadow-lg">+ เพิ่มข้อมูล</button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto mt-10 px-4 space-y-4"></div>
    </div>

    <div id="modal-manage" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2rem] p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 no-print">
                <h3 class="text-xl font-bold" id="modalTitle">รายละเอียดข้อมูล</h3>
                <button onclick="closeModal('modal-manage')"><i data-lucide="x" size="28"></i></button>
            </div>
            
            <div id="manageContent">
                </div>
            
            <div class="mt-8 flex gap-3 no-print" id="manageButtons">
                <button id="btnEdit" class="flex-1 bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="edit-3" size="20"></i> แก้ไขข้อมูล
                </button>
                <button id="btnDelete" class="bg-red-50 text-red-500 px-6 rounded-2xl border border-red-100 hover:bg-red-500 hover:text-white transition-all">
                    <i data-lucide="trash-2" size="20"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/60 z-[110] hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8 shadow-2xl">
            <h3 class="text-xl font-bold mb-6 flex items-center gap-2" id="formTitle">📝 บันทึกข้อมูลใหม่</h3>
            <form id="patrolForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="reporter" placeholder="ชื่อผู้รายงาน (PIC)" required class="input-field">
                    <select id="dept" class="input-field font-bold">
                        <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>อื่นๆ</option>
                    </select>
                </div>
                <textarea id="detail" placeholder="ปัญหาที่พบ (Problem)" required class="input-field" rows="3"></textarea>
                <input type="text" id="solution" placeholder="แนวทางแก้ไข (Solution)" class="input-field">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="owner" placeholder="ผู้รับผิดชอบ" class="input-field">
                    <input type="date" id="dueDate" class="input-field">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">รูปภาพ BEFORE</label>
                        <input type="file" id="imgBefore" accept="image/*" class="text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">รูปภาพ AFTER</label>
                        <input type="file" id="imgAfter" accept="image/*" class="text-sm">
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal('modal-form')" class="flex-1 py-4 font-bold text-slate-400">ยกเลิก</button>
                    <button type="submit" id="submitBtn" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "", editingItem = null;

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        window.initHome = () => {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm cursor-pointer hover:shadow-xl transition-all';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <b class="text-slate-700 text-lg">${m}</b>
                        <i data-lucide="chevron-right" size="18" class="text-slate-300"></i>
                    </div>
                    <div id="stats-${mid}" class="space-y-2">
                        <div class="bg-blue-50 p-2 px-3 rounded-xl flex justify-between"><span class="text-[10px] font-bold text-blue-500 uppercase">ตรวจพบ</span><span class="font-bold text-blue-600" id="total-${mid}">0</span></div>
                        <div class="bg-emerald-50 p-2 px-3 rounded-xl flex justify-between"><span class="text-[10px] font-bold text-emerald-500 uppercase">แก้ไขแล้ว</span><span class="font-bold text-emerald-600" id="done-${mid}">0</span></div>
                        <div class="bg-orange-50 p-2 px-3 rounded-xl flex justify-between"><span class="text-[10px] font-bold text-orange-500 uppercase">คงเหลือ</span><span class="font-bold text-orange-600" id="remain-${mid}">0</span></div>
                    </div>`;
                
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const data = snap.val();
                    if (data) {
                        const items = Object.values(data);
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        document.getElementById(`total-${mid}`).innerText = items.length;
                        document.getElementById(`done-${mid}`).innerText = done;
                        document.getElementById(`remain-${mid}`).innerText = items.length - done;
                    }
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        };

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const sClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
                        container.innerHTML += `
                            <div onclick='viewManage("${id}", ${JSON.stringify(item)})' class="report-card bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-all">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${item.dept}</p>
                                    <h3 class="font-bold text-slate-700 text-lg mb-1">${item.detail}</h3>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase flex items-center gap-1"><i data-lucide="user" size="10"></i> PIC: ${item.reporter}</p>
                                </div>
                                <div class="flex flex-col items-end gap-2">
                                    <span class="status-badge ${sClass}">${item.status}</span>
                                    <span class="text-[10px] text-slate-300 font-bold no-print">ดูรายละเอียด ></span>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.viewManage = (id, item) => {
            currentId = id; editingItem = item;
            const content = document.getElementById('manageContent');
            const sClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-slate-50 p-4 rounded-2xl"><b class="text-[10px] text-slate-400 block mb-1 uppercase">ผู้รายงาน (PIC)</b><span class="font-bold text-slate-700">${item.reporter}</span></div>
                    <div class="bg-slate-50 p-4 rounded-2xl"><b class="text-[10px] text-slate-400 block mb-1 uppercase">สถานะ</b><span class="status-badge ${sClass}">${item.status}</span></div>
                    <div class="bg-slate-50 p-4 rounded-2xl"><b class="text-[10px] text-slate-400 block mb-1 uppercase">กำหนดเสร็จ</b><span class="font-bold text-orange-600">${item.dueDate || '-'}</span></div>
                    <div class="bg-slate-50 p-4 rounded-2xl"><b class="text-[10px] text-slate-400 block mb-1 uppercase">ผู้รับผิดชอบ</b><span class="font-bold text-slate-700">${item.owner || '-'}</span></div>
                </div>
                <div class="p-6 bg-slate-50 rounded-3xl border border-slate-100 mb-4">
                    <b class="text-[10px] text-slate-400 block mb-1 uppercase">PROBLEM / ปัญหาที่พบ</b>
                    <p class="font-bold text-slate-800 text-xl leading-relaxed">${item.detail}</p>
                </div>
                <div class="p-6 bg-blue-50/50 rounded-3xl border border-blue-100 mb-6">
                    <b class="text-[10px] text-blue-500 block mb-1 uppercase">SOLUTION / วิธีแก้ไข</b>
                    <p class="font-bold text-slate-700">${item.solution || 'อยู่ระหว่างดำเนินการ'}</p>
                </div>
                <div class="print-grid flex gap-6">
                    <div class="flex-1 text-center"><p class="text-[10px] font-black text-red-400 uppercase mb-2">📸 BEFORE</p><img src="${item.imgBefore || ''}" class="rounded-3xl w-full border shadow-md h-64 object-cover bg-white"></div>
                    <div class="flex-1 text-center"><p class="text-[10px] font-black text-emerald-400 uppercase mb-2">✅ AFTER</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-3xl w-full border shadow-md h-64 object-cover bg-white">` : '<div class="h-64 bg-slate-50 rounded-3xl border border-dashed flex items-center justify-center text-slate-300 font-bold uppercase text-[10px]">รอการแก้ไข</div>'}</div>
                </div>`;
            document.getElementById('modal-manage').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        window.openForm = (isEdit = false) => {
            document.getElementById('formTitle').innerText = isEdit ? "✏️ แก้ไขข้อมูล" : "📝 บันทึกข้อมูลใหม่";
            if (isEdit && editingItem) {
                document.getElementById('reporter').value = editingItem.reporter;
                document.getElementById('dept').value = editingItem.dept;
                document.getElementById('detail').value = editingItem.detail;
                document.getElementById('solution').value = editingItem.solution || "";
                document.getElementById('owner').value = editingItem.owner || "";
                document.getElementById('dueDate').value = editingItem.dueDate || "";
            } else {
                document.getElementById('patrolForm').reset();
                currentId = "";
            }
            document.getElementById('modal-form').classList.remove('hidden');
        };

        document.getElementById('patrolForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;
            
            const beforeImg = await processImg(document.getElementById('imgBefore').files[0]);
            const afterImg = await processImg(document.getElementById('imgAfter').files[0]);

            const payload = {
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value,
                owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value,
                status: (afterImg || (editingItem && editingItem.imgAfter)) ? "เสร็จสิ้น" : "รอดำเนินการ"
            };

            if (beforeImg) payload.imgBefore = beforeImg;
            if (afterImg) payload.imgAfter = afterImg;

            if (currentId) {
                update(ref(db, `patrols/${currentPath}/${currentId}`), payload);
            } else {
                push(ref(db, `patrols/${currentPath}`), payload);
            }

            closeModal('modal-form');
            closeModal('modal-manage');
            btn.innerText = "บันทึกข้อมูล"; btn.disabled = false;
        };

        document.getElementById('btnEdit').onclick = () => openForm(true);
        document.getElementById('btnDelete').onclick = () => { if(confirm('ยืนยันการลบข้อมูลนี้?')) { remove(ref(db, `patrols/${currentPath}/${currentId}`)); closeModal('modal-manage'); } };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
