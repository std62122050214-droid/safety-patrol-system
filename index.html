<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .month-card { transition: all 0.3s; cursor: pointer; border-radius: 1.5rem; background: white; padding: 1.2rem; text-align: center; border: 2px solid #e2e8f0; position: relative; }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }
        .input-box { width: 100%; padding: 0.7rem 1rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 0.8rem; outline: none; font-size: 14px; }
        .count-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-black text-blue-900 italic tracking-tight text-center">Safety Patrol & 5S 👷</h1>
            <div class="flex justify-center items-center gap-3 mt-6">
                <span class="font-bold text-slate-500">เลือกปี:</span>
                <select id="yearSelect" class="bg-white border-2 border-blue-500 rounded-xl px-4 py-1 font-black text-blue-600 outline-none"></select>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen">
        <nav class="bg-white/80 backdrop-blur-md border-b p-4 sticky top-0 flex justify-between items-center px-6 shadow-sm z-10">
            <button onclick="location.reload()" class="font-bold text-slate-500 flex items-center gap-1"><i data-lucide="arrow-left"></i> ย้อนกลับ</button>
            <h2 id="currentMonthTitle" class="font-extrabold text-blue-800"></h2>
            <button onclick="openForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg">+ เพิ่มเรื่องที่พบ</button>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-6">บันทึกข้อมูล 👷</h3>
            <form id="mainForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-xs font-bold">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                <div><label class="text-xs font-bold">ชื่อผู้ส่ง (Reporter)</label><input type="text" id="reporter" placeholder="ชื่อของคุณ" required class="input-box"></div>
                <div>
                    <label class="text-xs font-bold">แผนก</label>
                    <select id="dept" class="input-box">
                        <option value="Welding">Welding</option>
                        <option value="Assembly">Assembly</option>
                        <option value="Inventory">Inventory</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div><label class="text-xs font-bold">หมวดหมู่</label><select id="category" class="input-box"><option>ความปลอดภัย (Safety)</option><option>5ส (5S)</option></select></div>
                <div class="md:col-span-2"><label class="text-xs font-bold text-red-500">ปัญหาที่พบ</label><textarea id="detail" rows="2" placeholder="ระบุปัญหาที่เจอ..." required class="input-box border-red-200"></textarea></div>
                <div class="md:col-span-2"><label class="text-xs font-bold text-green-600">แนวทางการแก้ไข</label><textarea id="solution" rows="2" placeholder="ระบุวิธีแก้ไขเบื้องต้น..." class="input-box border-green-200"></textarea></div>
                <div class="md:col-span-2"><label class="text-xs font-bold">📸 แนบรูปภาพ</label><input type="file" id="imgBefore" accept="image/*" class="text-xs mt-1"></div>
                <div class="md:col-span-2 pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/90 hidden z-[60] flex items-center justify-center p-4">
        <div id="detailContent" class="bg-white w-full max-w-xl rounded-[3rem] p-8 relative overflow-y-auto max-h-[90vh]"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card shadow-sm';
                div.innerHTML = `<div class="text-blue-500 mb-1"><i data-lucide="calendar"></i></div><div class="font-black text-slate-700">${m}</div><div id="stats-${monthId}"></div>`;
                
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `<span class="count-badge bg-blue-100 text-blue-600">พบ ${total}</span> <span class="count-badge bg-green-100 text-green-600">แก้ ${done}</span>`;
                    }
                });

                div.onclick = () => {
                    currentPath = monthId;
                    document.getElementById('page-home').classList.add('hidden');
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        container.innerHTML += `
                            <div onclick='viewDetail(${JSON.stringify(item)})' class="bg-white p-5 rounded-2xl shadow-sm border-l-8 border-blue-500 cursor-pointer">
                                <div class="flex justify-between text-[10px] font-bold mb-1">
                                    <span class="text-blue-600 uppercase">${item.dept}</span>
                                    <span class="${item.status === 'เสร็จสิ้น' ? 'text-green-500' : 'text-orange-500'}">${item.status || 'รอดำเนินการ'}</span>
                                </div>
                                <p class="font-black text-slate-800">${item.detail}</p>
                                <p class="text-[10px] text-slate-400 mt-2">โดย: ${item.reporter}</p>
                            </div>`;
                    });
                }
            });
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value,
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                category: document.getElementById('category').value,
                detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value,
                imgBefore: imgData,
                status: "รอดำเนินการ",
                ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => {
                alert(`บันทึกเรียบร้อย! ขอบคุณครับคุณ ${payload.reporter}`);
                closeForm();
                e.target.reset();
                btn.disabled = false;
            });
        };

        window.viewDetail = (item) => {
            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="absolute top-6 right-6 text-slate-400"><i data-lucide="x-circle" size="30"></i></button>
                <div class="mb-6">
                    <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase">${item.dept}</span>
                </div>
                <div class="space-y-4">
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">ปัญหาที่พบ</p><p class="text-lg font-black text-red-600">${item.detail}</p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">แนวทางการแก้ไข</p><p class="text-md font-bold text-green-700">${item.solution || '-'}</p></div>
                    <div class="bg-blue-50 p-4 rounded-2xl flex items-center gap-3">
                        <i data-lucide="user" class="text-blue-500"></i>
                        <div><p class="text-[10px] text-blue-400 font-bold uppercase">ผู้รายงาน</p><p class="font-black text-blue-900">${item.reporter}</p></div>
                    </div>
                    ${item.imgBefore ? `<img src="${item.imgBefore}" class="w-full rounded-2xl shadow-lg border-4 border-white">` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
