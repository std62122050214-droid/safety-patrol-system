<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol System 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .hidden { display: none !important; }
        
        /* ฟอร์มกรอกข้อมูล - แยกสีช่องให้ชัดเจน */
        .input-base { width: 100%; padding: 0.85rem; border-radius: 1rem; border: 2px solid #e2e8f0; outline: none; transition: all 0.2s; font-weight: 500; }
        .input-date { background-color: #fffaf0; border-color: #fbd38d; } /* สีส้มอ่อน สำหรับวันที่ */
        .input-reporter { background-color: #f0fff4; border-color: #9ae6b4; } /* สีเขียวอ่อน สำหรับผู้รายงาน */
        .input-dept { background-color: #ebf8ff; border-color: #90cdf4; } /* สีฟ้าอ่อน สำหรับแผนก */
        .input-pic { background-color: #edf2ff; border-color: #a5b4fc; } /* สีม่วง/น้ำเงินอ่อน สำหรับ PIC */
        
        /* สไตล์สำหรับการพิมพ์ */
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .report-page { display: block !important; padding: 20px; }
            .case-card { break-inside: avoid; border: 1px solid #e2e8f0 !important; margin-bottom: 30px; padding: 20px; border-radius: 15px; page-break-inside: avoid; }
            .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
            .print-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 no-print">
        <div class="max-w-5xl mx-auto text-center py-10">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-6 flex items-center justify-center gap-2">
                <i data-lucide="shield-check" class="text-blue-600"></i> Safety Patrol & 5S
            </h1>
            <select id="yearSelect" class="bg-white border-2 border-blue-200 rounded-xl px-4 py-2 font-bold text-blue-600 shadow-sm outline-none cursor-pointer"></select>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-10" id="monthGrid"></div>
        </div>
    </div>

    <div id="page-list" class="hidden min-h-screen">
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b p-4 no-print">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="text-slate-500 font-bold flex items-center gap-1 hover:text-blue-600 transition-colors">
                    <i data-lucide="arrow-left" size="18"></i> ย้อนกลับ
                </button>
                <h2 id="currentMonthTitle" class="font-extrabold text-slate-800 text-lg"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-slate-800 text-white p-2.5 rounded-xl shadow-lg hover:bg-slate-700 transition-transform active:scale-95">
                        <i data-lucide="printer" size="20"></i>
                    </button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-1 shadow-lg shadow-blue-200 hover:bg-blue-700 transition-transform active:scale-95">
                        <i data-lucide="plus" size="20"></i> เพิ่มข้อมูล
                    </button>
                </div>
            </div>
        </nav>

        <div class="max-w-4xl mx-auto p-4 space-y-6" id="dataItems"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4 hidden no-print backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b flex justify-between items-center bg-blue-50/50">
                <h3 class="text-xl font-extrabold text-blue-900 flex items-center gap-2">เพิ่มรายการตรวจพบ 📝</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" size="24"></i></button>
            </div>
            <form id="mainForm" class="p-8 space-y-4 max-h-[80vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">วันที่ตรวจ</label>
                        <input type="date" id="postDate" required class="input-base input-date">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">ผู้รายงาน (Reporter)</label>
                        <input type="text" id="reporter" placeholder="ชื่อผู้รายงาน" required class="input-base input-reporter">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">แผนก/พื้นที่</label>
                        <select id="dept" class="input-base input-dept">
                            <option value="Welding">Welding</option>
                            <option value="Assembly">Assembly</option>
                            <option value="Manufacturing">Manufacturing</option>
                            <option value="Inventory">Inventory</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">กำหนดเสร็จ (Due)</label>
                        <input type="date" id="dueDate" required class="input-base input-date">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">ปัญหาที่พบ (Issue)</label>
                    <textarea id="detail" rows="2" placeholder="อธิบายสิ่งที่พบ..." required class="input-base bg-slate-50"></textarea>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">แนวทางแก้ไข (Solution)</label>
                    <textarea id="solution" rows="2" placeholder="วิธีแก้ไขเบื้องต้น..." class="input-base bg-slate-50"></textarea>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">ผู้รับผิดชอบ (PIC)</label>
                    <input type="text" id="owner" placeholder="ชื่อผู้รับผิดชอบ" required class="input-base input-pic">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2 mb-1 block">รูปภาพเหตุการณ์</label>
                    <input type="file" id="imgBefore" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-extrabold text-lg shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all mt-4">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2030; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-2xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all text-center';
                div.innerHTML = `<h3 class="font-bold text-slate-700 mb-2">${m}</h3><div id="stats-${monthId}" class="text-xs font-bold text-slate-400 italic">ไม่มีข้อมูล</div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const stats = snap.val();
                    if(stats) {
                        const total = Object.keys(stats).length;
                        const done = Object.values(stats).filter(v => v.status === 'เสร็จสิ้น').length;
                        document.getElementById(`stats-${monthId}`).innerHTML = `<span class="text-blue-500">พบ: ${total}</span> | <span class="text-emerald-500">เสร็จ: ${done}</span>`;
                    }
                });
                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div class="case-card bg-white p-6 rounded-[2rem] shadow-sm border-l-[10px] ${isDone ? 'border-emerald-500' : 'border-orange-500'}">
                                <div class="flex justify-between items-start mb-4">
                                    <span class="px-3 py-1 bg-slate-100 rounded-full text-[10px] font-extrabold text-slate-500 uppercase tracking-widest">📍 ${item.dept}</span>
                                    <span class="text-xs font-black ${isDone ? 'text-emerald-600' : 'text-orange-600'}">${item.status}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-3">${item.detail}</h3>
                                <div class="bg-slate-50 p-4 rounded-xl mb-4 text-sm text-slate-600">
                                    <p class="text-[10px] font-bold text-slate-400 mb-1 uppercase">แนวทางแก้ไข</p>
                                    ${item.solution || '-'}
                                </div>
                                <div class="grid grid-cols-2 gap-4 mb-4 no-print">
                                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                        <p class="text-[9px] font-bold text-blue-400 uppercase">ผู้รับผิดชอบ (PIC)</p>
                                        <p class="text-sm font-black text-blue-900">${item.owner}</p>
                                    </div>
                                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                                        <p class="text-[9px] font-bold text-emerald-400 uppercase">ผู้รายงาน (Reporter)</p>
                                        <p class="text-sm font-black text-emerald-900">${item.reporter}</p>
                                    </div>
                                </div>
                                <div class="print-grid">
                                    <div>
                                        <p class="text-[10px] font-bold text-slate-400 mb-2 uppercase">📸 ก่อนแก้ไข (Date: ${item.postDate})</p>
                                        <img src="${item.imgBefore}" class="print-img rounded-xl border">
                                    </div>
                                    ${item.imgAfter ? `
                                    <div>
                                        <p class="text-[10px] font-bold text-emerald-500 mb-2 uppercase">✅ หลังแก้ไข (Date: ${item.actualDate})</p>
                                        <img src="${item.imgAfter}" class="print-img rounded-xl border-2 border-emerald-200">
                                    </div>` : ''}
                                </div>
                                <div class="mt-4 pt-4 border-t border-slate-50 flex justify-between items-center text-[11px] font-bold text-slate-400 italic">
                                    <span>👤 โดย: ${item.reporter}</span>
                                    <span class="text-red-400">📅 Due: ${item.dueDate}</span>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value, detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value, imgBefore: imgData || "",
                status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { 
                closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; 
            });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
