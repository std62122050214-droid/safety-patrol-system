<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; margin: 0; }
        .month-card { transition: all 0.3s ease; cursor: pointer; border-radius: 2rem; border: 2px solid #f1f5f9; background: white; padding: 1.5rem; text-align: center; }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="step-setup" class="min-h-screen p-8 flex flex-col items-center">
        <h1 class="text-3xl font-black text-blue-900 mb-2">SAFETY PATROL 5S</h1>
        <p class="text-slate-500 mb-8">เลือกเดือนที่ต้องการตรวจสอบ</p>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl w-full" id="monthsGrid">
            </div>
    </div>

    <div id="step-dashboard" class="hidden min-h-screen">
        <nav class="bg-white border-b p-4 sticky top-0 flex justify-between items-center px-8 shadow-sm">
            <button onclick="location.reload()" class="text-slate-500 font-bold flex items-center gap-2">
                <i data-lucide="arrow-left"></i> ย้อนกลับ
            </button>
            <h2 id="displayMonthLabel" class="text-xl font-bold text-blue-800"></h2>
            <button onclick="showForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg">+ เพิ่มเรื่องที่พบ</button>
        </nav>
        <div id="patrolList" class="max-w-3xl mx-auto p-6 space-y-4">
            <p class="text-center text-slate-400 mt-10">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8">
            <h3 class="text-xl font-bold mb-4">บันทึกข้อมูล</h3>
            <form id="saveForm" class="space-y-4">
                <input type="text" id="dept" placeholder="แผนก" required class="w-full p-3 bg-slate-50 rounded-xl border">
                <textarea id="detail" placeholder="รายละเอียด" required class="w-full p-3 bg-slate-50 rounded-xl border"></textarea>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">บันทึก</button>
                    <button type="button" onclick="hideForm()" class="px-6 py-3 bg-slate-100 rounded-xl">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // เชื่อมต่อ Firebase ของคุณ
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const grid = document.getElementById('monthsGrid');

        // สร้างปุ่มเดือน
        months.forEach((name, i) => {
            const btn = document.createElement('div');
            btn.className = 'month-card';
            btn.innerHTML = `<h3 class="font-bold text-slate-700">${name}</h3><p class="text-xs text-slate-400">2026</p>`;
            btn.onclick = () => openDashboard(name, i + 1);
            grid.appendChild(btn);
        });

        window.openDashboard = (name, monthNum) => {
            document.getElementById('step-setup').classList.add('hidden');
            document.getElementById('step-dashboard').classList.remove('hidden');
            document.getElementById('displayMonthLabel').innerText = `รอบเดือน ${name} 2026`;
            
            // ดึงข้อมูล
            onValue(ref(db, `patrols/2026-${monthNum}`), (snap) => {
                const list = document.getElementById('patrolList');
                list.innerHTML = "";
                const data = snap.val();
                if (!data) list.innerHTML = "<p class='text-center text-slate-400'>ยังไม่มีข้อมูล</p>";
                else {
                    Object.values(data).reverse().forEach(item => {
                        list.innerHTML += `<div class="bg-white p-5 rounded-2xl border">
                            <span class="text-blue-600 font-bold text-sm">${item.dept}</span>
                            <p class="mt-1">${item.detail}</p>
                        </div>`;
                    });
                }
            });

            // ตั้งค่าฟอร์มส่งข้อมูล
            document.getElementById('saveForm').onsubmit = (e) => {
                e.preventDefault();
                push(ref(db, `patrols/2026-${monthNum}`), {
                    dept: document.getElementById('dept').value,
                    detail: document.getElementById('detail').value
                }).then(() => {
                    hideForm();
                    e.target.reset();
                });
            };
        };

        window.showForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.hideForm = () => document.getElementById('modal-form').classList.add('hidden');
        lucide.createIcons();
    </script>
</body>
</html>
