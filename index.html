<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S System 2026-2099</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .month-card { transition: all 0.3s; cursor: pointer; border-radius: 1.5rem; background: white; padding: 1.2rem; text-align: center; border: 2px solid #e2e8f0; }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }
        .input-box { width: 100%; padding: 0.7rem 1rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 0.8rem; outline: none; font-size: 14px; }
        .input-box:focus { border-color: #3b82f6; ring: 2px; ring-color: #3b82f6; }
        label { font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-black text-blue-900 italic tracking-tight">SAFETY PATROL 5S</h1>
            <div class="flex justify-center items-center gap-3 mt-6">
                <span class="font-bold text-slate-600">ปีงบประมาณ:</span>
                <select id="yearSelect" class="bg-white border-2 border-blue-500 rounded-xl px-4 py-2 font-black text-blue-600 outline-none shadow-sm">
                    </select>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen">
        <nav class="bg-white/80 backdrop-blur-md border-b p-4 sticky top-0 flex justify-between items-center px-6 shadow-sm z-10">
            <button onclick="location.reload()" class="flex items-center gap-1 text-slate-500 font-bold hover:text-blue-600"><i data-lucide="arrow-left"></i> ย้อนกลับ</button>
            <h2 id="currentMonthTitle" class="font-extrabold text-blue-800 text-lg"></h2>
            <button onclick="openForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition">+ เพิ่มเรื่องที่พบ</button>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-slate-800">บันทึกข้อมูลการตรวจ</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-red-500"><i data-lucide="x-circle" size="30"></i></button>
            </div>
            
            <form id="mainForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2 bg-blue-50 p-4 rounded-2xl text-blue-700 text-xs font-bold italic">📌 ข้อมูลเบื้องต้น</div>
                <div><label>วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                <div><label>ชื่อผู้ส่งข้อมูล</label><input type="text" id="reporter" placeholder="ระบุชื่อผู้รายงาน" required class="input-box"></div>
                <div><label>แผนกที่ตรวจพบ</label><input type="text" id="dept" placeholder="เช่น Production, Store" required class="input-box"></div>
                <div><label>หมวดหมู่</label><select id="category" class="input-box"><option>ความปลอดภัย (Safety)</option><option>5ส (5S)</option><option>สิ่งแวดล้อม (Environment)</option></select></div>
                <div class="md:col-span-2"><label>รายละเอียดสิ่งที่พบ</label><textarea id="detail" rows="3" placeholder="อธิบายสิ่งที่พบเจอ..." required class="input-box"></textarea></div>
                
                <div class="md:col-span-2 bg-orange-50 p-4 rounded-2xl text-orange-700 text-xs font-bold italic">⚙️ แผนการแก้ไข</div>
                <div><label>ผู้รับผิดชอบแก้ไข</label><input type="text" id="assignee" placeholder="ชื่อผู้รับผิดชอบ" class="input-box"></div>
                <div><label>กำหนดเสร็จ</label><input type="date" id="deadline" class="input-box"></div>
                <div><label>สถานะปัจจุบัน</label>
                    <select id="status" class="input-box">
                        <option value="รอดำเนินการ">รอดำเนินการ</option>
                        <option value="กำลังแก้ไข">กำลังแก้ไข</option>
                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                    </select>
                </div>
                <div><label>วันที่แก้ไขจริง</label><input type="date" id="actualDate" class="input-box"></div>

                <div class="md:col-span-2 bg-slate-50 p-4 rounded-2xl text-slate-700 text-xs font-bold italic">📸 รูปภาพหลักฐาน (รองรับการถ่ายจากมือถือ)</div>
                <div><label>รูปภาพ (ก่อนแก้ไข)</label><input type="file" id="imgBefore" accept="image/*" class="text-xs"></div>
                <div><label>รูปภาพ (หลังแก้ไข)</label><input type="file" id="imgAfter" accept="image/*" class="text-xs"></div>

                <div class="md:col-span-2 pt-6">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-blue-200 shadow-xl hover:bg-blue-700 disabled:bg-slate-400 transition-all">บันทึกข้อมูลเข้าระบบ</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/90 hidden z-[60] flex items-center justify-center p-4 overflow-y-auto">
        <div id="detailContent" class="bg-white w-full max-w-xl rounded-[3rem] p-10 relative"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ตั้งค่า Firebase
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";

        // สร้างรายการปี 2026 - 2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option');
            opt.value = y; opt.innerText = y;
            yearSelect.appendChild(opt);
        }

        // สร้างตารางเดือน
        const grid = document.getElementById('monthGrid');
        months.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'month-card shadow-sm';
            div.innerHTML = `<div class="text-blue-500 mb-2"><i data-lucide="calendar-days"></i></div><div class="font-black text-slate-700">${m}</div>`;
            div.onclick = () => {
                const year = yearSelect.value;
                currentPath = `${year}-${String(i + 1).padStart(2, '0')}`;
                document.getElementById('page-home').classList.add('hidden');
                document.getElementById('page-list').classList.remove('hidden');
                document.getElementById('currentMonthTitle').innerText = `รอบเดือน ${m} ${year}`;
                fetchData();
            };
            grid.appendChild(div);
        });

        // ดึงข้อมูล
        function fetchData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (!data) {
                    container.innerHTML = `<div class="text-center py-20 text-slate-400 italic">ยังไม่มีข้อมูลการตรวจในเดือนนี้</div>`;
                } else {
                    Object.entries(data).reverse().forEach(([key, item]) => {
                        const statusClass = item.status === 'เสร็จสิ้น' ? 'bg-green-100 text-green-700' : (item.status === 'กำลังแก้ไข' ? 'bg-orange-100 text-orange-700' : 'bg-red-100 text-red-700');
                        container.innerHTML += `
                            <div onclick='viewDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="bg-white p-6 rounded-[2rem] border-l-[12px] border-blue-500 shadow-sm hover:shadow-md cursor-pointer transition-all">
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter ${statusClass}">${item.status}</span>
                                    <span class="text-[10px] text-slate-400 font-bold">${item.postDate}</span>
                                </div>
                                <h4 class="font-black text-slate-800 text-lg leading-tight mb-4">${item.detail}</h4>
                                <div class="flex gap-4 text-[11px] font-bold text-slate-500 border-t pt-4">
                                    <span>📍 ${item.dept}</span>
                                    <span>👤 ${item.reporter}</span>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        // ระบบบีบอัดภาพ (กันค้าง)
        const processImg = async (file) => {
            if (!file) return "";
            return new Promise((res) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.5)); // บีบอัด 50%
                    };
                };
            });
        };

        // บันทึกข้อมูล
        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "กำลังประมวลผลรูปภาพ..."; btn.disabled = true;

            const imgB = await processImg(document.getElementById('imgBefore').files[0]);
            const imgA = await processImg(document.getElementById('imgAfter').files[0]);

            const payload = {
                postDate: document.getElementById('postDate').value,
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                category: document.getElementById('category').value,
                detail: document.getElementById('detail').value,
                assignee: document.getElementById('assignee').value,
                deadline: document.getElementById('deadline').value,
                status: document.getElementById('status').value,
                actualDate: document.getElementById('actualDate').value,
                imgBefore: imgB,
                imgAfter: imgA,
                ts: new Date().getTime()
            };

            push(ref(db, `patrols/${currentPath}`), payload).then(() => {
                alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
                closeForm();
                e.target.reset();
                btn.innerText = "บันทึกข้อมูลเข้าระบบ"; btn.disabled = false;
            }).catch(err => {
                alert("บันทึกไม่สำเร็จ: " + err.message);
                btn.disabled = false;
            });
        };

        // แสดงรายละเอียด
        window.viewDetail = (item) => {
            const modal = document.getElementById('modal-detail');
            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="absolute top-6 right-6 text-slate-300 hover:text-slate-600"><i data-lucide="x-circle" size="32"></i></button>
                <div class="mb-4"><span class="bg-blue-600 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase">${item.category}</span></div>
                <h2 class="text-2xl font-black text-slate-800 mb-6">${item.detail}</h2>
                <div class="grid grid-cols-2 gap-4 text-xs bg-slate-50 p-6 rounded-[2rem] border border-slate-100 mb-6">
                    <div><p class="text-slate-400 font-bold mb-1">ผู้รายงาน</p><p class="font-black text-blue-900">${item.reporter}</p></div>
                    <div><p class="text-slate-400 font-bold mb-1">แผนก</p><p class="font-black text-blue-900">${item.dept}</p></div>
                    <div><p class="text-slate-400 font-bold mb-1">ผู้รับผิดชอบ</p><p class="font-black text-orange-600">${item.assignee || '-'}</p></div>
                    <div><p class="text-slate-400 font-bold mb-1">สถานะ</p><p class="font-black text-blue-600">${item.status}</p></div>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <div><p class="text-[10px] font-black mb-2 text-slate-400">📸 ก่อนแก้ไข</p>
                        ${item.imgBefore ? `<img src="${item.imgBefore}" class="w-full rounded-2xl shadow-md border-4 border-white">` : `<div class="bg-slate-100 h-20 rounded-2xl flex items-center justify-center text-slate-300 italic text-xs">ไม่มีรูปภาพ</div>`}
                    </div>
                    <div><p class="text-[10px] font-black mb-2 text-slate-400">📸 หลังแก้ไข</p>
                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="w-full rounded-2xl shadow-md border-4 border-white">` : `<div class="bg-slate-100 h-20 rounded-2xl flex items-center justify-center text-slate-300 italic text-xs">ไม่มีรูปภาพ</div>`}
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        lucide.createIcons();
    </script>
</body>
</html>
