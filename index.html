<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; color: #334e68; }
        .month-card { transition: all 0.3s ease; cursor: pointer; border-radius: 1.5rem; background: #ffffff; padding: 1.5rem; border: 1px solid #dbe3eb; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .hidden { display: none !important; }
        .stat-badge { display: flex; justify-content: space-between; padding: 0.5rem 0.75rem; border-radius: 0.75rem; margin-top: 0.5rem; font-size: 0.85rem; font-weight: 600; }
        .input-box { width: 100%; padding: 0.8rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 1rem; outline: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .modal-container { background: white; width: 100%; max-width: 45rem; border-radius: 2rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .scroll-area { overflow-y: auto; flex: 1; padding: 1.5rem; }
        .img-preview { width: 100%; max-height: 350px; object-fit: contain; background: #0f172a; border-radius: 1.25rem; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .case-card { break-inside: avoid; border: 1px solid #eee !important; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-4xl font-bold text-slate-900 mb-6 flex items-center justify-center gap-3">
                <i data-lucide="shield-check" class="text-blue-600"></i> Safety Patrol & 5S 👷
            </h1>
            <div class="inline-flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-slate-500 font-medium">ปีที่บันทึกข้อมูล:</span>
                <select id="yearSelect" class="bg-transparent font-bold text-blue-600 outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-10">
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b p-4 mb-6 no-print">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="flex items-center gap-2 font-bold text-slate-600 hover:text-blue-600">
                    <i data-lucide="arrow-left" size="20"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-bold text-slate-800 text-xl"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-slate-100 p-2 rounded-xl text-slate-600 hover:bg-slate-200"><i data-lucide="printer"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-lg hover:bg-blue-700">
                        <i data-lucide="plus" size="18"></i> เพิ่มข้อมูล
                    </button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-6"></div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold">บันทึกรายการตรวจพบ</h3>
                <button onclick="closeForm()"><i data-lucide="x"></i></button>
            </div>
            <div class="scroll-area">
                <form id="mainForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-slate-500">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                        <div><label class="text-xs font-bold text-slate-500">ผู้รายงาน</label><input type="text" id="reporter" placeholder="ชื่อผู้รายงาน" required class="input-box"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-slate-500">แผนก/พื้นที่</label><select id="dept" class="input-box"><option value="Welding">Welding</option><option value="Assembly">Assembly</option><option value="Manufacturing">Manufacturing</option><option value="Inventory">Inventory</option></select></div>
                        <div><label class="text-xs font-bold text-slate-500">กำหนดเสร็จ</label><input type="date" id="dueDate" required class="input-box"></div>
                    </div>
                    <div><label class="text-xs font-bold text-slate-500">รายละเอียดปัญหา</label><textarea id="detail" rows="3" required class="input-box"></textarea></div>
                    <div><label class="text-xs font-bold text-slate-500">แนวทางแก้ไข</label><textarea id="solution" rows="2" class="input-box"></textarea></div>
                    <div><label class="text-xs font-bold text-slate-500">ผู้รับผิดชอบ (PIC)</label><input type="text" id="owner" placeholder="ระบุชื่อผู้รับผิดชอบ" required class="input-box"></div>
                    <div><label class="text-xs font-bold text-slate-500">รูปภาพก่อนแก้ไข</label><input type="file" id="imgBefore" accept="image/*" class="w-full text-sm"></div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">บันทึกข้อมูล</button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-detail" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="p-6 border-b flex justify-between items-center">
                <button id="deleteBtn" class="text-red-500 font-bold text-xs bg-red-50 px-3 py-1 rounded-lg">ลบรายการ</button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')"><i data-lucide="x"></i></button>
            </div>
            <div class="scroll-area bg-slate-50">
                <div id="detailViewContent" class="space-y-6 mb-6"></div>
                <div id="updateSection" class="bg-white p-6 rounded-3xl border shadow-sm">
                    <h4 class="font-bold text-orange-600 mb-4 flex items-center gap-2"><i data-lucide="wrench" size="18"></i> อัปเดตงานแก้ไข</h4>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="upActualDate" class="input-box">
                        <select id="upStatus" class="input-box">
                            <option value="รอดำเนินการ">รอดำเนินการ</option>
                            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                        </select>
                    </div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">รูปภาพหลังแก้ไข</label>
                    <input type="file" id="upImgAfter" accept="image/*" class="w-full text-sm mb-4">
                    <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold">บันทึกการอัปเดต</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        // ตั้งค่าปีถึง 2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card';
                div.innerHTML = `<div class="font-bold text-slate-800 text-lg mb-3">${m}</div><div id="stats-${monthId}"></div>`;
                
                // ดึงสถิติมาโชว์ที่หน้าแรก (ครบทุกสถานะ)
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        const pending = total - done;
                        statsDiv.innerHTML = `
                            <div class="stat-badge bg-blue-50 text-blue-600"><span>พบ</span> <span>${total}</span></div>
                            <div class="stat-badge bg-green-50 text-green-600"><span>เสร็จ</span> <span>${done}</span></div>
                            <div class="stat-badge bg-orange-50 text-orange-600"><span>คงเหลือ</span> <span>${pending}</span></div>
                        `;
                    } else { 
                        statsDiv.innerHTML = `<div class="text-xs text-slate-300 py-4 italic">ไม่มีข้อมูล</div>`; 
                    }
                });

                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden'); 
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData(); 
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="case-card bg-white p-6 rounded-3xl shadow-sm border-l-8 ${isDone ? 'border-green-500' : 'border-orange-500'} cursor-pointer">
                                <div class="flex justify-between mb-3">
                                    <span class="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded text-slate-500 uppercase">${item.dept}</span>
                                    <span class="text-xs font-bold ${isDone ? 'text-green-600' : 'text-orange-500'}">${item.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-800 leading-snug mb-4">${item.detail}</h3>
                                <div class="flex justify-between items-center pt-4 border-t">
                                    <div class="text-xs font-bold text-slate-400">โดย: ${item.reporter}</div> <div class="text-xs font-bold text-slate-400">Due: ${item.dueDate}</div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailViewContent');
            const updateSec = document.getElementById('updateSection');
            if(item.status === 'เสร็จสิ้น') updateSec.classList.add('hidden');
            else updateSec.classList.remove('hidden');

            content.innerHTML = `
                <div class="bg-white p-6 rounded-3xl border shadow-sm">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">${item.detail}</h2>
                    <div class="space-y-3 text-sm">
                        <p><strong>แนวทางแก้ไข:</strong> ${item.solution || '-'}</p>
                        <div class="flex justify-between bg-slate-50 p-3 rounded-xl">
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">PIC</p><p class="font-bold">${item.owner}</p></div>
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">Reporter</p><p class="font-bold">${item.reporter}</p></div>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><p class="text-xs font-bold text-slate-500 mb-2">📸 รูปก่อนแก้ไข</p><img src="${item.imgBefore}" class="img-preview"></div>
                    ${item.imgAfter ? `<div><p class="text-xs font-bold text-green-600 mb-2">✅ รูปหลังแก้ไข (วันที่: ${item.actualDate})</p><img src="${item.imgAfter}" class="img-preview border-4 border-green-500"></div>` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value, detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value, imgBefore: imgData || "",
                status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังอัปเดต..."; btn.disabled = true;
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { 
                document.getElementById('modal-detail').classList.add('hidden'); btn.innerText = "บันทึกการอัปเดต"; btn.disabled = false;
            });
        };

        document.getElementById('deleteBtn').onclick = () => { if(confirm('ลบรายการนี้ใช่หรือไม่?')) remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => document.getElementById('modal-detail').classList.add('hidden')); };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
