<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol System 2026-2099 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        
        /* ฟอร์มแยกสีช่องกรอก */
        .input-base { width: 100%; padding: 0.85rem; border-radius: 1rem; border: 2px solid #e2e8f0; outline: none; }
        .input-date { background-color: #fffaf0; border-color: #fbd38d; }
        .input-reporter { background-color: #f0fff4; border-color: #9ae6b4; }
        .input-dept { background-color: #ebf8ff; border-color: #90cdf4; }
        .input-pic { background-color: #edf2ff; border-color: #a5b4fc; }

        /* การ์ดรายการในหน้าเว็บ (แบบย่อ) */
        .case-card-mini { background: white; padding: 1.25rem; border-radius: 1.5rem; border-left: 8px solid; cursor: pointer; margin-bottom: 1rem; }

        /* การตั้งค่าสำหรับการพิมพ์ - บังคับให้แสดงข้อมูลทั้งหมด */
        @media print {
            .no-print, button, nav { display: none !important; }
            body { background: white; padding: 0; }
            #dataItems { display: block !important; width: 100%; }
            .case-card-mini { 
                border: 1px solid #ddd !important; 
                border-left: 10px solid #334e68 !important;
                break-inside: avoid; 
                display: block !important;
                height: auto !important;
                padding: 20px !important;
            }
            .print-full-info { display: block !important; } /* สั่งให้โชว์ข้อมูลที่เคยซ่อนไว้ */
            .line-clamp-1 { -webkit-line-clamp: unset !important; display: block !important; }
            .img-print { width: 45% !important; display: inline-block !important; margin: 5px; }
        }
        .print-full-info { display: none; } /* ซ่อนในหน้าจอปกติเพื่อให้ดูง่าย */
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 no-print">
        <div class="max-w-5xl mx-auto text-center py-10">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-8 flex items-center justify-center gap-3">
                <i data-lucide="shield-check" class="text-blue-600" size="40"></i> Safety Patrol & 5S
            </h1>
            <div class="inline-flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-slate-500 font-bold text-lg">เลือกปี:</span>
                <select id="yearSelect" class="font-black text-blue-600 outline-none cursor-pointer text-xl bg-transparent"></select>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-12" id="monthGrid"></div>
        </div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 mb-6 no-print">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="text-slate-500 font-bold flex items-center gap-2 hover:text-blue-600"><i data-lucide="chevron-left"></i> ย้อนกลับ</button>
                <h2 id="currentMonthTitle" class="font-black text-slate-800 text-xl"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-slate-800 text-white p-2.5 rounded-xl shadow-lg hover:bg-slate-700 transition-all"><i data-lucide="printer" size="20"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-lg hover:bg-blue-700 transition-all"><i data-lucide="plus-circle" size="20"></i> เพิ่มข้อมูล</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4"></div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/70 z-[110] flex items-center justify-center p-4 hidden no-print backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                <button id="deleteBtn" class="text-red-500 bg-red-50 px-4 py-2 rounded-full font-bold text-xs hover:bg-red-100">ลบรายการ</button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="text-slate-400"><i data-lucide="x-circle" size="30"></i></button>
            </div>
            <div class="overflow-y-auto p-8">
                <div id="detailFullContent"></div>
                <div id="updateSection" class="mt-8 pt-8 border-t border-dashed border-slate-200">
                    <h4 class="font-black text-slate-800 mb-6 flex items-center gap-2 text-lg"><i data-lucide="settings-2" class="text-orange-500"></i> บันทึกผลการแก้ไขงาน</h4>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="upActualDate" class="input-base input-date">
                        <select id="upStatus" class="input-base"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select>
                    </div>
                    <input type="file" id="upImgAfter" accept="image/*" class="w-full text-sm mb-6">
                    <button id="saveUpdateBtn" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black text-lg">อัปเดตข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/70 z-[100] flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-blue-50/50 flex justify-between items-center">
                <h3 class="font-black text-blue-900">เพิ่มรายการตรวจพบ 📝</h3>
                <button onclick="closeForm()"><i data-lucide="x"></i></button>
            </div>
            <form id="mainForm" class="p-8 space-y-4 max-h-[75vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="postDate" required class="input-base input-date">
                    <input type="text" id="reporter" placeholder="ผู้รายงาน (Reporter)" required class="input-base input-reporter">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <select id="dept" class="input-base input-dept">
                        <option value="Welding">Welding</option>
                        <option value="Assembly">Assembly</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Inventory">Inventory</option>
                        <option value="Others">อื่นๆ (Others)</option> </select>
                    <input type="date" id="dueDate" required class="input-base input-date">
                </div>
                <textarea id="detail" rows="2" placeholder="รายละเอียดปัญหา..." required class="input-base bg-slate-50"></textarea>
                <textarea id="solution" rows="2" placeholder="แนวทางแก้ไข..." class="input-base bg-slate-50"></textarea>
                <input type="text" id="owner" placeholder="ผู้รับผิดชอบ (PIC)" required class="input-base input-pic">
                <input type="file" id="imgBefore" accept="image/*" class="w-full text-sm">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }
        yearSelect.value = "2026";

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-3xl shadow-sm border border-slate-100 cursor-pointer hover:border-blue-400 transition-all';
                div.innerHTML = `<h3 class="font-black text-slate-700 mb-4">${m}</h3><div id="stats-${monthId}" class="space-y-2"></div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if(data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="flex justify-between text-[11px] font-black p-2 bg-blue-50 text-blue-600 rounded-xl"><span>พบ</span><span>${total}</span></div>
                            <div class="flex justify-between text-[11px] font-black p-2 bg-emerald-50 text-emerald-600 rounded-xl"><span>เสร็จ</span><span>${done}</span></div>
                            <div class="flex justify-between text-[11px] font-black p-2 bg-orange-50 text-orange-600 rounded-xl"><span>ค้าง</span><span>${total - done}</span></div>
                        `;
                    } else { statsDiv.innerHTML = `<p class="text-xs text-slate-300 italic text-center py-4">ไม่มีข้อมูล</p>`; }
                });
                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        // โครงสร้างการ์ดที่รองรับการ Print Full Data
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="case-card-mini ${isDone ? 'border-emerald-500' : 'border-orange-500'}">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <p class="text-[10px] font-black text-blue-500 uppercase">📍 แผนก: ${item.dept || 'Others'}</p>
                                        <h4 class="font-bold text-slate-800 text-lg">${item.detail}</h4>
                                    </div>
                                    <div class="text-right no-print">
                                        <span class="text-xs font-black ${isDone ? 'text-emerald-600' : 'text-orange-600'}">${item.status}</span>
                                    </div>
                                </div>
                                <div class="print-full-info mt-4 space-y-2 text-sm border-t pt-2">
                                    <p><strong>วิธีแก้ไข:</strong> ${item.solution || '-'}</p>
                                    <p><strong>ผู้รับผิดชอบ:</strong> ${item.owner} | <strong>ผู้รายงาน:</strong> ${item.reporter}</p>
                                    <div class="flex gap-4 mt-2">
                                        <div class="img-print text-center"><p class="text-[9px]">ก่อนแก้ไข</p><img src="${item.imgBefore}" class="rounded border h-32 w-full object-cover"></div>
                                        ${item.imgAfter ? `<div class="img-print text-center"><p class="text-[9px]">หลังแก้ไข</p><img src="${item.imgAfter}" class="rounded border h-32 w-full object-cover"></div>` : ''}
                                    </div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailFullContent');
            const updateSec = document.getElementById('updateSection');
            if(item.status === 'เสร็จสิ้น') updateSec.classList.add('hidden');
            else updateSec.classList.remove('hidden');

            content.innerHTML = `
                <div class="space-y-4">
                    <p class="text-[11px] font-black text-blue-500 uppercase tracking-widest">📍 แผนก: ${item.dept || 'Others'}</p>
                    <h2 class="text-2xl font-black text-slate-800">${item.detail}</h2>
                    <div class="p-4 bg-slate-50 rounded-2xl border text-sm"><p class="font-bold text-slate-400 text-[10px] mb-1">SOLUTION</p>${item.solution || '-'}</div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-blue-50 rounded-2xl text-xs font-bold text-blue-800">PIC: ${item.owner}</div>
                        <div class="p-4 bg-emerald-50 rounded-2xl text-xs font-bold text-emerald-800">Reporter: ${item.reporter}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <img src="${item.imgBefore}" class="w-full h-40 object-cover rounded-xl border">
                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="w-full h-40 object-cover rounded-xl border-4 border-emerald-50">` : '<div class="bg-slate-100 rounded-xl flex items-center justify-center text-[10px] text-slate-400">ยังไม่มีรูปแก้ไข</div>'}
                    </div>
                </div>`;
            document.getElementById('modal-detail').classList.remove('hidden');
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(600 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value, detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value, imgBefore: imgData || "",
                status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังอัปเดต..."; btn.disabled = true;
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value || new Date().toISOString().split('T')[0] };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { 
                document.getElementById('modal-detail').classList.add('hidden'); btn.innerText = "อัปเดตข้อมูล"; btn.disabled = false;
            });
        };

        document.getElementById('deleteBtn').onclick = () => { if(confirm('ลบรายการนี้ใช่หรือไม่?')) remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => document.getElementById('modal-detail').classList.add('hidden')); };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
