<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; color: #334e68; }
        .month-card { transition: all 0.3s ease; cursor: pointer; border-radius: 1.5rem; background: #ffffff; padding: 1.5rem 1.25rem; border: 1px solid #dbe3eb; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .hidden { display: none !important; }
        .input-box { width: 100%; padding: 0.8rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 1rem; outline: none; font-size: 16px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .modal-container { background: white; width: 100%; max-width: 45rem; border-radius: 2rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .stat-badge { display: flex; justify-content: space-between; padding: 0.5rem 0.75rem; border-radius: 0.75rem; margin-top: 0.5rem; font-size: 0.8rem; font-weight: 600; }
        .img-preview { width: 100%; max-height: 380px; object-fit: contain; background: #0f172a; border-radius: 1.25rem; }
        .scroll-area { overflow-y: auto; flex: 1; padding: 1.5rem; }
        .nav-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; }

        /* CSS สำหรับการพิมพ์รายงานแบบละเอียด */
        @media print {
            body { background: white !important; padding: 0 !important; }
            .nav-sticky, button, .modal-overlay, #page-home, #deleteBtn { display: none !important; }
            #page-list { display: block !important; width: 100% !important; padding: 0 !important; }
            .print-header { display: block !important; margin-bottom: 30px; border-bottom: 3px solid #334e68; padding-bottom: 15px; }
            .case-card { 
                border: 2px solid #edf2f7 !important; 
                margin-bottom: 25px !important; 
                padding: 20px !important;
                break-inside: avoid; 
                page-break-inside: avoid;
                border-radius: 15px !important;
            }
            .print-details { display: block !important; margin-top: 15px; font-size: 14px; line-height: 1.6; }
            .print-grid { display: grid !important; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
            .print-img { width: 100% !important; height: 180px !important; object-fit: cover !important; border-radius: 8px !important; border: 1px solid #ddd !important; }
            .text-blue-600, .text-orange-600, .text-green-600 { color: black !important; font-weight: bold !important; }
        }
        .print-header, .print-details, .print-grid { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-6 flex items-center justify-center gap-4">
                <i data-lucide="shield-check" class="text-blue-600" size="40"></i>
                Safety Patrol & 5S </h1>
            <div class="flex justify-center items-center gap-4 bg-white w-fit mx-auto px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                <i data-lucide="calendar" class="text-slate-400" size="18"></i>
                <span class="font-medium text-slate-600">ปีที่บันทึกข้อมูล:</span>
                <select id="yearSelect" class="bg-transparent font-bold text-blue-600 outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <div class="print-header text-slate-800">
            <h1 class="text-2xl font-bold">รายงานสรุปผลการตรวจสอบ Safety Patrol & 5S</h1>
            <p id="print-month-info" class="text-lg"></p>
            <div id="print-summary-box" class="mt-2 font-bold text-blue-700"></div>
        </div>

        <nav class="nav-sticky flex justify-between items-center">
            <button onclick="goBackHome()" class="flex items-center gap-2 font-bold text-slate-600 hover:text-blue-600">
                <i data-lucide="arrow-left" size="20"></i> กลับ
            </button>
            <h2 id="currentMonthTitle" class="font-bold text-slate-800 text-xl"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                    <i data-lucide="printer" size="20"></i> พิมพ์รายงาน
                </button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                    <i data-lucide="plus" size="20"></i> เพิ่มข้อมูล
                </button>
            </div>
        </nav>
        
        <div id="dataItems" class="max-w-4xl mx-auto p-6 space-y-6"></div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold">เพิ่มข้อมูลเรื่องที่บกพร่อง</h3>
                <button onclick="closeForm()"><i data-lucide="x"></i></button>
            </div>
            <div class="scroll-area">
                <form id="mainForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                        <div><label class="text-xs font-bold">ชื่อผู้ส่ง (Reporter)</label><input type="text" id="reporter" placeholder="ระบุชื่อของคุณ" required class="input-box"></div>
                        <div><label class="text-xs font-bold">แผนก</label><select id="dept" class="input-box"><option value="Welding">Welding</option><option value="Assembly">Assembly</option><option value="Inventory">Inventory</option><option value="Manufacturing">Manufacturing</option><option value="อื่นๆ">อื่นๆ</option></select></div>
                        <div><label class="text-xs font-bold">หมวดหมู่</label><select id="category" class="input-box"><option value="ความปลอดภัย (Safety)">ความปลอดภัย (Safety)</option><option value="5ส (5S)">5ส (5S)</option><option value="อื่นๆ">อื่นๆ</option></select></div>
                        <div><label class="text-xs font-bold">ผู้รับผิดชอบ (PIC)</label><input type="text" id="owner" required class="input-box"></div>
                        <div><label class="text-xs font-bold">กำหนดเสร็จ</label><input type="date" id="dueDate" required class="input-box"></div>
                    </div>
                    <div><label class="text-xs font-bold">ปัญหาที่พบ</label><textarea id="detail" rows="3" required class="input-box"></textarea></div>
                    <div><label class="text-xs font-bold">แนวทางการแก้ไข</label><textarea id="solution" rows="2" class="input-box"></textarea></div>
                    <div><label class="text-xs font-bold">รูปภาพก่อนแก้ไข</label><input type="file" id="imgBefore" accept="image/*" class="text-sm block w-full"></div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">บันทึกข้อมูล</button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-detail" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="p-6 border-b flex justify-between items-center">
                <button id="deleteBtn" class="text-red-500 font-bold text-sm bg-red-50 px-3 py-2 rounded-lg">ลบข้อมูล</button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')"><i data-lucide="x"></i></button>
            </div>
            <div class="scroll-area bg-slate-50" id="detailScrollBody">
                <div id="detailViewContent"></div>
                <div id="updateSection" class="mt-6 bg-white p-6 rounded-2xl border">
                    <h4 class="font-bold text-orange-600 mb-4">อัปเดตการแก้ไข</h4>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="upActualDate" class="input-box">
                        <select id="upStatus" class="input-box"><option value="รอดำเนินการ">รอดำเนินการ</option><option value="เสร็จสิ้น">เสร็จสิ้น</option></select>
                    </div>
                    <input type="file" id="upImgAfter" class="mb-4 text-sm block w-full">
                    <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">ยืนยันการแก้ไข</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2030; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card';
                div.innerHTML = `<div class="font-bold text-slate-800 text-xl mb-4">${m}</div><div id="stats-${monthId}"></div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `<div class="stat-badge bg-blue-50 text-blue-600"><span>พบ</span> <span>${total}</span></div><div class="stat-badge bg-green-50 text-green-600"><span>เสร็จ</span> <span>${done}</span></div>`;
                    } else { statsDiv.innerHTML = `<div class="text-[10px] text-slate-300 py-4 font-bold uppercase">ไม่มีข้อมูล</div>`; }
                });
                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden'); 
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    document.getElementById('print-month-info').innerText = `ประจำเดือน: ${m} ${yearSelect.value}`;
                    listenData(); 
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    const total = Object.keys(data).length;
                    const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                    document.getElementById('print-summary-box').innerText = `สรุปผล: พบทั้งหมด ${total} รายการ | แก้ไขแล้ว ${done} รายการ | คงเหลือ ${total-done} รายการ`;

                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="case-card bg-white p-6 rounded-3xl shadow-sm border-l-8 ${isDone ? 'border-green-500' : 'border-orange-500'} cursor-pointer">
                                <div class="flex justify-between mb-3">
                                    <span class="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded">📍 ${item.dept}</span>
                                    <span class="text-[10px] font-bold ${isDone ? 'text-green-600' : 'text-orange-600'} uppercase">${item.status}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-2">${item.detail}</h3>
                                
                                <div class="print-details">
                                    <p><strong>แนวทางแก้ไข:</strong> ${item.solution || '-'}</p>
                                    <div class="print-grid">
                                        <div><strong>ผู้รับผิดชอบ (PIC):</strong> ${item.owner}</div>
                                        <div><strong>ผู้รายงาน (Reporter):</strong> ${item.reporter}</div>
                                        <div><strong>กำหนดเสร็จ:</strong> ${item.dueDate}</div>
                                        <div><strong>วันที่แก้ไขจริง:</strong> ${item.actualDate || 'ยังไม่ได้ระบุ'}</div>
                                    </div>
                                    <div class="print-grid">
                                        <img src="${item.imgBefore}" class="print-img" title="ก่อนแก้ไข">
                                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="print-img" title="หลังแก้ไข">` : '<div style="border:1px dashed #ccc; height:180px; display:flex; align-items:center; justify-content:center;">รอการแก้ไข...</div>'}
                                    </div>
                                </div>

                                <div class="flex justify-between items-center pt-4 border-t mt-4 print-none">
                                    <div class="text-xs font-bold text-slate-500">โดย: ${item.reporter}</div>
                                    <div class="text-xs font-bold text-red-400">Due: ${item.dueDate}</div>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailViewContent');
            const updateSection = document.getElementById('updateSection');
            if (item.status === 'เสร็จสิ้น') updateSection.classList.add('hidden');
            else updateSection.classList.remove('hidden');

            content.innerHTML = `
                <div class="bg-white p-6 rounded-2xl border">
                    <h2 class="text-xl font-bold mb-4">${item.detail}</h2>
                    <div class="space-y-3 text-sm">
                        <div class="p-3 bg-slate-50 rounded-lg"><p class="font-bold text-slate-400">แนวทางแก้ไข</p><p>${item.solution || '-'}</p></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="p-3 bg-blue-50 rounded-lg"><p class="font-bold text-blue-400">PIC</p><p>${item.owner}</p></div>
                            <div class="p-3 bg-green-50 rounded-lg"><p class="font-bold text-green-400">Reporter</p><p>${item.reporter}</p></div>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <img src="${item.imgBefore}" class="img-preview">
                    ${item.imgAfter ? `<img src="${item.imgAfter}" class="img-preview border-4 border-green-400">` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก...";
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: imgData || "", imgAfter: "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังอัปเดต...";
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            if(document.getElementById('upActualDate').value) updates.actualDate = document.getElementById('upActualDate').value;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { document.getElementById('modal-detail').classList.add('hidden'); btn.innerText = "ยืนยันการแก้ไข"; });
        };

        document.getElementById('deleteBtn').onclick = () => { if (confirm(`ลบข้อมูล?`)) remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => document.getElementById('modal-detail').classList.add('hidden')); };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
