<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol System 2026-2099</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .input-box { width: 100%; padding: 0.7rem 1rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 0.8rem; outline: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-black text-blue-900 italic">SAFETY PATROL 5S</h1>
            <div class="flex justify-center items-center gap-3 mt-6">
                <select id="yearSelect" class="bg-white border-2 border-blue-500 rounded-xl px-4 py-2 font-black text-blue-600"></select>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto" id="monthGrid"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen">
        <nav class="bg-white border-b p-4 sticky top-0 flex justify-between items-center px-6 shadow-sm z-10">
            <button onclick="location.reload()" class="font-bold text-slate-500"> ย้อนกลับ</button>
            <h2 id="currentMonthTitle" class="font-extrabold text-blue-800"></h2>
            <button onclick="openForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg">+ เพิ่มเรื่องที่พบ</button>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-6">บันทึกข้อมูลการตรวจ</h3>
            <form id="mainForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-xs font-bold">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="input-box"></div>
                <div><label class="text-xs font-bold">ชื่อผู้ส่ง</label><input type="text" id="reporter" required class="input-box"></div>
                <div><label class="text-xs font-bold">แผนก</label><input type="text" id="dept" required class="input-box"></div>
                <div><label class="text-xs font-bold">หมวดหมู่</label><select id="category" class="input-box"><option>ความปลอดภัย (Safety)</option><option>5ส (5S)</option></select></div>
                <div class="md:col-span-2"><label class="text-xs font-bold">รายละเอียด</label><textarea id="detail" rows="3" required class="input-box"></textarea></div>
                <div><label class="text-xs font-bold">รูปภาพ (ก่อนแก้ไข)</label><input type="file" id="imgBefore" accept="image/*" class="text-xs"></div>
                <div class="md:col-span-2 pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black">บันทึกข้อมูล</button>
                    <button type="button" onclick="closeForm()" class="w-full mt-2 text-slate-400 font-bold">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/90 hidden z-[60] flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-xl rounded-[3rem] p-10 relative">
            <div id="detailViewContent"></div>
            
            <div id="updateSection" class="mt-8 border-t pt-6 hidden">
                <h4 class="font-black text-orange-600 mb-4 italic">🔧 อัปเดตการแก้ไข</h4>
                <div class="space-y-4">
                    <div><label class="text-xs font-bold">วันที่แก้ไขจริง</label><input type="date" id="upActualDate" class="input-box"></div>
                    <div><label class="text-xs font-bold">รูปภาพหลังแก้ไข</label><input type="file" id="upImgAfter" accept="image/*" class="text-xs"></div>
                    <div><label class="text-xs font-bold">สถานะ</label>
                        <select id="upStatus" class="input-box">
                            <option value="กำลังแก้ไข">กำลังแก้ไข</option>
                            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                        </select>
                    </div>
                    <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold shadow-lg">บันทึกการแก้ไข</button>
                </div>
            </div>
            
            <button onclick="document.getElementById('modal-detail').classList.add('hidden')" class="w-full mt-6 text-slate-400 font-bold">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        let currentPath = "";
        let currentEditingId = "";

        // สร้างปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        // จัดการรูปภาพ
        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        // แสดงหน้าลิสต์ข้อมูล
        window.fetchData = () => {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems');
                container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        container.innerHTML += `
                            <div onclick="openDetail('${id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="bg-white p-5 rounded-2xl shadow-sm border-l-8 border-blue-500 cursor-pointer">
                                <div class="flex justify-between text-[10px] mb-2">
                                    <span class="font-bold text-blue-600">${item.category}</span>
                                    <span class="text-slate-400">${item.postDate}</span>
                                </div>
                                <h4 class="font-bold text-slate-800">${item.detail}</h4>
                                <div class="mt-3 text-[10px] ${item.status === 'เสร็จสิ้น' ? 'text-green-600' : 'text-orange-500'} font-bold">สถานะ: ${item.status || 'รอดำเนินการ'}</div>
                            </div>`;
                    });
                }
            });
        };

        // เปิดดูและเตรียมอัปเดต
        window.openDetail = (id, item) => {
            currentEditingId = id;
            document.getElementById('updateSection').classList.remove('hidden');
            const view = document.getElementById('detailViewContent');
            view.innerHTML = `
                <h2 class="text-xl font-black mb-4">${item.detail}</h2>
                <div class="grid grid-cols-2 gap-2 text-xs mb-4">
                    <div class="bg-slate-50 p-3 rounded-lg"><b>ผู้ตรวจ:</b> ${item.reporter}</div>
                    <div class="bg-slate-50 p-3 rounded-lg"><b>แผนก:</b> ${item.dept}</div>
                </div>
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-400">📸 รูปก่อนแก้ไข:</p>
                    <img src="${item.imgBefore}" class="w-full rounded-xl">
                    ${item.imgAfter ? `<p class="text-xs font-bold text-green-600 mt-4">✅ รูปหลังแก้ไข:</p><img src="${item.imgAfter}" class="w-full rounded-xl border-4 border-green-100">` : ''}
                    ${item.actualDate ? `<p class="text-xs font-bold text-green-700 mt-2">วันที่เสร็จสิ้น: ${item.actualDate}</p>` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
        };

        // บันทึกการอัปเดต (วันที่แก้ไขจริง + รูปหลังแก้ไข)
        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn');
            btn.innerText = "กำลังอัปเดต..."; btn.disabled = true;

            const imgA = await processImg(document.getElementById('upImgAfter').files[0]);
            const actualDate = document.getElementById('upActualDate').value;
            const status = document.getElementById('upStatus').value;

            const updates = {};
            if(imgA) updates[`patrols/${currentPath}/${currentEditingId}/imgAfter`] = imgA;
            if(actualDate) updates[`patrols/${currentPath}/${currentEditingId}/actualDate`] = actualDate;
            updates[`patrols/${currentPath}/${currentEditingId}/status`] = status;

            update(ref(db), updates).then(() => {
                alert("อัปเดตข้อมูลสำเร็จ!");
                document.getElementById('modal-detail').classList.add('hidden');
                btn.innerText = "บันทึกการแก้ไข"; btn.disabled = false;
            });
        };

        // บันทึกเคสใหม่
        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true;
            const imgB = await processImg(document.getElementById('imgBefore').files[0]);
            
            const data = {
                postDate: document.getElementById('postDate').value,
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                category: document.getElementById('category').value,
                detail: document.getElementById('detail').value,
                imgBefore: imgB,
                status: "รอดำเนินการ",
                ts: new Date().getTime()
            };

            push(ref(db, `patrols/${currentPath}`), data).then(() => {
                alert("บันทึกข้อมูลเรียบร้อย!");
                closeForm();
                btn.disabled = false;
            }).catch(err => alert("เกิดข้อผิดพลาด: " + err.message));
        };

        // ตั้งค่าเริ่มต้นหน้าเดือน (เหมือนเดิม)
        const grid = document.getElementById('monthGrid');
        ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"].forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'month-card bg-white p-6 rounded-2xl shadow-sm text-center font-bold cursor-pointer hover:bg-blue-50';
            div.innerText = m;
            div.onclick = () => {
                currentPath = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                document.getElementById('page-home').classList.add('hidden');
                document.getElementById('page-list').classList.remove('hidden');
                document.getElementById('currentMonthTitle').innerText = `รอบเดือน ${m} ${yearSelect.value}`;
                fetchData();
            };
            grid.appendChild(div);
        });

        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
    </script>
</body>
</html>
