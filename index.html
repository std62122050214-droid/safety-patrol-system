<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol & 5S System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; margin: 0; }
        .month-card { transition: all 0.3s ease; cursor: pointer; border-radius: 2rem; border: 2px solid #fff; background: white; padding: 1.5rem; text-align: center; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .month-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2); }
        .hidden { display: none !important; }
        .input-field { width: 100%; padding: 0.75rem 1rem; background-color: #f1f5f9; border-radius: 1rem; border: 1px solid #e2e8f0; outline: none; transition: all 0.2s; }
        .input-field:focus { border-color: #3b82f6; background-color: #fff; ring: 2px; ring-color: #3b82f6; }
    </style>
</head>
<body>

    <div id="step-setup" class="min-h-screen p-8 flex flex-col items-center">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-blue-900 mb-2 italic">SAFETY PATROL 5S</h1>
            <p class="text-slate-500">ระบบบันทึกการตรวจความปลอดภัยและ 5ส รายเดือน</p>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-5xl w-full" id="monthsGrid">
            </div>
    </div>

    <div id="step-dashboard" class="hidden min-h-screen">
        <nav class="bg-white border-b p-4 sticky top-0 flex justify-between items-center px-8 shadow-sm z-10">
            <button onclick="location.reload()" class="text-slate-500 font-bold flex items-center gap-2 hover:text-blue-600 transition-colors">
                <i data-lucide="arrow-left"></i> ย้อนกลับ
            </button>
            <h2 id="displayMonthLabel" class="text-xl font-extrabold text-blue-800"></h2>
            <button onclick="showForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 transition-transform active:scale-95">
                + เพิ่มเรื่องที่พบ
            </button>
        </nav>
        
        <div id="patrolList" class="max-w-3xl mx-auto p-6 space-y-4">
            </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-slate-800">บันทึกข้อมูล</h3>
                <button onclick="hideForm()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            
            <form id="saveForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">ชื่อผู้รายงาน</label>
                    <input type="text" id="reporter" placeholder="ระบุชื่อของคุณ" required class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">แผนกที่ตรวจพบ</label>
                    <input type="text" id="dept" placeholder="เช่น Production, Warehouse" required class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">รายละเอียดสิ่งที่พบ</label>
                    <textarea id="detail" placeholder="อธิบายความไม่ปลอดภัย หรือสิ่งที่ต้องปรับปรุง..." required rows="3" class="input-field"></textarea>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700">บันทึกข้อมูล</button>
                    <button type="button" onclick="hideForm()" class="px-6 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // การตั้งค่า Firebase จากข้อมูลของคุณ
        const firebaseConfig = {
            databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const grid = document.getElementById('monthsGrid');

        // สร้างปุ่มเดือน
        months.forEach((name, i) => {
            const btn = document.createElement('div');
            btn.className = 'month-card';
            btn.innerHTML = `
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="calendar"></i>
                </div>
                <h3 class="font-bold text-slate-800 text-lg">${name}</h3>
                <p class="text-xs text-slate-400 font-medium">ประจำปี 2026</p>
            `;
            btn.onclick = () => openDashboard(name, i + 1);
            grid.appendChild(btn);
        });

        // เปิดหน้า Dashboard ของเดือนนั้นๆ
        window.openDashboard = (name, monthNum) => {
            const path = `2026-${String(monthNum).padStart(2, '0')}`;
            document.getElementById('step-setup').classList.add('hidden');
            document.getElementById('step-dashboard').classList.remove('hidden');
            document.getElementById('displayMonthLabel').innerText = `รอบเดือน ${name} 2026`;
            
            // ดึงข้อมูล Real-time
            onValue(ref(db, `patrols/${path}`), (snap) => {
                const list = document.getElementById('patrolList');
                list.innerHTML = "";
                const data = snap.val();
                
                if (!data) {
                    list.innerHTML = `
                        <div class="text-center py-20">
                            <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                                <i data-lucide="clipboard-list" size="32"></i>
                            </div>
                            <p class="text-slate-400 font-bold">ยังไม่มีข้อมูลการตรวจในเดือนนี้</p>
                        </div>`;
                } else {
                    Object.values(data).reverse().forEach(item => {
                        list.innerHTML += `
                            <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                <div class="flex justify-between items-start mb-3">
                                    <span class="bg-blue-100 text-blue-700 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">${item.dept}</span>
                                    <span class="text-[10px] text-slate-400 font-bold">${item.timestamp || ''}</span>
                                </div>
                                <p class="text-slate-800 font-bold text-lg mb-4">${item.detail}</p>
                                <div class="flex items-center gap-2 text-slate-500 border-t pt-4">
                                    <div class="w-6 h-6 bg-slate-200 rounded-full flex items-center justify-center">
                                        <i data-lucide="user" size="12"></i>
                                    </div>
                                    <span class="text-xs font-bold">ผู้รายงาน: ${item.reporter || 'ไม่ระบุชื่อ'}</span>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });

            // จัดการการส่งฟอร์ม
            document.getElementById('saveForm').onsubmit = (e) => {
                e.preventDefault();
                const newData = {
                    reporter: document.getElementById('reporter').value,
                    dept: document.getElementById('dept').value,
                    detail: document.getElementById('detail').value,
                    timestamp: new Date().toLocaleString('th-TH')
                };
                
                push(ref(db, `patrols/${path}`), newData).then(() => {
                    hideForm();
                    e.target.reset();
                });
            };
        };

        window.showForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.hideForm = () => document.getElementById('modal-form').classList.add('hidden');
        
        lucide.createIcons();
    </script>
</body>
</html>
