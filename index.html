
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷 Safety Patrol & 5S System (2026-2099)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .month-card { background: white; border-radius: 1.5rem; transition: 0.3s; border: 1px solid #f1f5f9; cursor: pointer; }
        .month-card:hover { transform: translateY(-4px); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); }
        .input-field { border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; transition: 0.2s; }
        .input-field:focus { border-color: #3b82f6; ring: 2px; ring-color: #bfdbfe; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 100%; max-width: 50rem; border-radius: 2rem; max-height: 90vh; overflow-y: auto; position: relative; }
        
        /* การตั้งค่าสำหรับการพิมพ์ */
        @media print {
            .no-print, button, nav, .year-selector { display: none !important; }
            body { background: white; padding: 0; }
            .modal-overlay { position: static; background: none; display: block; padding: 0; }
            .modal-box { max-width: 100%; box-shadow: none; overflow: visible; border: none; padding: 0; }
            .print-header { display: block !important; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
            img { max-width: 350px !important; border-radius: 8px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12 no-print">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-3xl font-black text-slate-800 mb-6 tracking-tight">👷 SAFETY PATROL & 5S 👷‍♀️</h1>
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2 rounded-full shadow-sm border border-slate-200 year-selector">
                <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">ปีที่บันทึก:</span>
                <select id="yearSelect" class="font-bold text-blue-600 bg-transparent outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-12">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 no-print shadow-sm">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="flex items-center gap-2 text-slate-500 font-bold hover:text-blue-600 transition-colors">
                    <i data-lucide="arrow-left" size="20"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-black text-slate-800 text-lg uppercase tracking-tight"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="p-2 border rounded-xl text-slate-400 hover:bg-slate-50 transition-colors"><i data-lucide="printer" size="20"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm shadow-lg shadow-blue-200 hover:bg-blue-700">+ เพิ่มข้อมูล</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto mt-10 px-4 space-y-4"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box p-8 md:p-10">
            <div class="hidden print-header text-center">
                <h1 class="text-2xl font-bold">Safety Patrol & 5S Report</h1>
            </div>
            <div class="flex justify-between items-center mb-6 no-print">
                <button id="btnDeletePop" class="text-red-400 hover:bg-red-50 p-2 rounded-full transition-colors"><i data-lucide="trash-2" size="22"></i></button>
                <button onclick="closeModal('modal-view')" class="text-slate-300 hover:text-slate-600"><i data-lucide="x" size="32"></i></button>
            </div>
            <div id="viewDetailContent" class="space-y-6"></div>
            <div class="mt-8 no-print">
                <button id="btnUpdatePop" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-xl shadow-orange-100 hover:bg-orange-600 flex items-center justify-center gap-2">
                    <i data-lucide="edit-3" size="20"></i> แก้ไขภาพ / อัปเดตสถานะ
                </button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden no-print">
        <div class="modal-box p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">📝 บันทึกข้อมูลใหม่</h3>
                <button onclick="closeModal('modal-form')"><i data-lucide="x" size="28"></i></button>
            </div>
            <form id="mainForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase">วันที่ตรวจ</label><input type="date" id="postDate" required class="input-field"></div>
                    <div><label class="text-[10px] font-bold text-slate-400 uppercase">ผู้รายงาน</label><input type="text" id="reporter" placeholder="ชื่อผู้รายงาน" required class="input-field"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">📍 แผนกที่พบ</label>
                        <select id="dept" class="input-field font-bold">
                            <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>Quality Check</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">🏷️ หมวดหมู่ (เลือกได้หลายรายการ)</label>
                        <div class="flex gap-4 p-2 border rounded-xl bg-slate-50">
                            <label class="flex items-center gap-2 cursor-pointer font-bold text-sm text-slate-600"><input type="checkbox" name="cat" value="Safety" class="w-4 h-4 rounded"> Safety</label>
                            <label class="flex items-center gap-2 cursor-pointer font-bold text-sm text-slate-600"><input type="checkbox" name="cat" value="5S" class="w-4 h-4 rounded"> 5S</label>
                            <label class="flex items-center gap-2 cursor-pointer font-bold text-sm text-slate-600"><input type="checkbox" name="cat" value="อื่นๆ" class="w-4 h-4 rounded"> อื่นๆ</label>
                        </div>
                    </div>
                </div>
                <textarea id="detail" placeholder="ระบุรายละเอียดปัญหาที่พบ..." required class="input-field" rows="3"></textarea>
                <div class="bg-blue-50/50 p-5 rounded-2xl border border-blue-100 space-y-4">
                    <input type="text" id="solution" placeholder="แนวทางแก้ไขเบื้องต้น" class="input-field">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="owner" placeholder="ผู้รับผิดชอบ" required class="input-field">
                        <input type="date" id="dueDate" required class="input-field">
                    </div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">รูปภาพ Before</label><input type="file" id="imgBefore" accept="image/*" class="input-field text-sm"></div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">บันทึกข้อมูลเข้าระบบ</button>
            </form>
        </div>
    </div>

    <div id="modal-update" class="modal-overlay hidden no-print">
        <div class="modal-box max-w-md p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-orange-600">แก้ไขภาพ / อัปเดตสถานะ</h3>
                <button onclick="closeModal('modal-update')"><i data-lucide="x" size="28"></i></button>
            </div>
            <div class="space-y-4">
                <div><label class="text-[10px] font-bold text-slate-400 block mb-1">วันที่แก้ไขเสร็จจริง</label><input type="date" id="upActualDate" class="input-field"></div>
                <div><label class="text-[10px] font-bold text-slate-400 block mb-1">สถานะปัจจุบัน</label>
                    <select id="upStatus" class="input-field font-bold">
                        <option value="รอดำเนินการ">รอดำเนินการ</option>
                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                    </select>
                </div>
                <hr class="border-slate-100 my-4">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">ส่วนการแก้ไขรูปภาพ</p>
                <div><label class="text-[10px] font-bold text-blue-500 block mb-1">เปลี่ยนรูป Before (เดิม)</label><input type="file" id="upImgBefore" accept="image/*" class="input-field text-sm"></div>
                <div><label class="text-[10px] font-bold text-emerald-500 block mb-1">เปลี่ยนรูป After (ใหม่)</label><input type="file" id="upImgAfter" accept="image/*" class="input-field text-sm"></div>
                <button id="saveUpdateBtn" class="w-full py-4 bg-orange-500 text-white font-bold rounded-2xl shadow-lg mt-4 hover:bg-orange-600 transition-all">บันทึกการเปลี่ยนแปลง</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Config
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        // จัดการตัวเลือกปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        // หน้าหลัก Dashboard
        window.initHome = () => {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card p-6';
                div.innerHTML = `<div class="flex justify-between items-center"><b>${m}</b><i data-lucide="chevron-right" size="18"></i></div><div id="stats-${mid}" class="mt-4"></div>`;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const stats = document.getElementById(`stats-${mid}`);
                    const data = snap.val();
                    if (data) {
                        const items = Object.values(data);
                        stats.innerHTML = `<p class="text-xs text-blue-500 font-bold">ตรวจพบ: ${items.length}</p><p class="text-xs text-emerald-500 font-bold">แก้ไขแล้ว: ${items.filter(v => v.status === 'เสร็จสิ้น').length}</p>`;
                    } else { stats.innerHTML = `<p class="text-xs text-slate-300 italic">ไม่มีข้อมูล</p>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        };

        // แสดงรายการข้อมูล
        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const cats = Array.isArray(item.category) ? item.category.join(', ') : item.category;
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer hover:bg-blue-50 transition-colors">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${cats} | ${item.dept}</p>
                                    <h3 class="font-bold text-slate-700 text-lg">${item.detail}</h3>
                                    <p class="text-[10px] text-slate-400 font-bold mt-1">👤 รายงานโดย: ${item.reporter}</p>
                                </div>
                                <span class="text-[10px] font-bold px-3 py-1 rounded-full ${item.status === 'เสร็จสิ้น' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-50 text-red-500'} uppercase">${item.status}</span>
                            </div>`;
                    });
                } else {
                    container.innerHTML = `<div class="text-center py-20 text-slate-300 font-bold uppercase">ไม่พบข้อมูลในเดือนนี้</div>`;
                }
                lucide.createIcons();
            });
        }

        // แสดงรายละเอียดเชิงลึก
        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            const cats = Array.isArray(item.category) ? item.category.join(' / ') : item.category;
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-50 p-4 rounded-xl"><b class="text-[10px] text-blue-400 block mb-1 uppercase">ผู้รายงาน</b><span class="font-bold">${item.reporter}</span></div>
                    <div class="bg-emerald-50 p-4 rounded-xl"><b class="text-[10px] text-emerald-400 block mb-1 uppercase">ผู้รับผิดชอบ</b><span class="font-bold">${item.owner}</span></div>
                </div>
                <div class="grid grid-cols-2 gap-4 text-xs font-bold">
                    <div class="p-3 bg-slate-50 rounded-lg">แผนก: ${item.dept}</div>
                    <div class="p-3 bg-slate-50 rounded-lg">หมวดหมู่: ${cats}</div>
                </div>
                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100">
                    <b class="text-[10px] text-slate-400 block mb-2 uppercase">ปัญหาที่พบ</b>
                    <p class="font-bold text-slate-700 text-lg">${item.detail}</p>
                </div>
                <div class="p-5 bg-blue-50/30 rounded-2xl border border-blue-100">
                    <b class="text-[10px] text-blue-400 block mb-2 uppercase">กำหนดเสร็จ: ${item.dueDate} | เสร็จจริง: ${item.actualDate || '-'}</b>
                    <p class="text-sm font-medium text-slate-600">วิธีแก้ไข: ${item.solution || '-'}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4">
                    <div><p class="text-[10px] font-black text-red-400 uppercase mb-3 tracking-widest">📸 Before (ก่อนแก้ไข)</p><img src="${item.imgBefore || ''}" class="rounded-2xl w-full border shadow-md h-48 object-cover"></div>
                    <div><p class="text-[10px] font-black text-emerald-400 uppercase mb-3 tracking-widest">✅ After (หลังแก้ไข)</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-2xl w-full border shadow-md h-48 object-cover">` : '<div class="h-48 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 flex items-center justify-center text-slate-300 font-bold uppercase text-[10px]">รอการแก้ไข</div>'}</div>
                </div>`;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
        };

        // ฟังก์ชันบีบอัดรูปภาพ
        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        // บันทึกข้อมูลใหม่
        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังอัปโหลด..."; btn.disabled = true;
            const cats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(cb => cb.value);
            if(cats.length === 0) { alert('กรุณาเลือกหมวดหมู่อย่างน้อย 1 รายการ'); btn.disabled = false; btn.innerText = "บันทึกข้อมูลเข้าระบบ"; return; }
            
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: cats,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                imgBefore: img, status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูลเข้าระบบ"; btn.disabled = false; });
        };

        // อัปเดตสถานะและรูปภาพ
        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const updates = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            
            const newBefore = await processImg(document.getElementById('upImgBefore').files[0]);
            const newAfter = await processImg(document.getElementById('upImgAfter').files[0]);
            
            if(newBefore) updates.imgBefore = newBefore;
            if(newAfter) updates.imgAfter = newAfter;

            update(ref(db, `patrols/${currentPath}/${currentId}`), updates).then(() => { 
                closeModal('modal-update'); btn.innerText = "บันทึกการเปลี่ยนแปลง"; btn.disabled = false; 
                document.getElementById('upImgBefore').value = ""; document.getElementById('upImgAfter').value = "";
            });
        };

        // ฟังก์ชันควบคุม UI
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        document.getElementById('btnUpdatePop').onclick = () => { closeModal('modal-view'); document.getElementById('modal-update').classList.remove('hidden'); };
        document.getElementById('btnDeletePop').onclick = () => { if(confirm('⚠️ คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) { remove(ref(db, `patrols/${currentPath}/${currentId}`)); closeModal('modal-view'); } };
        
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
