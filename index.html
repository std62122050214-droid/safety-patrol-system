<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👷Safety Patrol & 5S👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; }
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 12px; backdrop-filter: blur(8px); }
        .modal-box { background: white; width: 100%; max-width: 48rem; border-radius: 1.5rem; max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; }
        .input-field { border: 2px solid #e2e8f0; border-radius: 0.75rem; padding: 0.65rem 0.85rem; width: 100%; font-size: 16px; }
        .case-card { background: white; border-radius: 1.25rem; border-left-width: 12px; border: 1px solid #e2e8f0; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s; }
        .case-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .Safety-border { border-left-color: #ef4444; }
        .S5-border { border-left-color: #3b82f6; }
        .Other-border { border-left-color: #a855f7; }
        
        /* การตั้งค่าสำหรับการปริ้นเอกสาร */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            #page-list { display: block !important; }
            .case-card { 
                break-inside: avoid; 
                border: 1px solid #e2e8f0 !important; 
                border-left: 12px solid #ccc !important;
                margin-bottom: 30px; 
                page-break-inside: avoid; 
            }
            .print-full-content { display: block !important; }
            .print-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 15px !important; }
            img { max-width: 100% !important; height: auto !important; border-radius: 8px; margin-top: 5px; }
        }
        .print-full-content { display: none; } 
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-4 md:p-12">
        <div class="max-w-6xl mx-auto text-center mb-10">
            <h1 class="text-2xl md:text-4xl font-extrabold text-slate-800 uppercase">👷Safety Patrol & 5S👷‍♀️</h1>
            <div class="flex justify-center mt-4">
                <select id="yearSelect" onchange="initHome()" class="font-bold text-blue-600 bg-white border p-2 rounded-xl shadow-sm"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-24">
        <nav class="sticky top-0 z-50 bg-white border-b p-4 no-print shadow-sm flex justify-between items-center">
            <button onclick="goBackHome()" class="font-bold text-slate-500 flex items-center gap-1"><i data-lucide="arrow-left" size="18"></i> กลับ</button>
            <h2 id="currentMonthTitle" class="font-bold text-slate-800"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-100 p-2 rounded-lg text-slate-600"><i data-lucide="printer" size="20"></i></button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md">+ เพิ่มข้อมูล</button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto px-4 mt-6"></div>
    </div>

    <div id="modal-view" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <button id="btnDeletePop" class="text-red-500 font-bold text-xs bg-red-50 px-3 py-1 rounded-full">ลบรายการนี้</button>
                <button onclick="closeModal('modal-view')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" size="24"></i></button>
            </div>
            <div id="viewDetailContent" class="overflow-y-auto p-6"></div>
            <div class="p-4 border-t bg-white flex gap-2 no-print">
                <button id="btnUpdatePop" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold shadow-lg transition-all">อัปเดตสถานะ/รูปแก้ไข</button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-box">
            <form id="mainForm" class="overflow-y-auto p-6 space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-lg">บันทึกข้อมูลการตรวจ</h3>
                    <button type="button" onclick="closeModal('modal-form')" class="text-slate-400"><i data-lucide="x" size="20"></i></button>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400">วันที่ตรวจพบ</label>
                        <input type="date" id="postDate" required class="input-field mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400">ผู้รายงาน</label>
                        <input type="text" id="reporter" required class="input-field mt-1" placeholder="ชื่อ-นามสกุล">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400">แผนกที่พบ</label>
                    <select id="dept" class="input-field mt-1">
                        <option>Welding</option><option>Assembly</option><option>Inventory</option><option>Office</option>
                    </select>
                </div>

                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="text-xs font-bold text-slate-400 block mb-2">หมวดหมู่</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="category" value="Safety" class="w-4 h-4"> Safety</label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="category" value="S5" class="w-4 h-4"> 5S</label>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400">รายละเอียดปัญหา</label>
                    <textarea id="detail" required class="input-field mt-1 h-24" placeholder="ระบุปัญหาที่พบ..."></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400">รูปถ่าย Before (เลือกได้หลายรูป)</label>
                    <input type="file" id="imgBefore" accept="image/*" multiple class="input-field mt-1 text-xs">
                </div>

                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 space-y-4">
                    <h4 class="text-emerald-700 font-bold text-sm">ส่วนงานแก้ไข</h4>
                    <textarea id="solution" class="input-field bg-white" placeholder="แนวทางแก้ไข / มาตรการป้องกัน"></textarea>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-emerald-600">ผู้รับผิดชอบ (PIC)</label>
                            <input type="text" id="owner" required class="input-field bg-white mt-1" placeholder="ชื่อผู้แก้ไข">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-emerald-600">กำหนดเสร็จ</label>
                            <input type="date" id="dueDate" required class="input-field bg-white mt-1">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">บันทึกข้อมูลลงระบบ</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Configuration (ตรวจสอบ URL ให้ถูกต้อง)
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);
        let currentPath = "", currentId = "";

        // ฟังก์ชันบีบอัดและจัดการรูปภาพหลายรูป
        const processImgs = async (files) => {
            const promises = Array.from(files).map(file => {
                return new Promise((res) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image(); img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            const scale = Math.min(MAX_WIDTH / img.width, 1);
                            canvas.width = img.width * scale; canvas.height = img.height * scale;
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            res(canvas.toDataURL('image/jpeg', 0.6));
                        };
                    };
                    reader.readAsDataURL(file);
                });
            });
            return Promise.all(promises);
        };

        // ฟังก์ชันดึงข้อมูลมาแสดง (รองรับ Print และแสดงสถานะ)
        window.listenData = () => {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (!data) { container.innerHTML = "<p class='text-center text-slate-400 mt-10'>ไม่พบข้อมูลของเดือนนี้</p>"; return; }

                Object.entries(data).reverse().forEach(([id, item]) => {
                    const isDone = item.status === 'เสร็จสิ้น';
                    const cats = Array.isArray(item.category) ? item.category : [item.category];
                    const borderClass = cats[0] + "-border";
                    const beforeImgs = (Array.isArray(item.imgBefore) ? item.imgBefore : [item.imgBefore]);
                    
                    container.innerHTML += `
                        <div class="case-card ${borderClass} p-5 shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">${cats.join(' & ')} | ${item.dept}</span>
                                <span class="text-[10px] font-bold px-3 py-1 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">
                                    ${item.status}
                                </span>
                            </div>
                            
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})'>
                                <h3 class="font-bold text-slate-800 text-base mb-3">${item.detail}</h3>
                                <div class="flex justify-between items-center text-[11px] text-slate-400 border-t pt-3 no-print">
                                    <div><span class="font-bold">ผู้รายงาน:</span> ${item.reporter} | <span class="font-bold">PIC:</span> ${item.owner}</div>
                                    <div class="text-blue-600 font-bold flex items-center gap-1">ดูรายละเอียด <i data-lucide="chevron-right" size="14"></i></div>
                                </div>
                            </div>

                            <div class="print-full-content mt-4 border-t pt-4 space-y-4">
                                <div class="grid grid-cols-2 gap-4 text-xs">
                                    <p><b>ผู้รายงาน:</b> ${item.reporter} (${item.postDate})</p>
                                    <p><b>ผู้รับผิดชอบ:</b> ${item.owner}</p>
                                    <p><b>หมวดหมู่:</b> ${cats.join(', ')}</p>
                                    <p><b>กำหนดเสร็จ:</b> ${item.dueDate}</p>
                                </div>
                                <div class="text-xs bg-slate-50 p-2 rounded"><b>แนวทางแก้ไข:</b> ${item.solution || '-'}</div>
                                <div>
                                    <p class="text-[10px] font-bold mb-2 uppercase">📸 รูปถ่าย BEFORE:</p>
                                    <div class="print-grid">
                                        ${beforeImgs.map(src => `<img src="${src}">`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
                lucide.createIcons();
            });
        };

        // ฟังก์ชันดูรายละเอียดทั้งหมด
        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            const cats = Array.isArray(item.category) ? item.category : [item.category];
            const beforeImgs = (Array.isArray(item.imgBefore) ? item.imgBefore : [item.imgBefore]);

            content.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">${cats.join(' & ')} | ${item.dept}</p>
                            <h2 class="text-xl font-bold text-slate-800">${item.detail}</h2>
                        </div>
                        <span class="px-4 py-1 rounded-full text-xs font-bold ${item.status === 'เสร็จสิ้น' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">
                            ${item.status}
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-blue-50 p-3 rounded-xl">
                            <p class="text-blue-400 text-[10px] font-bold uppercase">Reported By</p>
                            <p class="font-bold text-slate-700">${item.reporter}</p>
                            <p class="text-xs text-slate-500">${item.postDate}</p>
                        </div>
                        <div class="bg-orange-50 p-3 rounded-xl">
                            <p class="text-orange-400 text-[10px] font-bold uppercase">PIC / Due Date</p>
                            <p class="font-bold text-slate-700">${item.owner}</p>
                            <p class="text-xs text-slate-500">${item.dueDate}</p>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-bold text-emerald-500 uppercase mb-2">🛠 แนวทางแก้ไข:</p>
                        <div class="p-4 bg-emerald-50 rounded-xl text-emerald-800 border border-emerald-100 italic">
                            ${item.solution || "ยังไม่มีข้อมูลการแก้ไข"}
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">📸 รูปถ่าย BEFORE (${beforeImgs.length} รูป):</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            ${beforeImgs.map(src => `<img src="${src}" class="w-full rounded-xl border shadow-sm">`).join('')}
                        </div>
                    </div>
                </div>`;

            document.getElementById('modal-view').classList.remove('hidden');
            
            document.getElementById('btnDeletePop').onclick = () => {
                if(confirm('คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้?')) {
                    remove(ref(db, `patrols/${currentPath}/${id}`)).then(() => closeModal('modal-view'));
                }
            };
        };

        // การจัดการหน้าจอและฟอร์ม
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => { document.getElementById('postDate').valueAsDate = new Date(); document.getElementById('modal-form').classList.remove('hidden'); };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังอัปโหลดรูปภาพและบันทึก..."; btn.disabled = true;
            
            const cats = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(c => c.value);
            const imgFiles = document.getElementById('imgBefore').files;
            const imgs = imgFiles.length > 0 ? await processImgs(imgFiles) : ["https://placehold.co/600x400?text=No+Image"];

            const payload = {
                postDate: document.getElementById('postDate').value,
                reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value,
                category: cats.length > 0 ? cats : ["Other"],
                detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value,
                owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value,
                imgBefore: imgs,
                status: "รอดำเนินการ",
                ts: new Date().getTime()
            };

            push(ref(db, `patrols/${currentPath}`), payload).then(() => {
                closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูลลงระบบ"; btn.disabled = false;
            });
        };

        // เริ่มต้นสร้างหน้า Dashboard
        const yearSelect = document.getElementById('yearSelect');
        const now = new Date();
        for (let y = 2026; y <= 2030; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = `ปี พ.ศ. ${y + 543} (${y})`;
            if(y === now.getFullYear()) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        window.initHome = () => {
            const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const card = document.createElement('div');
                card.className = "bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl cursor-pointer transition-all text-center";
                card.innerHTML = `<h3 class="font-extrabold text-slate-700 text-lg">${m}</h3><p class="text-xs text-blue-500 mt-2 font-bold uppercase">ดูรายการตรวจ ></p>`;
                card.onclick = () => {
                    currentPath = mid;
                    document.getElementById('page-home').classList.add('hidden');
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `รายการเดือน ${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(card);
            });
        };
        initHome();
    </script>
</body>
</html>
