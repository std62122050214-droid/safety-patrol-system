<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷 SAFETY PATROL & 5S 👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .month-card { background: white; border-radius: 1.5rem; transition: 0.3s; border: 1px solid #f1f5f9; cursor: pointer; }
        .input-field { border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; }
        
        /* สถานะสี Badge */
        .status-badge { font-size: 10px; font-weight: bold; padding: 4px 12px; border-radius: 9999px; text-transform: uppercase; }
        .status-pending { background-color: #fee2e2; color: #ef4444; }
        .status-complete { background-color: #d1fae5; color: #10b981; }

        /* จัดการหน้าพิมพ์ (Print) */
        @media print {
            .no-print, button, nav, .year-selector { display: none !important; }
            body { background: white; padding: 0; }
            .modal-overlay { position: static; background: none; display: block; padding: 0; }
            .modal-box { max-width: 100%; box-shadow: none; overflow: visible; border: none; padding: 0; }
            .print-layout { display: block !important; width: 100%; }
            .print-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 20px; }
            img { max-width: 100% !important; border-radius: 8px; margin-top: 10px; }
            .print-card { border-bottom: 1px solid #eee; padding: 15px 0; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12 no-print">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-3xl font-black text-slate-800 mb-6 tracking-tight">👷 SAFETY PATROL & 5S 👷‍♀️</h1>
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2 rounded-full shadow-sm border border-slate-200">
                <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">ปีที่บันทึก:</span>
                <select id="yearSelect" class="font-bold text-blue-600 bg-transparent outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-12">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 no-print shadow-sm flex justify-between items-center">
            <button onclick="goBackHome()" class="flex items-center gap-2 text-slate-500 font-bold hover:text-blue-600">
                <i data-lucide="arrow-left" size="20"></i> กลับ
            </button>
            <h2 id="currentMonthTitle" class="font-black text-slate-800 text-lg uppercase tracking-tight"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="p-2 border rounded-xl text-slate-400 hover:bg-slate-50"><i data-lucide="printer" size="20"></i></button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm shadow-lg">+ เพิ่มข้อมูล</button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto mt-10 px-4 space-y-4"></div>
    </div>

    <div id="modal-view" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-3xl p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 no-print">
                <h3 class="text-xl font-bold">รายละเอียดข้อมูล</h3>
                <button onclick="closeModal('modal-view')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" size="28"></i></button>
            </div>
            
            <div id="viewDetailContent" class="space-y-8">
                </div>
            
            <div class="mt-8 flex gap-4 no-print">
                <button id="btnUpdatePop" class="flex-1 bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-2">
                    <i data-lucide="edit-3" size="20"></i> อัปเดตงาน
                </button>
                <button id="btnDeletePop" class="bg-red-50 text-red-500 px-6 rounded-2xl border border-red-100"><i data-lucide="trash-2" size="20"></i></button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold flex items-center gap-2"><i data-lucide="plus-circle" class="text-blue-600"></i> บันทึกข้อมูลใหม่</h3>
                <button onclick="closeModal('modal-form')"><i data-lucide="x" size="28"></i></button>
            </div>
            <form id="mainForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">ผู้รายงาน (PIC)</label>
                        <input type="text" id="reporter" placeholder="ระบุชื่อผู้รายงาน" required class="input-field w-full">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">แผนก</label>
                        <select id="dept" class="input-field w-full font-bold">
                            <option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option><option>Quality Check</option><option>อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1"><i data-lucide="alert-triangle" size="12"></i> ปัญหาที่พบ (Problem)</label>
                    <textarea id="detail" placeholder="ระบุปัญหา..." required class="input-field w-full" rows="3"></textarea>
                </div>
                <div class="bg-blue-50/50 p-4 rounded-2xl space-y-4 border border-blue-100">
                    <div>
                        <label class="text-[10px] font-bold text-blue-500 uppercase flex items-center gap-1"><i data-lucide="lightbulb" size="12"></i> วิธีแก้ไข (Solution)</label>
                        <input type="text" id="solution" placeholder="ระบุวิธีแก้ไข..." class="input-field w-full">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">ผู้รับผิดชอบ</label>
                            <input type="text" id="owner" required class="input-field w-full">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">กำหนดเสร็จ</label>
                            <input type="date" id="dueDate" required class="input-field w-full">
                        </div>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">รูปภาพ Before</label>
                    <input type="file" id="imgBefore" accept="image/*" class="text-sm">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        // จัดการปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        window.initHome = () => {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card p-6';
                div.innerHTML = `<div class="flex justify-between items-center"><b>${m}</b><i data-lucide="chevron-right" size="18"></i></div>
                                 <div id="stats-${mid}" class="mt-4 space-y-1"></div>`;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const stats = document.getElementById(`stats-${mid}`);
                    const data = snap.val();
                    if (data) {
                        const items = Object.values(data);
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        stats.innerHTML = `<div class="bg-blue-50 text-blue-600 text-[10px] font-bold p-1 px-2 rounded-full inline-block">ตรวจพบ: ${items.length}</div>
                                           <div class="bg-emerald-50 text-emerald-600 text-[10px] font-bold p-1 px-2 rounded-full inline-block">เสร็จแล้ว: ${done}</div>`;
                    } else { stats.innerHTML = `<p class="text-xs text-slate-300 italic">NO DATA</p>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        };

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const sClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
                        container.innerHTML += `
                            <div onclick='viewDetail("${id}", ${JSON.stringify(item)})' class="bg-white p-5 rounded-2xl border border-slate-100 flex justify-between items-center cursor-pointer hover:bg-blue-50">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase">${item.dept}</p>
                                    <h3 class="font-bold text-slate-700">${item.detail}</h3>
                                    <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">👤 PIC: ${item.reporter}</p>
                                </div>
                                <span class="status-badge ${sClass}">${item.status}</span>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.viewDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('viewDetailContent');
            const sClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl"><b class="text-[10px] text-slate-400 block mb-1">DUE DATE / กำหนดเสร็จ</b><span class="text-orange-600 font-bold">${item.dueDate}</span></div>
                    <div class="bg-slate-50 p-4 rounded-2xl"><b class="text-[10px] text-slate-400 block mb-1">ACTUAL DATE / เสร็จจริง</b><span class="text-emerald-600 font-bold">${item.actualDate || '-'}</span></div>
                </div>
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                    <b class="text-[10px] text-slate-400 block mb-2 flex items-center gap-1"><i data-lucide="alert-triangle" size="12"></i> PROBLEM / ปัญหาที่พบ</b>
                    <p class="font-bold text-slate-800 text-lg">${item.detail}</p>
                    <p class="text-xs text-slate-500 mt-2">รายงานโดย: <b>${item.reporter}</b> | แผนก: <b>${item.dept}</b></p>
                </div>
                <div class="p-6 bg-emerald-50/50 rounded-2xl border border-emerald-100">
                    <b class="text-[10px] text-emerald-500 block mb-2 flex items-center gap-1"><i data-lucide="lightbulb" size="12"></i> SOLUTION / วิธีแก้ไข</b>
                    <p class="font-bold text-slate-700">${item.solution || 'รอดำเนินการ'}</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">📸 BEFORE</p>
                        <img src="${item.imgBefore || ''}" class="rounded-xl w-full h-48 object-cover border">
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">✅ AFTER</p>
                        ${item.imgAfter ? `<img src="${item.imgAfter}" class="rounded-xl w-full h-48 object-cover border">` : `<div class="h-48 bg-slate-100 rounded-xl flex items-center justify-center text-slate-300 font-bold text-xs uppercase">รอดำเนินการ</div>`}
                    </div>
                </div>`;
            document.getElementById('modal-view').classList.remove('hidden');
            lucide.createIcons();
        };

        // ส่วนฟังก์ชันอื่นๆ (บันทึก, อัปเดต, บีบอัดรูปภาพ) ให้ใช้ตามระบบเดิมที่คุณมี...
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
