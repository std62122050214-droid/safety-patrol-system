<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        
        /* สไตล์หน้าจอปกติ */
        .input-group { margin-bottom: 1rem; }
        .label-blue { color: #2563eb; font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 4px; }
        .label-red { color: #dc2626; font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 4px; }
        .label-green { color: #16a34a; font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 4px; }
        .field-input { border: 2px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; }

        /* ✨ แก้ไขจุดสำคัญสำหรับการพิมพ์ (Print Settings) */
        @media print {
            /* 1. ซ่อนส่วนที่ไม่เกี่ยวข้อง */
            .no-print, button, #page-home, .nav-sticky, .modal-overlay { display: none !important; }
            
            /* 2. บังคับแสดงหน้า List และขยายความกว้าง */
            #page-list { display: block !important; padding: 0 !important; width: 100% !important; }
            
            /* 3. หัวรายงาน */
            .print-header { display: block !important; border-bottom: 3px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
            
            /* 4. การ์ดข้อมูลแต่ละใบ */
            .case-card { 
                display: block !important; 
                border: 1px solid #000 !important; 
                padding: 20px !important; 
                margin-bottom: 30px !important; 
                break-inside: avoid; /* ป้องกันข้อมูลขาดตอนขึ้นหน้าใหม่ */
                border-radius: 10px !important;
            }

            /* 5. บังคับแสดงรายละเอียดที่ปกติถูกซ่อน */
            .print-content { display: block !important; margin-top: 15px; }
            .print-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 15px; margin-top: 10px; }
            
            /* 6. รูปภาพในหน้าพิมพ์ */
            .print-img { width: 100% !important; height: auto !important; max-height: 250px; object-fit: cover; border: 1px solid #ccc; border-radius: 5px; }
            
            .text-print-bold { font-weight: bold !important; color: #000 !important; }
        }
        
        /* ซ่อนส่วน Print ในหน้าจอปกติ */
        .print-header, .print-content { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-6">👷 Safety Patrol & 5S</h1>
            <div class="bg-white p-4 inline-block rounded-xl border">
                <span class="mr-2 font-bold">เลือกปี:</span>
                <select id="yearSelect" class="font-bold text-blue-600 outline-none"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-w-5xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-10">
        <div class="print-header">
            <h1 class="text-2xl font-bold">รายงานสรุปผล Safety Patrol & 5S</h1>
            <p id="print-title" class="text-lg"></p>
            <p id="print-stats" class="font-bold text-blue-700"></p>
        </div>

        <nav class="sticky top-0 z-50 bg-white border-b p-4 mb-6 no-print flex justify-between items-center">
            <button onclick="goBackHome()" class="font-bold text-slate-500">⬅ กลับ</button>
            <h2 id="currentMonthTitle" class="font-bold"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">พิมพ์รายงาน</button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">+ เพิ่ม</button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto px-4 space-y-6"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-xl rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between mb-4 border-b pb-2">
                <h3 class="font-bold text-lg">📝 บันทึกข้อมูล</h3>
                <button onclick="closeForm()" class="text-red-500 font-bold">ปิด</button>
            </div>
            <form id="mainForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="label-blue">วันที่ตรวจพบ</label><input type="date" id="postDate" required class="field-input"></div>
                    <div><label class="label-blue">ชื่อผู้รายงาน</label><input type="text" id="reporter" required class="field-input"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="label-blue">แผนก/พื้นที่</label><select id="dept" class="field-input"><option>Welding</option><option>Assembly</option><option>Manufacturing</option><option>Inventory</option></select></div>
                    <div><label class="label-blue">กำหนดเสร็จ</label><input type="date" id="dueDate" required class="field-input"></div>
                </div>
                <div><label class="label-red">รายละเอียดปัญหา</label><textarea id="detail" rows="3" required class="field-input border-red-200"></textarea></div>
                <div><label class="label-green">แนวทางแก้ไข</label><textarea id="solution" rows="2" class="field-input border-green-200"></textarea></div>
                <div><label class="label-green">ผู้รับผิดชอบ (PIC)</label><input type="text" id="owner" required class="field-input border-green-200"></div>
                <div><label class="font-bold text-sm">รูปภาพประกอบ</label><input type="file" id="imgBefore" accept="image/*"></div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mt-4">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";

        // สร้างปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-2xl shadow-sm border cursor-pointer hover:border-blue-500 transition-all';
                div.innerHTML = `<div class="font-bold text-lg mb-2">${m}</div><div id="stats-${monthId}"></div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const stats = snap.val();
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    if (stats) {
                        const total = Object.keys(stats).length;
                        const done = Object.values(stats).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `<p class="text-sm text-blue-600 font-bold">ทั้งหมด: ${total}</p><p class="text-sm text-green-600 font-bold">เสร็จ: ${done}</p><p class="text-sm text-orange-600 font-bold">คงเหลือ: ${total-done}</p>`;
                    } else { statsDiv.innerHTML = `<span class="text-xs text-slate-300 italic">ไม่มีข้อมูล</span>`; }
                });
                div.onclick = () => {
                    currentPath = monthId;
                    document.getElementById('page-home').classList.add('hidden');
                    document.getElementById('page-list').classList.remove('hidden');
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    document.getElementById('print-title').innerText = `ประจำเดือน: ${m} ${yearSelect.value}`;
                    listenData();
                };
                grid.appendChild(div);
            });
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                    document.getElementById('print-stats').innerText = `สรุป: ทั้งหมด ${Object.keys(data).length} | เสร็จแล้ว ${done}`;
                    
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div class="case-card bg-white p-6 rounded-2xl shadow-sm border-l-8 ${isDone ? 'border-green-500' : 'border-red-500'}">
                                <div class="flex justify-between text-xs font-bold mb-2">
                                    <span class="bg-slate-100 px-2 py-1 rounded text-slate-500">${item.dept}</span>
                                    <span class="${isDone ? 'text-green-600' : 'text-red-600'} uppercase">${item.status}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-2">${item.detail}</h3>
                                
                                <div class="print-content">
                                    <p class="text-print-bold">แนวทางแก้ไข: <span class="font-normal">${item.solution || '-'}</span></p>
                                    <div class="print-grid">
                                        <p class="text-print-bold">PIC: <span class="font-normal">${item.owner}</span></p>
                                        <p class="text-print-bold">ผู้รายงาน: <span class="font-normal">${item.reporter}</span></p>
                                        <p class="text-print-bold">กำหนดเสร็จ: <span class="font-normal">${item.dueDate}</span></p>
                                        <p class="text-print-bold">แก้ไขจริง: <span class="font-normal">${item.actualDate || '-'}</span></p>
                                    </div>
                                    <div class="print-grid">
                                        <div><p class="text-print-bold mb-1">📸 รูปก่อนแก้ไข</p><img src="${item.imgBefore}" class="print-img"></div>
                                        <div><p class="text-print-bold mb-1">✅ รูปหลังแก้ไข</p>${item.imgAfter ? `<img src="${item.imgAfter}" class="print-img">` : '<div class="print-img flex items-center justify-center text-slate-300 border-dashed border-2">ยังไม่มีการแก้ไข</div>'}</div>
                                    </div>
                                </div>

                                <div class="flex justify-between pt-4 border-t mt-4 no-print text-[11px] font-bold text-slate-400">
                                    <span>👤 ${item.reporter}</span>
                                    <button onclick='alert("กรุณากดพิมพ์รายงานเพื่อดูรายละเอียดทั้งหมด")' class="text-blue-500">ดูเพิ่มเติม</button>
                                </div>
                            </div>`;
                    });
                }
            });
        }

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, owner: document.getElementById('owner').value,
                dueDate: document.getElementById('dueDate').value, detail: document.getElementById('detail').value,
                solution: document.getElementById('solution').value, imgBefore: imgData || "",
                status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
