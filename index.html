<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👷 SAFETY PATROL & 5S 👷‍♀️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .input-field { border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; width: 100%; outline: none; }
        .status-badge { font-size: 10px; font-weight: bold; padding: 4px 14px; border-radius: 9999px; text-transform: uppercase; white-space: nowrap; }
        .status-pending { background-color: #fee2e2; color: #ef4444; }
        .status-complete { background-color: #d1fae5; color: #10b981; }

        @media print {
            .no-print, button, nav { display: none !important; }
            body { background: white; padding: 0; }
            #dataItems { display: block !important; width: 100%; }
            .report-card { border: 1px solid #eee; margin-bottom: 20px; page-break-inside: avoid; border-radius: 12px; padding: 15px; }
            .print-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; margin-top: 10px; }
            img { max-width: 100% !important; border-radius: 8px; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6 md:p-12 no-print">
        <div class="max-w-6xl mx-auto text-center mb-12">
            <h1 class="text-3xl font-black text-slate-800 mb-6 uppercase">👷 SAFETY PATROL & 5S 👷‍♀️</h1>
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2 rounded-full shadow-sm border border-slate-200">
                <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">ปีที่บันทึก:</span>
                <select id="yearSelect" class="font-bold text-blue-600 bg-transparent outline-none cursor-pointer text-lg"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-12">
        <nav class="sticky top-0 z-50 bg-white border-b p-4 no-print shadow-sm flex justify-between items-center">
            <button onclick="goBackHome()" class="flex items-center gap-2 text-slate-500 font-bold hover:text-blue-600">
                <i data-lucide="arrow-left" size="20"></i> กลับ
            </button>
            <h2 id="currentMonthTitle" class="font-black text-slate-800 text-lg uppercase"></h2>
            <div class="flex gap-2">
                <button onclick="window.print()" class="p-2 border rounded-xl text-slate-400 hover:bg-slate-50"><i data-lucide="printer" size="20"></i></button>
                <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm">+ เพิ่มข้อมูล</button>
            </div>
        </nav>
        <div id="dataItems" class="max-w-4xl mx-auto mt-10 px-4 space-y-4"></div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8 my-auto">
            <div class="flex justify-between items-center mb-6 no-print">
                <h3 class="text-xl font-bold">อัปเดตงาน / รายละเอียด</h3>
                <button onclick="closeModal('modal-detail')"><i data-lucide="x" size="28"></i></button>
            </div>
            
            <div id="detailContent" class="space-y-4">
                </div>

            <hr class="my-6 no-print">
            
            <div id="updateForm" class="space-y-4 no-print">
                <p class="font-bold text-orange-600 flex items-center gap-2"><i data-lucide="edit-3" size="18"></i> อัปเดตผลการแก้ไข</p>
                <select id="upStatus" class="input-field font-bold">
                    <option value="รอดำเนินการ">รอดำเนินการ</option>
                    <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                </select>
                <textarea id="upSolution" placeholder="แนวทางแก้ไข / ผลการดำเนินการ" class="input-field" rows="2"></textarea>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">รูปภาพ After (หลังแก้ไข)</label>
                    <input type="file" id="upImgAfter" accept="image/*" class="input-field text-sm">
                </div>
                <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg">บันทึกการอัปเดต</button>
                <button id="delBtn" class="w-full text-red-400 font-bold text-sm py-2">ลบข้อมูลนี้</button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">📝 บันทึกข้อมูลใหม่</h3>
                <button onclick="closeModal('modal-form')"><i data-lucide="x" size="28"></i></button>
            </div>
            <form id="mainForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="reporter" placeholder="ชื่อผู้รายงาน (PIC)" required class="input-field">
                    <select id="dept" class="input-field font-bold">
                        <option>Welding</option>
                        <option>Assembly</option>
                        <option>Manufacturing</option>
                        <option>Inventory</option>
                        <option>Quality Check</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <textarea id="detail" placeholder="ปัญหาที่พบ (Problem)" required class="input-field" rows="3"></textarea>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 block mb-1">รูปภาพ Before</label>
                    <input type="file" id="imgBefore" accept="image/*" class="input-field text-sm">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Config (กรุณาใช้ของคุณ)
        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "", currentId = "";

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        window.initHome = () => {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const mid = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-3xl border border-slate-100 shadow-sm cursor-pointer hover:shadow-md transition-all';
                div.innerHTML = `<div class="flex justify-between items-center"><b class="text-slate-700">${m}</b><i data-lucide="chevron-right" size="18" class="text-slate-300"></i></div><div id="stats-${mid}" class="mt-4 space-y-1"></div>`;
                onValue(ref(db, `patrols/${mid}`), (snap) => {
                    const stats = document.getElementById(`stats-${mid}`);
                    const data = snap.val();
                    if (data) {
                        const items = Object.values(data);
                        const done = items.filter(v => v.status === 'เสร็จสิ้น').length;
                        stats.innerHTML = `<p class="text-[10px] text-blue-500 font-bold uppercase">ตรวจพบ: ${items.length}</p><p class="text-[10px] text-emerald-500 font-bold uppercase">เสร็จแล้ว: ${done}</p>`;
                    } else { stats.innerHTML = `<p class="text-xs text-slate-300 italic">NO DATA</p>`; }
                    lucide.createIcons();
                });
                div.onclick = () => { currentPath = mid; document.getElementById('page-home').classList.add('hidden'); document.getElementById('page-list').classList.remove('hidden'); document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`; listenData(); };
                grid.appendChild(div);
            });
            lucide.createIcons();
        };

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const sClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="report-card bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-all">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${item.dept}</p>
                                    <h3 class="font-bold text-slate-700 text-lg">${item.detail}</h3>
                                    <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">👤 PIC: ${item.reporter}</p>
                                    <div class="print-grid hidden">
                                        <div><p class="text-[8px] font-bold">BEFORE</p><img src="${item.imgBefore || ''}"></div>
                                        <div><p class="text-[8px] font-bold">AFTER</p><img src="${item.imgAfter || ''}"></div>
                                    </div>
                                </div>
                                <span class="status-badge ${sClass}">${item.status}</span>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentId = id;
            const content = document.getElementById('detailContent');
            const sClass = item.status === 'เสร็จสิ้น' ? 'status-complete' : 'status-pending';
            content.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div><b class="text-[10px] text-slate-400 uppercase tracking-widest">แผนก: ${item.dept}</b><h4 class="text-xl font-bold text-slate-800">${item.detail}</h4><p class="text-xs text-slate-500 mt-1 uppercase">👤 ผู้รายงาน: ${item.reporter}</p></div>
                    <span class="status-badge ${sClass}">${item.status}</span>
                </div>
                <div class="bg-blue-50 p-4 rounded-xl text-sm border border-blue-100"><b>ผลการแก้ไข:</b> ${item.solution || 'อยู่ระหว่างดำเนินการ'}</div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div><p class="text-[10px] font-bold text-red-400 mb-1">📸 BEFORE</p><img src="${item.imgBefore || ''}" class="w-full h-40 object-cover rounded-xl border"></div>
                    <div><p class="text-[10px] font-bold text-emerald-400 mb-1">✅ AFTER</p><img src="${item.imgAfter || ''}" class="w-full h-40 object-cover rounded-xl border bg-slate-100"></div>
                </div>`;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const img = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                reporter: document.getElementById('reporter').value, dept: document.getElementById('dept').value,
                detail: document.getElementById('detail').value, imgBefore: img, status: "รอดำเนินการ"
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeModal('modal-form'); e.target.reset(); btn.innerText = "บันทึกข้อมูล"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            const newImg = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value, solution: document.getElementById('upSolution').value };
            if(newImg) updates.imgAfter = newImg;
            update(ref(db, `patrols/${currentPath}/${currentId}`), updates).then(() => { closeModal('modal-detail'); btn.innerText = "บันทึกการอัปเดต"; btn.disabled = false; });
        };

        document.getElementById('delBtn').onclick = () => { if(confirm('ยืนยันการลบ?')) { remove(ref(db, `patrols/${currentPath}/${currentId}`)); closeModal('modal-detail'); } };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
