<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safety Patrol & 5S 👷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .hidden { display: none !important; }
        
        /* สไตล์ช่องกรอกข้อมูลแยกตามสี */
        .input-group { margin-bottom: 1.25rem; }
        .label-blue { color: #2563eb; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.4rem; display: block; }
        .label-red { color: #dc2626; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.4rem; display: block; }
        .label-green { color: #16a34a; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.4rem; display: block; }
        
        .field-blue { border: 2px solid #dbeafe; border-radius: 0.75rem; padding: 0.75rem; width: 100%; transition: all 0.2s; }
        .field-blue:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .field-red { border: 2px solid #fee2e2; border-radius: 0.75rem; padding: 0.75rem; width: 100%; transition: all 0.2s; }
        .field-red:focus { border-color: #ef4444; outline: none; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

        .field-green { border: 2px solid #dcfce7; border-radius: 0.75rem; padding: 0.75rem; width: 100%; transition: all 0.2s; }
        .field-green:focus { border-color: #22c55e; outline: none; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1); }

        /* Dashboard Card */
        .month-card { background: white; border-radius: 1.5rem; padding: 1.5rem; border: 1px solid #e2e8f0; transition: all 0.3s; cursor: pointer; }
        .month-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-color: #3b82f6; }
        
        .stat-line { display: flex; justify-content: space-between; padding: 0.4rem 0.6rem; border-radius: 0.5rem; margin-top: 0.4rem; font-size: 0.8rem; font-weight: 700; }

        @media print {
            .no-print { display: none !important; }
            #page-list { display: block !important; padding: 0 !important; }
            .case-card { break-inside: avoid; border: 2px solid #f1f5f9 !important; padding: 20px !important; margin-bottom: 25px !important; border-radius: 15px !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>

    <div id="page-home" class="min-h-screen p-6">
        <div class="max-w-5xl mx-auto text-center mb-10">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-6 flex items-center justify-center gap-2">
                <i data-lucide="shield-check" class="text-blue-600"></i> Safety Patrol & 5S
            </h1>
            <div class="inline-flex items-center gap-3 bg-white p-3 rounded-2xl shadow-sm border">
                <span class="text-slate-400 text-sm font-bold uppercase">เลือกปี:</span>
                <select id="yearSelect" class="font-bold text-blue-600 outline-none text-lg bg-transparent"></select>
            </div>
        </div>
        <div id="monthGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-w-5xl mx-auto"></div>
    </div>

    <div id="page-list" class="hidden min-h-screen pb-20">
        <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b p-4 no-print">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <button onclick="goBackHome()" class="flex items-center gap-1 font-bold text-slate-500 hover:text-blue-600 transition-colors">
                    <i data-lucide="chevron-left"></i> กลับ
                </button>
                <h2 id="currentMonthTitle" class="font-bold text-slate-800"></h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-slate-100 p-2 rounded-lg text-slate-600"><i data-lucide="printer" size="20"></i></button>
                    <button onclick="openForm()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md shadow-blue-200">เพิ่มรายการ</button>
                </div>
            </div>
        </nav>
        <div id="dataItems" class="max-w-3xl mx-auto p-4 space-y-4"></div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-700 flex items-center gap-2"><i data-lucide="plus-circle" class="text-blue-500"></i> บันทึกข้อมูลการตรวจ</h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <div class="overflow-y-auto p-6">
                <form id="mainForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-blue-50/30 rounded-2xl border border-blue-100">
                        <div class="input-group">
                            <label class="label-blue italic">📅 วันที่ตรวจพบ</label>
                            <input type="date" id="postDate" required class="field-blue">
                        </div>
                        <div class="input-group">
                            <label class="label-blue italic">👤 ชื่อผู้รายงาน</label>
                            <input type="text" id="reporter" placeholder="ชื่อ-นามสกุล" required class="field-blue">
                        </div>
                        <div class="input-group">
                            <label class="label-blue italic">📍 แผนกที่ตรวจพบ</label>
                            <select id="dept" class="field-blue">
                                <option value="Welding">Welding</option>
                                <option value="Assembly">Assembly</option>
                                <option value="Manufacturing">Manufacturing</option>
                                <option value="Inventory">Inventory</option>
                                <option value="อื่นๆ">อื่นๆ</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="label-blue italic">🚩 หมวดหมู่</label>
                            <select id="category" class="field-blue">
                                <option value="Safety">Safety (ความปลอดภัย)</option>
                                <option value="5S">5S (5ส)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-6 p-4 bg-red-50/30 rounded-2xl border border-red-100">
                        <div class="input-group">
                            <label class="label-red italic">⚠️ รายละเอียดปัญหาที่พบ</label>
                            <textarea id="detail" rows="3" placeholder="อธิบายสิ่งที่พบเจอ..." required class="field-red"></textarea>
                        </div>
                        <div class="input-group">
                            <label class="label-red italic">📸 รูปภาพสถานะปัจจุบัน (ก่อนแก้ไข)</label>
                            <input type="file" id="imgBefore" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                        </div>
                    </div>

                    <div class="mb-6 p-4 bg-green-50/30 rounded-2xl border border-green-100">
                        <div class="input-group">
                            <label class="label-green italic">🛠️ แนวทางการแก้ไข (เบื้องต้น/ถาวร)</label>
                            <textarea id="solution" rows="2" placeholder="ระบุวิธีแก้ไข..." class="field-green"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="input-group">
                                <label class="label-green italic">👷 ผู้รับผิดชอบ (PIC)</label>
                                <input type="text" id="owner" placeholder="ระบุชื่อเจ้าของงาน" required class="field-green">
                            </div>
                            <div class="input-group">
                                <label class="label-green italic">⏱️ กำหนดเสร็จ (Due Date)</label>
                                <input type="date" id="dueDate" required class="field-green">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-extrabold text-lg shadow-lg transition-all active:scale-[0.98]">บันทึกข้อมูลเข้าระบบ</button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b flex justify-between items-center">
                <button id="deleteBtn" class="text-red-500 font-bold text-xs hover:underline">ลบรายการนี้</button>
                <button onclick="document.getElementById('modal-detail').classList.add('hidden')"><i data-lucide="x"></i></button>
            </div>
            <div id="detailScrollBody" class="overflow-y-auto p-6 bg-slate-50">
                <div id="detailViewContent" class="space-y-4 mb-6"></div>
                <div id="updateSection" class="bg-white p-5 rounded-2xl border-2 border-orange-100">
                    <h4 class="font-bold text-orange-600 mb-4 flex items-center gap-2"><i data-lucide="wrench"></i> อัปเดตงานแก้ไข</h4>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">วันที่แก้ไขจริง</label>
                            <input type="date" id="upActualDate" class="w-full p-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">เปลี่ยนสถานะ</label>
                            <select id="upStatus" class="w-full p-2 border rounded-lg">
                                <option value="รอดำเนินการ">รอดำเนินการ</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                            </select>
                        </div>
                    </div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">รูปถ่ายหลังแก้ไข</label>
                    <input type="file" id="upImgAfter" class="w-full text-sm mb-4">
                    <button id="saveUpdateBtn" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">บันทึกการอัปเดต</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://robust-helix-471007-m7-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = getDatabase(app);

        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let currentPath = "";
        let currentEditingId = "";

        // สร้างตัวเลือกปี 2026-2099
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2026; y <= 2099; y++) {
            const opt = document.createElement('option'); opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        }

        function initHome() {
            const grid = document.getElementById('monthGrid'); grid.innerHTML = "";
            months.forEach((m, i) => {
                const monthId = `${yearSelect.value}-${String(i + 1).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'month-card';
                div.innerHTML = `<div class="font-bold text-slate-700 text-lg mb-3">${m}</div><div id="stats-${monthId}"></div>`;
                onValue(ref(db, `patrols/${monthId}`), (snap) => {
                    const statsDiv = document.getElementById(`stats-${monthId}`);
                    const data = snap.val();
                    if (data) {
                        const total = Object.keys(data).length;
                        const done = Object.values(data).filter(v => v.status === 'เสร็จสิ้น').length;
                        statsDiv.innerHTML = `
                            <div class="stat-line bg-blue-50 text-blue-600"><span>พบทั้งหมด</span> <span>${total}</span></div>
                            <div class="stat-line bg-green-50 text-green-600"><span>เสร็จสิ้น</span> <span>${done}</span></div>
                            <div class="stat-line bg-orange-50 text-orange-600"><span>คงเหลือ</span> <span>${total-done}</span></div>
                        `;
                    } else { statsDiv.innerHTML = `<div class="text-xs text-slate-300 italic py-4">ไม่มีข้อมูล</div>`; }
                });
                div.onclick = () => { 
                    currentPath = monthId; 
                    document.getElementById('page-home').classList.add('hidden'); 
                    document.getElementById('page-list').classList.remove('hidden'); 
                    document.getElementById('currentMonthTitle').innerText = `${m} ${yearSelect.value}`;
                    listenData(); 
                };
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function listenData() {
            onValue(ref(db, `patrols/${currentPath}`), (snap) => {
                const container = document.getElementById('dataItems'); container.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, item]) => {
                        const isDone = item.status === 'เสร็จสิ้น';
                        container.innerHTML += `
                            <div onclick='openDetail("${id}", ${JSON.stringify(item)})' class="case-card bg-white p-5 rounded-2xl shadow-sm border-l-4 ${isDone ? 'border-green-500' : 'border-red-500'} cursor-pointer">
                                <div class="flex justify-between mb-2">
                                    <span class="text-[10px] font-extrabold px-2 py-1 bg-slate-100 rounded text-slate-500 uppercase">${item.dept} | ${item.category}</span>
                                    <span class="text-xs font-bold ${isDone ? 'text-green-600' : 'text-red-500'}">${item.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-800 leading-tight mb-3">${item.detail}</h3>
                                <div class="flex justify-between items-center pt-3 border-t text-[11px] font-bold text-slate-400">
                                    <span>👤 ${item.reporter}</span>
                                    <span>📅 Due: ${item.dueDate}</span>
                                </div>
                            </div>`;
                    });
                }
                lucide.createIcons();
            });
        }

        window.openDetail = (id, item) => {
            currentEditingId = id;
            const content = document.getElementById('detailViewContent');
            const updateSec = document.getElementById('updateSection');
            if(item.status === 'เสร็จสิ้น') updateSec.classList.add('hidden');
            else updateSec.classList.remove('hidden');

            content.innerHTML = `
                <div class="bg-white p-5 rounded-2xl shadow-sm border">
                    <h2 class="font-bold text-slate-800 mb-4">${item.detail}</h2>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div class="p-3 bg-slate-50 rounded-xl"><strong>ผู้รายงาน:</strong><br>${item.reporter}</div>
                        <div class="p-3 bg-slate-50 rounded-xl"><strong>ผู้รับผิดชอบ:</strong><br>${item.owner}</div>
                        <div class="p-3 bg-red-50 text-red-700 rounded-xl"><strong>กำหนด:</strong><br>${item.dueDate}</div>
                        <div class="p-3 bg-green-50 text-green-700 rounded-xl"><strong>เสร็จจริง:</strong><br>${item.actualDate || '-'}</div>
                    </div>
                    <div class="mt-4 p-3 bg-blue-50 rounded-xl text-xs text-blue-800"><strong>แนวทางแก้ไข:</strong><br>${item.solution || '-'}</div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="relative"><span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded font-bold">BEFORE</span><img src="${item.imgBefore}" class="w-full rounded-xl"></div>
                    ${item.imgAfter ? `<div class="relative"><span class="absolute top-2 left-2 bg-green-500 text-white text-[10px] px-2 py-1 rounded font-bold">AFTER</span><img src="${item.imgAfter}" class="w-full rounded-xl border-2 border-green-500"></div>` : ''}
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        const processImg = async (file) => {
            if (!file) return null;
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังบันทึกข้อมูล..."; btn.disabled = true;
            const imgData = await processImg(document.getElementById('imgBefore').files[0]);
            const payload = {
                postDate: document.getElementById('postDate').value, reporter: document.getElementById('reporter').value,
                dept: document.getElementById('dept').value, category: document.getElementById('category').value,
                owner: document.getElementById('owner').value, dueDate: document.getElementById('dueDate').value,
                detail: document.getElementById('detail').value, solution: document.getElementById('solution').value,
                imgBefore: imgData || "", status: "รอดำเนินการ", ts: new Date().getTime()
            };
            push(ref(db, `patrols/${currentPath}`), payload).then(() => { closeForm(); e.target.reset(); btn.innerText = "บันทึกข้อมูลเข้าระบบ"; btn.disabled = false; });
        };

        document.getElementById('saveUpdateBtn').onclick = async () => {
            const btn = document.getElementById('saveUpdateBtn'); btn.innerText = "กำลังบันทึก...";
            const imgAfterData = await processImg(document.getElementById('upImgAfter').files[0]);
            const updates = { status: document.getElementById('upStatus').value, actualDate: document.getElementById('upActualDate').value };
            if(imgAfterData) updates.imgAfter = imgAfterData;
            update(ref(db, `patrols/${currentPath}/${currentEditingId}`), updates).then(() => { 
                document.getElementById('modal-detail').classList.add('hidden'); btn.innerText = "บันทึกการอัปเดต";
            });
        };

        document.getElementById('deleteBtn').onclick = () => { if(confirm('ยืนยันการลบข้อมูล?')) remove(ref(db, `patrols/${currentPath}/${currentEditingId}`)).then(() => document.getElementById('modal-detail').classList.add('hidden')); };
        window.goBackHome = () => { document.getElementById('page-list').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); };
        window.openForm = () => document.getElementById('modal-form').classList.remove('hidden');
        window.closeForm = () => document.getElementById('modal-form').classList.add('hidden');
        yearSelect.onchange = initHome;
        initHome();
    </script>
</body>
</html>
